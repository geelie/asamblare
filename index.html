            if (!fileFactura || !filePv) {
              msg.textContent = "Factura și P.V. de predare sunt obligatorii.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }
            if (garantieBifata && !fileGarantie) {
              msg.textContent =
                "Ai bifat Garanție extinsă — încarcă și documentul aferent.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Se salvează...";
            msg.textContent = "";

            try {
              const facturaPath = await incarcaDocumentVanzare(
                produs.id,
                fileFactura,
                "factura",
              );
              const pvPath = await incarcaDocumentVanzare(
                produs.id,
                filePv,
                "pv_predare",
              );
              const garantiePath = garantieBifata
                ? await incarcaDocumentVanzare(
                    produs.id,
                    fileGarantie,
                    "garantie_extinsa",
                  )
                : null;

              const { error } = await supa
                .from("produse")
                .update({
                  vandut: true,
                  ...(marcheazaVanzareDirecta ? { vanzare_directa: true } : {}),
                  data_vanzare: new Date().toISOString(),
                  vandut_de: currentUser.id,
                  client_nume: document.getElementById("vanzare-client-nume")
                    .value,
                  client_adresa: document.getElementById(
                    "vanzare-client-adresa",
                  ).value,
                  client_telefon: document.getElementById(
                    "vanzare-client-telefon",
                  ).value,
                  client_email: document.getElementById("vanzare-client-email")
                    .value,
                  garantie_extinsa: garantieBifata,
                  factura_url: facturaPath,
                  pv_predare_url: pvPath,
                  garantie_extinsa_url: garantiePath,
                })
                .eq("id", produs.id);
              if (error) throw error;

              toast("Produsul a fost marcat ca vândut.");
              inregistreazaLog(
                "produs",
                produs.id,
                "Vânzare către client final",
                `ID produs: ${produs.id_produs} · Client: ${document.getElementById("vanzare-client-nume").value}`,
              );
              overlay.remove();
              if (typeof refresh === "function") refresh();
            } catch (err) {
              msg.textContent = "Eroare la salvarea vânzării: " + err.message;
              msg.className = "text-sm text-center text-red-600";
              submitBtn.disabled = false;
              submitBtn.textContent = "Salvează vânzarea";
            }
          });
      }

      async function executaReturProdusVandut(produs, refresh) {
        const ok1 = confirm(
          `Sigur returnezi produsul ${produs.id_produs}? Toate datele vânzării (client, documente) vor fi șterse definitiv, iar produsul va reveni în stoc.`,
        );
        if (!ok1) return;
        const ok2 = confirm(
          "Confirmă din nou: acțiunea este ireversibilă și nu poate fi anulată.",
        );
        if (!ok2) return;

        try {
          const pathuriDocumente = [
            produs.factura_url,
            produs.pv_predare_url,
            produs.garantie_extinsa_url,
          ].filter(Boolean);
          if (pathuriDocumente.length) {
            const { error: delErr } = await supa.storage
              .from(BUCKET_VANZARI)
              .remove(pathuriDocumente);
            if (delErr) throw delErr;
          }

          const payload = {
            vandut: false,
            data_vanzare: null,
            vandut_de: null,
            client_nume: null,
            client_adresa: null,
            client_telefon: null,
            client_email: null,
            garantie_extinsa: false,
            factura_url: null,
            pv_predare_url: null,
            garantie_extinsa_url: null,
            data_ultimului_retur: new Date().toISOString(),
          };
          if (produs.vanzare_directa) payload.vanzare_directa = false;

          const { error } = await supa
            .from("produse")
            .update(payload)
            .eq("id", produs.id);
          if (error) throw error;

          toast("Produsul a fost returnat.");
          inregistreazaLog(
            "produs",
            produs.id,
            "Retur produs vândut",
            `ID produs: ${produs.id_produs}`,
          );
          if (typeof refresh === "function") refresh();
        } catch (err) {
          toast("Eroare la retur: " + err.message, true);
        }
      }

          );

      }

      async function scopStatisticiRol() {
        if (
          currentProfile.role === "admin" ||
          currentProfile.role === "superadmin"
        ) {
          return { all: true, ids: [] };
        }
        if (currentProfile.role === "magazin") {
          return { all: false, ids: [currentUser.id] };
        }
        if (currentProfile.role === "agent") {
          const { data } = await supa
            .from("agent_magazine")
            .select("*")
            .eq("agent_id", currentUser.id);
          return { all: false, ids: (data || []).map((a) => a.magazin_id) };

            .eq("hub_id", currentUser.id);
          return {
            all: false,
            ids: [...(data || []).map((a) => a.magazin_id), currentUser.id],
          };
        }
        return { all: false, ids: [] };

      function presetariPerioadaStatistici() {
        const azi = new Date();
        const iso = (d) => d.toISOString().slice(0, 10);
        const inceputSaptamana = new Date(azi);
        const ziuaSaptamanii = (azi.getDay() + 6) % 7;
        inceputSaptamana.setDate(azi.getDate() - ziuaSaptamanii);
        const inceputLuna = new Date(azi.getFullYear(), azi.getMonth(), 1);
        const inceputLunaTrecuta = new Date(
          azi.getFullYear(),
          azi.getMonth() - 1,
          1,
        );
        const sfarsitLunaTrecuta = new Date(
          azi.getFullYear(),
          azi.getMonth(),
          0,
        );
        const inceputSemestru = new Date(
          azi.getFullYear(),
          azi.getMonth() < 6 ? 0 : 6,
          1,
        );
        const inceputAn = new Date(azi.getFullYear(), 0, 1);
        return [
          {
            key: "saptamana",
            label: "Săptămâna curentă",
            start: iso(inceputSaptamana),
            end: iso(azi),
          },
          {
            key: "luna",
            label: "Luna curentă",
            start: iso(inceputLuna),
            end: iso(azi),
          },
          {
            key: "luna_trecuta",
            label: "Luna trecută",
            start: iso(inceputLunaTrecuta),
            end: iso(sfarsitLunaTrecuta),
          },
          {
            key: "semestru",
            label: "Semestrul curent",
            start: iso(inceputSemestru),
            end: iso(azi),
          },
          {
            key: "an",
            label: "Anul curent",
            start: iso(inceputAn),
            end: iso(azi),

      async function exportStatisticiExcel(
        meta,
        coloane,
        randuri,
        getValoare,
        randTotal,
      ) {
        try {
          await ensureExcelJS();
        } catch (e) {
          toast(e.message || "Nu s-a putut încărca modulul Excel.", true);
          return;
        }
        const antete = ["Nr. crt.", ...coloane.map((c) => c.label)];
        const randuriDate = randuri.map((r, i) => [
          i + 1,
          ...coloane.map((c) => getValoare(r, c.key)),
        ]);
        const randTotalValori = randTotal
          ? ["", ...coloane.map((c) => randTotal[c.key] || "")]
          : null;

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet(meta.tipLabel.slice(0, 31));

        const toateRandurile = [
          antete,
          ...randuriDate,
          ...(randTotalValori ? [randTotalValori] : []),
        ];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 45) };
        });

        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRand(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }

        stilizeazaRand(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRand(ws.addRow(r), false));
        if (randTotalValori) stilizeazaRand(ws.addRow(randTotalValori), true);

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Statistici_${meta.tipLabel}_${meta.start}_${meta.end}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function construiesteQueryJurnal(state) {
        let q = supa.from("jurnal_actiuni").select("*", { count: "exact" });
        if (state.start) q = q.gte("created_at", state.start + "T00:00:00");
        if (state.end) q = q.lte("created_at", state.end + "T23:59:59");
        const numeVal = (state.utilizatorNume || "").trim();
        if (numeVal) {
          q = q.ilike(
            "efectuat_de_nume",
            `%${numeVal.replace(/[%_]/g, (m) => "\\" + m)}%`,
          );
        }

        return q.order("created_at", { ascending: false });
      }

          }
          if (r.tip_entitate === "comanda") {
            return hartaComenziExport[r.entitate_id] || "";
          }
          return "";
        }

        const antete = [
          "Nr. crt.",
          "Dată/Oră",
          "Utilizator",
          "Tip entitate",
          "ID/Nr.",
          "Acțiune",
          "Detalii",
        ];
        const randuriDate = randuri.map((r, i) => [
          i + 1,
          jurnalDataOraText(r.created_at),
          r.efectuat_de_nume || "",
          tipEntitateJurnalLabel(r.tip_entitate),
          idNrPentruExport(r),
          r.actiune || "",
          r.detalii || "",
        ]);

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Jurnal");
        const toateRandurile = [antete, ...randuriDate];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 60) };
        });
        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRandJurnal(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = {
              horizontal: "center",
              vertical: "middle",
              wrapText: true,
            };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }
        stilizeazaRandJurnal(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRandJurnal(ws.addRow(r), false));

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${numeFisier}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function stergeInregistrariJurnal(randuri, onDone) {
        const randuriStergibile = (randuri || []).filter(
          (r) => r.tip_entitate !== "jurnal",
        );
        if (!randuriStergibile.length) {
          toast("Nu există înregistrări de șters pentru acest export.");
          return;

        const ok = confirm(
          `Vei șterge definitiv ${randuriStergibile.length} înregistrări din jurnal (cele exportate mai sus). Acțiunea nu poate fi anulată. Continui?`,
        );
        if (!ok) return;
        const ids = randuriStergibile.map((r) => r.id);
        const CHUNK = 500;
        let stersTotal = 0;
        for (let i = 0; i < ids.length; i += CHUNK) {
          const bucata = ids.slice(i, i + CHUNK);
          const { error } = await supa
            .from("jurnal_actiuni")
            .delete()
            .in("id", bucata);
          if (error) {
            toast(
              `Eroare la ștergere (după ${stersTotal} șterse): ${error.message}`,
              true,
            );
            if (onDone) onDone();
            return;
          }
          stersTotal += bucata.length;
        }
        toast(
          `${stersTotal} înregistrări exportate au fost șterse din jurnal.`,
        );
        if (onDone) onDone();
      }

      const BUCKET_DOCUMENTATIE = "documente-produse";
      let documentatieTipFiltru = "toate";

      const TIPURI_DOCUMENTATIE = {
        garantii: "Garanții",
        manuale: "Manuale de utilizare",

      function labelTipDocumentatie(tip) {

      async function incarcaDocumentProdus(file, denumire, tip) {
        const extensie = (file.name.split(".").pop() || "pdf").toLowerCase();
        const path = `${tip}/${crypto.randomUUID()}_${Date.now()}.${extensie}`;
        const { error: storageErr } = await supa.storage
          .from(BUCKET_DOCUMENTATIE)
          .upload(path, file, { upsert: true, contentType: file.type });
        if (storageErr) throw storageErr;

        const { error: dbErr } = await supa.from("documente_produse").insert({
          denumire,
          tip,
          path,
          nume_fisier: file.name,
          incarcat_de: currentUser.id,
        });
        if (dbErr) throw dbErr;
      }

      async function obtineUrlSemnatDocumentatie(path, numeDescarcare) {
        const { data, error } = await supa.storage
          .from(BUCKET_DOCUMENTATIE)
          .createSignedUrl(
            path,
            300,
            numeDescarcare ? { download: numeDescarcare } : undefined,
          );
        if (error) throw error;
        return data.signedUrl;
      }

      function extensieDocumentatie(doc) {
        const sursa = doc.nume_fisier || doc.path || "";
        const ext = sursa.split(".").pop();
        return ext && ext.length <= 6 ? ext.toLowerCase() : "pdf";
      }

      function sanitizeazaNumeDescarcareDocumentatie(nume) {
        return String(nume)
          .replace(/[\\/:*?"<>|]/g, "-")
          .trim();
      }

      async function cautaDocumenteProduse(tipFiltru, termen, from, to) {
        let query = supa
          .from("documente_produse")
          .select("id, denumire, tip, path, nume_fisier", { count: "exact" });
        if (tipFiltru && tipFiltru !== "toate")
          query = query.eq("tip", tipFiltru);
        const t = (termen || "").trim();
        if (t) {
          const escapat = t.replace(/[%_]/g, (m) => "\\" + m);
          query = query.ilike("denumire", `%${escapat}%`);
        }
        return query.order("denumire", { ascending: true }).range(from, to);
      }

      async function redenumesteDocumentProdus(id, denumireNoua) {
        const { error } = await supa
          .from("documente_produse")
          .update({ denumire: denumireNoua })
          .eq("id", id);
        if (error) throw error;
      }

      async function stergeDocumentProdus(doc) {
        const { error: storageErr } = await supa.storage
          .from(BUCKET_DOCUMENTATIE)
          .remove([doc.path]);
        if (storageErr) throw storageErr;
        const { error: dbErr } = await supa
          .from("documente_produse")
          .delete()
          .eq("id", doc.id);
        if (dbErr) throw dbErr;
      }

      function bindDocumentatieTableEvents(container, docuri, refresh) {
        container.querySelectorAll("[data-doc-descarca]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const doc = docuri.find(
              (d) => d.id === btn.getAttribute("data-doc-descarca"),
            );
            if (!doc) return;
            const labelInitial = btn.textContent;
            btn.textContent = "Se descarcă...";
            try {
              const numeDescarcare = `${sanitizeazaNumeDescarcareDocumentatie(doc.denumire)}.${extensieDocumentatie(doc)}`;
              const url = await obtineUrlSemnatDocumentatie(
                doc.path,
                numeDescarcare,
              );
              window.open(url, "_blank");

              toast("Eroare la descărcare: " + err.message, true);

              btn.textContent = labelInitial;

            if (state.stadiuPlata === "neachitat")
              q = q.is("stadiu_plata", null);
            else if (state.stadiuPlata)
              q = q.eq("stadiu_plata", state.stadiuPlata);
            const aziStr = new Date().toISOString().slice(0, 10);
            if (state.stadiuTermen === "depasit") {
              q = q
                .or("stadiu_plata.is.null,stadiu_plata.eq.partial")
                .lt("data_limita_plata", aziStr);
            } else if (state.stadiuTermen === "achitat_intarziat") {
              q = q
                .eq("stadiu_plata", "integral")
                .not("achitat_integral_la", "is", null);
            }
            const orFilter = buildSearchOrFilter(termen, [
              "numar_comanda",
              "agent",
              "observatii",
            ]);
            if (orFilter) q = q.or(orFilter);
            q = q.order("created_at", { ascending: false });

            let { data: comenzi, error } = await q;
            if (error) {
              resultsEl.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(error.message)}</div>`;
              return;
            }
            if (state.stadiuTermen) {
              comenzi = (comenzi || []).filter(
                (c) => statusTermenPlata(c).stare === state.stadiuTermen,
              );
            }
            const comenziIds = (comenzi || []).map((c) => c.id);
            const { data: linii } = comenziIds.length
              ? await supa
                  .from("comanda_produse")
                  .select("*")
                  .in("comanda_id", comenziIds)
              : { data: [] };
            const liniiPerComanda = new Map();
            (linii || []).forEach((l) => {
              if (!liniiPerComanda.has(l.comanda_id))
                liniiPerComanda.set(l.comanda_id, []);
              liniiPerComanda.get(l.comanda_id).push(l);
            });

            const coloane = coloaneStatisticiComenzi();
            const getValoare = (c, key) =>
              randValoareComanda(c, toateMagazinele, liniiPerComanda, key);
            const coloaneVizibile = coloaneCuDate(
              coloane,
              comenzi || [],
              getValoare,
            );
            const arataTopMagazine =
              esteAdmin &&
              ["depasit", "achitat_intarziat"].includes(state.stadiuTermen) &&
              !state.magazinId;
            const topMagazine = arataTopMagazine
              ? calculeazaTopMagazine(comenzi || [], toateMagazinele)
              : [];
            resultsEl.innerHTML = `
      <p class="text-sm text-slate-500 mb-2 shrink-0">${(comenzi || []).length} comand${(comenzi || []).length === 1 ? "ă" : "ă"} găsit${(comenzi || []).length === 1 ? "ă" : "e"} pentru filtrele selectate</p>
      ${arataTopMagazine ? topMagazineHtml(topMagazine) : ""}
      ${tabelStatisticiHtml(coloaneVizibile, comenzi || [], getValoare)}`;

            resultsEl.querySelectorAll(".top-magazin-row").forEach((el) => {
              el.addEventListener("click", () => {
                const id = el.dataset.topMagazinId;
                if (!id) return;
                state.magazinId =
                  id === "vanzare_directa" ? "vanzare_directa" : id;
                renderStatisticiTab(container);
              });
            });

            const topMagazineToggleBtn = document.getElementById(
              "top-magazine-toggle",
            );
            if (topMagazineToggleBtn) {
              topMagazineToggleBtn.addEventListener("click", () => {
                const body = document.getElementById("top-magazine-body");
                const icon = document.getElementById(
                  "top-magazine-toggle-icon",
                );
                const isHidden = body.classList.toggle("hidden");
                icon.textContent = isHidden ? "+" : "-";
              });
            }

            resultsEl.querySelectorAll(".stat-comanda-link").forEach((el) => {
              el.addEventListener("click", () => {
                const comanda = (comenzi || []).find(
                  (c) => String(c.id) === el.dataset.statComandaId,
                );
                if (comanda) {
                  deschideComandaInitiala(
                    comanda,
                    liniiPerComanda.get(comanda.id) || [],
                    profiles || [],
                  );
                }
              });
            });

            ultimulRaport = {
              meta: {
                tipLabel: "Comenzi",
                start: state.start,
                end: state.end,
                scopLabel: state.magazinId
                  ? magazinLabelDin(magazineFiltruList, state.magazinId)
                  : scope.all
                    ? "Toate magazinele"
                    : "Magazinele mele",
              },
              coloane: coloaneVizibile,
              randuri: comenzi || [],
              getValoare,
            };
            return;
          }

          const coloaneCautare = [
            "id_produs",
            "agent",
            "categorie",
            "marca",
            "culoare",
            "vin",
            "client_nume",
            "client_telefon",
            "client_email",
          ];
          const orFilter = buildSearchOrFilter(termen, coloaneCautare);

          function construiesteQuerySubset(subset) {
            let qs = supa.from("produse").select("*");
            const evenimentActiv = state.returnat || state.relocat;
            if (subset === "stoc_central") {
              qs = qs.is("magazin_id", null).eq("vandut", false);
              if (!evenimentActiv) {
                qs = qs
                  .gte("created_at", state.start + "T00:00:00")
                  .lte("created_at", state.end + "T23:59:59");
              }
            } else if (subset === "stoc_magazine") {
              qs = idsEfective
                ? qs.in("magazin_id", idsEfective)
                : qs.not("magazin_id", "is", null);
              qs = qs.eq("vandut", false);
              if (!evenimentActiv) {
                qs = qs
                  .gte("data_comenzii", state.start)
                  .lte("data_comenzii", state.end);
              }
            } else if (subset === "vandute") {
              if (idsEfective) qs = qs.in("magazin_id", idsEfective);
              qs = qs.eq("vandut", true);
              if (!evenimentActiv) {
                qs = qs
                  .gte("data_vanzare", state.start + "T00:00:00")
                  .lte("data_vanzare", state.end + "T23:59:59");
              }
            } else {
              // toate
              if (idsEfective) qs = qs.in("magazin_id", idsEfective);
              if (!evenimentActiv) {
                qs = qs
                  .gte("created_at", state.start + "T00:00:00")
                  .lte("created_at", state.end + "T23:59:59");
              }
            }
            if (state.categorie) qs = qs.eq("categorie", state.categorie);
            if (state.marca) qs = qs.ilike("marca", `%${state.marca}%`);
            if (state.model) qs = qs.ilike("model", `%${state.model}%`);
            if (state.culoare) qs = qs.ilike("culoare", `%${state.culoare}%`);
            if (state.agentNume) qs = qs.ilike("agent", `%${state.agentNume}%`);
            if (state.garantieExtinsa === "da")
              qs = qs.eq("garantie_extinsa", true);
            else if (state.garantieExtinsa === "nu")
              qs = qs.eq("garantie_extinsa", false);
            if (state.civ === "da") qs = qs.eq("civ", true);
            else if (state.civ === "nu") qs = qs.eq("civ", false);
            if (state.returnat && state.relocat) {
              qs = qs.or(
                `and(data_ultimului_retur.gte.${state.start}T00:00:00,data_ultimului_retur.lte.${state.end}T23:59:59),and(data_ultimei_relocari.gte.${state.start}T00:00:00,data_ultimei_relocari.lte.${state.end}T23:59:59)`,
              );
            } else if (state.returnat) {
              qs = qs
                .not("data_ultimului_retur", "is", null)
                .gte("data_ultimului_retur", state.start + "T00:00:00")
                .lte("data_ultimului_retur", state.end + "T23:59:59");
            } else if (state.relocat) {
              qs = qs
                .not("data_ultimei_relocari", "is", null)
                .gte("data_ultimei_relocari", state.start + "T00:00:00")
                .lte("data_ultimei_relocari", state.end + "T23:59:59");
            }
            if (filtruVanzareDirecta) qs = qs.eq("vanzare_directa", true);
            if (orFilter) qs = qs.or(orFilter);
            return qs;
          }

          const subseturiActive = state.subTipuri.includes("toate")
            ? ["toate"]
            : state.subTipuri;

          const rezultateSubset = await Promise.all(
            subseturiActive.map((s) => construiesteQuerySubset(s)),
          );
          const eroareProduse = rezultateSubset.find((r) => r.error)?.error;
          if (eroareProduse) {
            resultsEl.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(eroareProduse.message)}</div>`;
            return;
          }
          const produseIdVazute = new Set();
          let produse = [];
          rezultateSubset.forEach((r) => {
            (r.data || []).forEach((p) => {
              if (produseIdVazute.has(p.id)) return;
              produseIdVazute.add(p.id);
              produse.push(p);
            });
          });
          produse.sort((a, b) =>
            (b.created_at || "").localeCompare(a.created_at || ""),
          );

          const coloane = coloaneStatisticiProduse(currentProfile.role);
          const getValoare = (p, key) =>
            randValoareProdus(p, toateMagazinele, key);
          const coloaneVizibile = coloaneCuDate(
            coloane,
            produse || [],
            getValoare,
          );
          const randTotal =
            state.afiseazaTotal && (produse || []).length
              ? calculeazaRandTotalProduse(coloaneVizibile, produse || [])
              : null;
          const arataTopMagazineVanzari =
            esteAdmin &&
            subseturiActive.includes("vandute") &&
            !state.magazinId;
          const topMagazineVanzari = arataTopMagazineVanzari
            ? calculeazaTopMagazineVanzari(produse || [], toateMagazinele)
            : [];
          resultsEl.innerHTML = `
      <p class="text-sm text-slate-500 mb-2 shrink-0">${(produse || []).length} produs${(produse || []).length === 1 ? "" : "e"} găsit${(produse || []).length === 1 ? "" : "e"} pentru filtrele selectate</p>
      ${arataTopMagazineVanzari ? topMagazineVanzariHtml(topMagazineVanzari) : ""}
      ${tabelStatisticiHtml(coloaneVizibile, produse || [], getValoare, randTotal)}`;

          resultsEl
            .querySelectorAll(".top-magazin-vanzari-row")
            .forEach((el) => {
              el.addEventListener("click", () => {
                const id = el.dataset.topMagazinVanzariId;
                if (!id) return;
                state.magazinId =
                  id === "vanzare_directa" ? "vanzare_directa" : id;
                renderStatisticiTab(container);
              });
            });

          const topMagazineVanzariToggleBtn = document.getElementById(
            "top-magazine-vanzari-toggle",
          );
          if (topMagazineVanzariToggleBtn) {
            topMagazineVanzariToggleBtn.addEventListener("click", () => {
              const body = document.getElementById("top-magazine-vanzari-body");
              const icon = document.getElementById(
                "top-magazine-vanzari-toggle-icon",
              );
              const isHidden = body.classList.toggle("hidden");
              icon.textContent = isHidden ? "+" : "-";
            });
          }

          ultimulRaport = {
            meta: {
              tipLabel: "Produse",
              start: state.start,
              end: state.end,
              scopLabel: state.magazinId
                ? magazinLabelDin(magazineFiltruList, state.magazinId)
                : scope.all
                  ? "Toate magazinele"
                  : "Magazinele mele",
            },
            coloane: coloaneVizibile,
            randuri: produse || [],
            getValoare,
            randTotal,
          };
        }

        document.getElementById("stat-aplica").addEventListener("click", () => {
          const magInput = document.getElementById("stat-magazin-id");
          if (magInput) state.magazinId = magInput.value;
          state.agentNume = document
            .getElementById("stat-agent-input")
            .value.trim();
          const catSel = document.getElementById("stat-categorie");
          if (catSel) state.categorie = catSel.value;
          const marcaInput = document.getElementById("stat-marca-input");
          if (marcaInput) state.marca = marcaInput.value.trim();
          const modelInput = document.getElementById("stat-model-input");
          if (modelInput) state.model = modelInput.value.trim();
          const culoareInput = document.getElementById("stat-culoare-input");
          if (culoareInput) state.culoare = culoareInput.value.trim();
          const garantieSel = document.getElementById("stat-garantie");
          if (garantieSel) state.garantieExtinsa = garantieSel.value;
          const civSel = document.getElementById("stat-civ");
          if (civSel) state.civ = civSel.value;
          const termenPlataInput = document.getElementById("stat-termen-plata");
          if (termenPlataInput)
            state.termenPlata = termenPlataInput.value.trim();
          const stadiuPlataSel = document.getElementById("stat-stadiu-plata");
          if (stadiuPlataSel) state.stadiuPlata = stadiuPlataSel.value;
          const stadiuTermenSel = document.getElementById("stat-stadiu-termen");
          if (stadiuTermenSel) state.stadiuTermen = stadiuTermenSel.value;
          incarcaSiAfiseaza();
        });
        document.getElementById("stat-reset").addEventListener("click", () => {
          statisticiState = statisticiStateImplicit();
          renderStatisticiTab(container);
        });
        document
          .getElementById("stat-export")
          .addEventListener("click", async () => {
            if (!ultimulRaport) {
              toast(
                "Aplică mai întâi filtrele pentru a genera un raport.",
                true,
              );
              return;
            }
            await exportStatisticiExcel(
              ultimulRaport.meta,
              ultimulRaport.coloane,
              ultimulRaport.randuri,
              ultimulRaport.getValoare,
              ultimulRaport.randTotal,
            );
          });

        await incarcaSiAfiseaza();
      }
    </script>
  </body>
</html>
