<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#161b22" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asamblare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <style>
      /* Design tokens preluate din aplicația de distribuții */
      :root {
        --graphite: #161b22;
        --graphite-2: #20272f;
        --teal: #0fbf9f;
        --teal-dark: #0b9b82;
        --amber: #f0a93b;
        --bg: #f5f7f8;
        --line: #e3e7e9;
        --card: #fff;
        --ink: #1e293b;
        --mut: #64748b;
        --gr: #161b22;
        --tb: #d9f5ee;
        --ok: #0b8a5f;
        --okb: #eaf7f0;
        --no: #b91c1c;
        --nob: #fee2e2;
        --wa: #b4650b;
        --wab: #fff1de;
        --bl: #1d6fa5;
        --blb: #e6f4ff;
        --sl: #64748b;
        --slb: #f1f2f4;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        --r: 16px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
      }
      h1,
      h2,
      h3,
      h4,
      .brand {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
      }
      h3 {
        font-size: 16px;
      }
      h4 {
        font-size: 14px;
      }
      button {
        font-family: inherit;
        touch-action: manipulation;
      }
      a {
        color: var(--teal-dark);
      }
      /* antet + navigare */
      header {
        background: var(--graphite);
        color: #fff;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
        padding-right: calc(16px + env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      header b {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
        font-size: 17px;
      }
      header small {
        color: #94a3b8;
      }
      nav {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 max(16px, calc((100% - 980px) / 2 + 16px));
        position: sticky;
        top: 0;
        z-index: 10;
      }
      nav::-webkit-scrollbar {
        display: none;
      }
      nav button {
        flex: 0 0 auto;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        color: #6b7280;
        padding: 14px 16px;
        min-height: 48px;
        font:
          600 14px Inter,
          system-ui,
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      nav button:hover {
        color: #111827;
      }
      nav button.on {
        background: transparent;
        border-color: var(--teal);
        color: #111827;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }
      /* carduri */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      /* câmpuri */
      input,
      textarea,
      select {
        border: 1px solid #d5dbe0;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
        width: 100%;
        min-height: 42px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: transparent;
        box-shadow: 0 0 0 2px var(--teal);
      }
      textarea {
        min-height: 64px;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: #9ca3af;
      }
      input[type="checkbox"] {
        width: 20px !important;
        height: 20px;
        min-height: 0;
        accent-color: var(--teal-dark);
        vertical-align: middle;
      }
      /* butoane */
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        min-height: 44px;
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        background: var(--teal);
        color: #0a1210;
        transition: background-color 0.12s ease;
      }
      .btn:hover {
        background: var(--teal-dark);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.red {
        background: var(--no);
        color: #fff;
      }
      .btn.red:hover {
        background: #991b1b;
      }
      .btn.gh {
        background: #fff;
        color: var(--ink);
        border: 1px solid #d5dbe0;
      }
      .btn.gh:hover {
        background: #f8fafb;
      }
      .btn.sm {
        padding: 6px 12px;
        min-height: 36px;
        font-size: 13px;
      }
      /* etichete stadiu */
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .p-in_asamblare {
        background: var(--wab);
        color: var(--wa);
      }
      .p-in_remediere {
        background: var(--nob);
        color: var(--no);
      }
      .p-asteapta_ctc {
        background: var(--slb);
        color: var(--sl);
      }
      .p-in_ctc {
        background: var(--blb);
        color: var(--bl);
      }
      .p-ctc_avizat {
        background: var(--okb);
        color: var(--ok);
      }
      /* fișă */
      .timer {
        font:
          700 24px Manrope,
          ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--teal-dark);
      }
      .crit {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .crit.nok {
        border-color: var(--no);
      }
      .crit.ok {
        border-color: var(--ok);
      }
      .tg {
        display: flex;
        gap: 8px;
      }
      .tg button {
        min-width: 72px;
        min-height: 46px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #d5dbe0;
        background: #fff;
        color: var(--ink);
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      .tg .ok {
        background: var(--okb);
        color: var(--ok);
        border-color: var(--ok);
      }
      .tg .no {
        background: var(--nob);
        color: var(--no);
        border-color: var(--no);
      }
      .def {
        margin-top: 10px;
        padding: 12px;
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 12px;
      }
      .ph {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0;
      }
      .ph img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .lbl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        color: var(--ink);
      }
      .lbl:hover {
        border-color: var(--teal-dark);
        background: #eefaf7;
      }
      .lbl input {
        display: none;
      }
      /* dashboard */
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .kpi:hover {
        border-color: var(--teal);
      }
      .kpi.on {
        border-color: var(--teal);
        box-shadow: 0 0 0 2px var(--tb);
      }
      .kpi b {
        display: block;
        font:
          800 26px Manrope,
          system-ui,
          sans-serif;
        margin-top: 4px;
      }
      .al {
        background: #fef3e2;
        color: #92400e;
        border: 1px solid #fde8c8;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 600px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid #eef1f3;
        font-size: 13px;
        white-space: nowrap;
      }
      th {
        color: var(--mut);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: #f8fafb;
      }
      tbody tr {
        background: #fff;
        transition: background-color 0.12s ease;
      }
      tbody tr:nth-child(2n) {
        background: #fafbfc;
      }
      tbody tr:hover {
        background: #eefaf7;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      /* bara de jos a fișei */
      .foot {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(
          to top,
          var(--bg) 82%,
          rgba(245, 247, 248, 0)
        );
      }
      /* autentificare */
      .auth {
        max-width: 380px;
        margin: 8vh auto;
        padding: 0 16px;
      }
      .auth h2 {
        font-size: 22px;
        margin: 0 0 14px;
      }
      .auth .card {
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }
      .auth .card > * {
        margin-bottom: 12px;
      }
      .auth .card > *:last-child {
        margin-bottom: 0;
      }
      /* notificare + fereastră modală */
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--graphite);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 99;
        display: none;
        max-width: 92%;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
      }
      #toast.e {
        background: var(--no);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(15, 20, 25, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
        animation: fadeIn 0.25s ease;
      }
      .ov > div {
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        max-height: 88dvh;
        overflow: auto;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
      }
      .tl div {
        padding: 8px 0;
        border-bottom: 1px solid #eef1f3;
        font-size: 14px;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header .btn.gh {
        background: transparent;
      }
      header .btn.gh:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* ---- tablete și telefoane ---- */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px;
          min-height: 46px;
        }
        .btn {
          min-height: 48px;
        }
        .btn.sm {
          min-height: 44px;
        }
        .lbl {
          min-height: 48px;
        }
        .tg button {
          min-height: 50px;
          min-width: 80px;
        }
        nav button {
          min-height: 52px;
        }
        th,
        td {
          padding: 10px 12px;
        }
      }
      @media (max-width: 820px) {
        main {
          padding: 12px 12px calc(32px + env(safe-area-inset-bottom, 0px));
        }
        .card {
          padding: 14px;
        }
        .ov {
          padding: 0;
          align-items: flex-end;
        }
        .ov > div {
          max-width: none;
          border-radius: 20px 20px 0 0;
          max-height: 92vh;
          max-height: 92dvh;
        }
      }
      @media (max-width: 640px) {
        .row[style*="nowrap"] {
          flex-wrap: wrap !important;
        }
        .row[style*="nowrap"]
          input:not([type="checkbox"]):not([type="number"]) {
          flex: 1 1 100%;
        }
        .foot > * {
          flex: 1 1 auto;
        }
        .foot .btn {
          width: 100%;
        }
        .foot > div:first-child {
          display: flex;
          gap: 8px;
        }
        .foot > div:first-child .btn {
          width: auto;
          flex: 1;
        }
        .tg {
          width: 100%;
        }
        .tg button {
          flex: 1;
        }
        .crit .row {
          align-items: stretch;
        }
        .ph img {
          width: 64px;
          height: 64px;
        }
        header b {
          font-size: 16px;
        }
      }
    </style>
  </head>

      function renderSetPassword() {
        clearInterval(tmr);
        $("#app").innerHTML =
          `<div class="auth"><h2>⚙️ Asamblare</h2><div class="card">
 <p class="mut">Alege o parolă nouă pentru cont.</p>
 <input id="pw1" type="password" placeholder="Parolă nouă (minim 6 caractere)" autocomplete="new-password">
 <input id="pw2" type="password" placeholder="Confirmă parola nouă" autocomplete="new-password">
 <button class="btn" style="width:100%" id="go2">Salvează parola</button></div></div>`;
        $("#go2").onclick = async () => {
          const a = $("#pw1").value,
            b = $("#pw2").value;
          if (a.length < 6)
            return toast("Parola trebuie să aibă minim 6 caractere.", 1);
          if (a !== b) return toast("Parolele introduse nu coincid.", 1);
          const btn = $("#go2");
          btn.disabled = true;
          btn.textContent = "Se salvează...";
          const r = await sb.auth.updateUser({ password: a });
          if (r.error) {
            btn.disabled = false;
            btn.textContent = "Salvează parola";
            return toast(r.error.message, 1);
          }
          recoverMode = false;
          await sb.auth.signOut();
          authView("login");
          toast("Parolă actualizată. Autentifică-te cu noua parolă.");
        };
      }
      function authView(mode = "login") {
        clearInterval(tmr);
        $("#app").innerHTML =
          `<div class="auth"><h2>⚙️ Asamblare</h2><div class="card">
 <input id="em" type="email" placeholder="Email" autocomplete="username">
 ${mode === "forgot" ? "" : '<input id="pw" type="password" placeholder="Parolă (minim 6 caractere)" autocomplete="current-password">'}

 <div class="mut" style="text-align:center"><a href="#" data-m="login">Autentificare</a> · <a href="#" data-m="signup">Cont nou</a> · <a href="#" data-m="forgot">Am uitat parola</a></div>

        document.querySelectorAll("[data-m]").forEach(
          (a) =>
            (a.onclick = (e) => {
              e.preventDefault();
              authView(a.dataset.m);
            }),
        );
        $("#go").onclick = async () => {
          const email = $("#em").value.trim(),
            password = $("#pw")?.value,
            url = location.href.split("#")[0];
          let r;
          if (mode === "login")
            r = await sb.auth.signInWithPassword({ email, password });
          else if (mode === "signup")
            r = await sb.auth.signUp({
              email,
              password,
              options: { emailRedirectTo: url },
            });
          else
            r = await sb.auth.resetPasswordForEmail(email, { redirectTo: url });
          if (r.error)
            return toast(
              r.error.message === "Invalid login credentials"
                ? "Email sau parolă incorectă."
                : r.error.message,
              1,
            );
          if (mode !== "login")
            toast(
              mode === "signup"
                ? "Verifică emailul pentru confirmare."
                : "Link trimis pe email.",
            );
        };
      }

          .from("asm_setari")
          .select("*")
          .eq("id", 1)
          .single();
        S = s || {
          max_in_lucru: 3,
          prag_alerta_ore: 8,
          ctc_alerta_zile: 3,
          poze_obligatorii: true,
        };
        const { data: pr } = await sb.from("profiles").select("id,nume,email");
        (pr || []).forEach((x) => (names[x.id] = x.nume || x.email));
        names[me.id] = me.nume || me.email;
        $("#app").innerHTML =
          `<header><div><b>⚙️ Asamblare</b> <small>· ${ROL[p.role]} · ${esc(names[me.id])}</small></div><button class="btn gh sm" style="color:#fff;border-color:#475569" id="lo">Deconectare</button></header><nav>${TABS[p.role].map((t) => `<button data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join("")}</nav><main id="c"></main>`;
        $("#lo").onclick = () => sb.auth.signOut();
        if (rt) sb.removeChannel(rt);
        rt = sb
          .channel("asm")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "asm_produse" },
            () => {
              if (!F && tab !== "preia" && !document.querySelector(".ov")) {
                clearTimeout(rt._d);
                rt._d = setTimeout(() => go(tab), 600);
              }
            },
          )
          .subscribe();
        go(TABS[p.role][0][0]);
      }
      let booting = false;
      async function boot0() {
        if (booting) return;
        booting = true;
        try {
          await boot();
        } finally {
          booting = false;
        }
      }
      sb.auth.onAuthStateChange((ev, ss) => {
        if (ev === "PASSWORD_RECOVERY") {
          recoverMode = true;
          renderSetPassword();
          return;
        }
        if (ev === "SIGNED_OUT") {
          me = null;
          F = null;
          setTimeout(boot0, 0);
        } else if (
          ev === "SIGNED_IN" &&
          (!me || !ss || ss.user.id !== me.id) &&
          !recoverMode
        )
          setTimeout(boot0, 0);
      });

      /* ---------- NAV ---------- */
      const V = {
        preia: vPreia,
        lucru: vLucru,
        remediat: vRem,
        ctc: vCtc,
        stadii: vStadii,
        checklist: vCheck,
        setari: vSet,
      };
      function go(t) {
        F = null;
        clearInterval(tmr);
        tab = t;
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.t === t));
        V[t]($("#c"));
      }
      const act = {
        tab: (d) => go(d.t),
        preia: async (d) =>
          fisa(await rpc("asm_preia", { p_antedepozit_id: d.id })),
        open: (d) => (d.tip === "remediere" ? rem(d.id) : fisa(d.id)),
        prem: async (d) =>
          rem(await rpc("asm_preia_remediere", { p_asm: d.id })),
        pctc: async (d) => fisa(await rpc("asm_ctc_preia", { p_asm: d.id })),
        hist: (d) => ist(d.id),
        pdf: (d) => genereazaFisaPdf(d.id),
        elib: async (d) => {
          const m = prompt("Motiv eliberare:");
          if (m === null) return;
          await rpc("asm_elibereaza", { p_asm: d.id, p_motiv: m });
          go(tab);
        },
        revoc: async (d) => {
          const m = prompt("Motiv revocare aviz (obligatoriu):");
          if (!m) return;
          await rpc("asm_revoca_aviz", { p_asm: d.id, p_motiv: m });
          go(tab);
        },
        kpi: (d) => {
          stF = stF === d.s ? "" : d.s;
          go("stadii");
        },
        rez: (d) => setRez(+d.i, d.v),
        ner: (d) => addNer(d.c || null),
        back: () => go(tab),
        fin: async () => {
          await rpc(
            F.e.tip === "ctc"
              ? "asm_ctc_avizeaza"
              : "asm_finalizeaza_asamblare",
            { p_etapa: F.e.id },
          );
          toast(
            F.e.tip === "ctc"
              ? "Aviz CTC acordat."
              : "Produs trimis în Depozit central.",
          );
          go(tab);
        },
        send: async () => {
          await rpc("asm_trimite_remediere", { p_etapa: F.e.id });
          toast("Produs trimis la remediere.");
          go(tab);
        },
        renunta: async () => {
          if (!confirm("Produsul revine în Antedepozit Import. Continui?"))
            return;
          await rpc("asm_renunta", {
            p_etapa: F.e.id,
            p_motiv: prompt("Motiv (opțional):") || null,
          });
          go(tab);
        },
        remfin: async () => {
          await rpc("asm_finalizeaza_remediere", {
            p_etapa: F.e.id,
            p_nota: $("#rn")?.value || null,
          });
          toast("Remediere finalizată. Produsul așteaptă CTC.");
          go(tab);
        },
        delsab: async (d) => {
          await sb.from("asm_checklist_sabloane").delete().eq("id", d.id);
          go("checklist");
        },
        addsab: async (d) => {
          const t = $("#ns-" + d.t).value.trim();
          if (!t) return;
          const mx = Math.max(
            0,
            ...(
              await sb
                .from("asm_checklist_sabloane")
                .select("ordine")
                .eq("tip", d.t)
            ).data.map((x) => x.ordine),
          );
          const r = await sb
            .from("asm_checklist_sabloane")
            .insert({ tip: d.t, text: t, ordine: mx + 1 });
          if (r.error) return toast(r.error.message, 1);
          go("checklist");
        },
        close: () => document.querySelector(".ov")?.remove(),
      };
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (b) {
          e.preventDefault();
          act[b.dataset.a]?.(b.dataset);
        }
      });
      document.addEventListener("change", async (e) => {
        const t = e.target,
          c = t.dataset.c;
        if (!c) return;
        if (c === "desc") {
          const n = F.ner.find((x) => x.id === t.dataset.id);
          n.descriere = t.value;
          const r = await sb
            .from("asm_nereguli")
            .update({ descriere: t.value })
            .eq("id", t.dataset.id);
          if (r.error) toast(r.error.message, 1);
          foot();
        } else if (c === "foto") foto(t);
        else if (c === "rd") {
          await rpc("asm_marcheaza_remediata", {
            p_neregula: t.dataset.id,
            p_remediata: t.checked,
            p_nota: $("#nt-" + t.dataset.id)?.value || null,
          });
          rem(F.e.id);
        } else if (c === "rnota") {
          const chk = $("#rc-" + t.dataset.id);
          if (chk.checked)
            await rpc("asm_marcheaza_remediata", {
              p_neregula: t.dataset.id,
              p_remediata: true,
              p_nota: t.value,
            });
        } else if (c === "sab") {
          const r = await sb
            .from("asm_checklist_sabloane")
            .update(
              t.dataset.f === "activ"
                ? { activ: t.checked }
                : t.dataset.f === "ordine"
                  ? { ordine: +t.value }
                  : { text: t.value },
            )
            .eq("id", t.dataset.id);
          if (r.error) toast(r.error.message, 1);
        } else if (c === "set") {
          const r = await sb
            .from("asm_setari")
            .update({
              [t.dataset.f]: t.type === "checkbox" ? t.checked : +t.value,
            })
            .eq("id", 1);
          if (r.error) return toast(r.error.message, 1);
          S[t.dataset.f] = t.type === "checkbox" ? t.checked : +t.value;
          toast("Salvat.");
        }
      });

      /* ---------- LISTE ---------- */
      const prodTxt = (p) =>
        `<div class="mono" style="font-weight:600">${esc(p.vin || "fără VIN")}</div><div class="mut">${esc(p.model || "—")} · ${esc(p.culoare || "—")}</div>`;
      async function vPreia(c) {
        c.innerHTML = `<div class="card"><input id="q" placeholder="Caută după VIN (minim 3 caractere)..." autocomplete="off"></div><div id="res" class="mut">Introdu cel puțin 3 caractere din VIN.</div>`;
        let t;
        $("#q").oninput = (e) => {
          clearTimeout(t);
          t = setTimeout(async () => {
            const v = e.target.value.trim();
            if (v.length < 3)
              return ($("#res").innerHTML =
                "Introdu cel puțin 3 caractere din VIN.");
            const d = await rpc("asm_cauta_antedepozit", { p_vin: v });
            $("#res").innerHTML = d.length
              ? d
                  .map(
                    (p) =>
                      `<div class="card row"><div>${prodTxt(p)}<div class="mut">în antedepozit din ${dt(p.created_at)}</div></div><button class="btn" data-a="preia" data-id="${p.id}">Preia pentru asamblare</button></div>`,
                  )
                  .join("")
              : "Niciun rezultat.";
          }, 350);
        };
        $("#q").focus();
      }
      async function vLucru(c) {
        const { data } = await sb
          .from("asm_etape")
          .select("id,tip,started_at,asm_produse(vin,model,culoare)")
          .eq("user_id", me.id)
          .is("ended_at", null)
          .order("started_at");
        c.innerHTML =
          `<div class="mut" style="margin-bottom:8px">Produse în lucru: ${(data || []).length} / ${S.max_in_lucru}</div>` +
          ((data || [])
            .map(
              (e) =>
                `<div class="card row"><div>${prodTxt(e.asm_produse)}<div class="mut">${e.tip} · de ${dur(Date.now() - new Date(e.started_at))}</div></div><button class="btn" data-a="open" data-id="${e.id}" data-tip="${e.tip}">Deschide</button></div>`,
            )
            .join("") || '<div class="mut">Nimic în lucru.</div>');
      }
      async function listaStadiu(c, st, btn, lbl, extra) {
        const { data } = await sb
          .from("asm_produse")
          .select("*")
          .eq("stadiu", st)
          .is("operator_curent", null)
          .order("updated_at");
        c.innerHTML =
          (data || [])
            .map(
              (p) =>
                `<div class="card row"><div>${prodTxt(p)}<div class="mut">de ${dur(Date.now() - new Date(p.updated_at))}${p.nr_remedieri ? ` · reverificare (remediat de ${p.nr_remedieri}×)` : ""}${extra && p.sursa_remediere ? ` · sursa: ${p.sursa_remediere}` : ""}</div></div><button class="btn" data-a="${btn}" data-id="${p.id}">${lbl}</button></div>`,
            )
            .join("") ||
          '<div class="mut">Niciun produs în această listă.</div>';
      }
      function vRem(c) {
        return listaStadiu(
          c,
          "in_remediere",
          "prem",
          "Preia pentru remediere",
          1,
        );
      }
      function vCtc(c) {
        return listaStadiu(
          c,
          "asteapta_ctc",
          "pctc",
          "Preia pentru verificare CTC",
        );
      }

      /* ---------- FIȘĂ ASAMBLARE / CTC ---------- */
      async function loadF(id) {
        const { data: e } = await sb
          .from("asm_etape")
          .select("*,asm_produse(*)")
          .eq("id", id)
          .single();
        if (!e || e.ended_at) {
          F = null;
          go(tab);
          return false;
        }
        const tipS = e.tip === "ctc" ? "ctc" : "asamblare";
        const [s, r, n] = await Promise.all([
          sb
            .from("asm_checklist_sabloane")
            .select("*")
            .eq("tip", tipS)
            .eq("activ", true)
            .order("ordine"),
          sb.from("asm_checklist_rezultate").select("*").eq("etapa_id", id),
          sb
            .from("asm_nereguli")
            .select("*,asm_poze(*)")
            .eq("asm_produs_id", e.asm_produs_id)
            .order("created_at"),
        ]);
        F = {
          e,
          p: e.asm_produse,
          sab: s.data || [],
          rez: r.data || [],
          ner: n.data || [],
          url: {},
        };
        const paths = F.ner.flatMap((x) =>
          x.asm_poze.map((p) => p.storage_path),
        );
        if (paths.length) {
          const { data } = await sb.storage
            .from(B)
            .createSignedUrls(paths, 3600);
          (data || []).forEach((u) => (F.url[u.path] = u.signedUrl));
        }
        return true;
      }
      const cur = () => F.ner.filter((n) => n.etapa_id === F.e.id),
        imgs = (n, tip) =>
          n.asm_poze
            .filter((p) => p.tip === tip)
            .map(
              (p) =>
                `<img src="${F.url[p.storage_path] || ""}" onclick="window.open(this.src)">`,
            )
            .join("");
      const fotoBtn = (id, tip, lbl) =>
        `<label class="lbl">📷 ${lbl}<input type="file" accept="image/*" capture="environment" data-c="foto" data-id="${id}" data-tip="${tip}"></label>`;
      function nerBox(n) {
        return `<div style="margin-bottom:8px"><textarea data-c="desc" data-id="${n.id}" placeholder="Descrie neregula...">${esc(n.descriere)}</textarea><div class="ph">${imgs(n, "inainte")}${fotoBtn(n.id, "inainte", "Adaugă poză")}</div></div>`;
      }
      async function fisa(id) {
        if (!(await loadF(id))) return;
        const { e, p } = F;
        const prev = F.ner.filter((n) => n.etapa_id !== e.id);
        $("#c").innerHTML =
          `<div class="card"><div class="row"><div>${prodTxt(p)}<div class="mut">${e.tip === "ctc" ? "Verificare CTC" : "Asamblare"} · început ${dt(e.started_at)}</div></div>${e.tip === "ctc" ? "" : '<div style="text-align:right"><div class="timer" id="tm"></div><div class="mut">de la preluare</div></div>'}</div></div>
 ${e.tip === "ctc" && prev.length ? `<div class="al"><b>Reverificare</b> – defecte raportate anterior:<br>${prev.map((n) => "• " + esc(n.criteriu_text ? n.criteriu_text + ": " : "") + esc(n.descriere) + (n.status === "remediata" ? " ✔ remediat" : "")).join("<br>")}</div>` : ""}
 ${F.sab.length ? "" : '<div class="al">Nu există criterii de checklist definite. Un Admin trebuie să le adauge din tabul „Checklist".</div>'}
 ${F.sab
   .map((s, i) => {
     const r = F.rez.find((x) => x.ordine === i + 1),
       nn = cur().filter((n) => n.criteriu_text === s.text);
     return `<div class="crit ${r ? r.rezultat : ""}"><div class="row"><b>${i + 1}. ${esc(s.text)}</b><div class="tg"><button class="${r?.rezultat === "ok" ? "ok" : ""}" data-a="rez" data-i="${i}" data-v="ok">OK</button><button class="${r?.rezultat === "nok" ? "no" : ""}" data-a="rez" data-i="${i}" data-v="nok">NOK</button></div></div>${r?.rezultat === "nok" ? `<div class="def">${nn.map(nerBox).join("")}<button class="btn gh sm" data-a="ner" data-c="${esc(s.text)}">+ Altă neregulă la acest criteriu</button></div>` : ""}</div>`;
   })
   .join("")}
 ${
   cur().filter((n) => !n.criteriu_text).length
     ? `<div class="crit nok"><b>Nereguli în afara checklist-ului</b><div class="def">${cur()
         .filter((n) => !n.criteriu_text)
         .map(nerBox)
         .join("")}</div></div>`
     : ""
 }
 <button class="btn gh sm" data-a="ner">+ Neregulă în afara checklist-ului</button>
 <div class="foot"><div><button class="btn gh" data-a="back">← Înapoi</button> ${e.tip === "asamblare" ? '<button class="btn gh" data-a="renunta">Renunță</button>' : ""}</div><div id="ft"></div></div>`;
        clearInterval(tmr);
        if (e.tip !== "ctc") {
          const tk = () => {
            const el = $("#tm");
            if (el) {
              const s = Math.max(
                  0,
                  Math.floor((Date.now() - new Date(e.started_at)) / 1e3),
                ),
                f = (n) => String(n).padStart(2, "0");
              el.textContent =
                f((s / 3600) | 0) +
                ":" +
                f(((s / 60) % 60) | 0) +
                ":" +
                f(s % 60);
            }
          };
          tk();
          tmr = setInterval(tk, 1e3);
        }
        foot();
      }
      function foot() {
        const c = cur(),
          all = F.sab.every((s, i) =>
            F.rez.some((r) => r.ordine === i + 1 && r.rezultat === "ok"),
          ),
          ft = $("#ft");
        if (!ft) return;
        if (c.length) {
          const okN = c.every(
            (n) =>
              n.descriere.trim() &&
              (!S.poze_obligatorii ||
                n.asm_poze.some((p) => p.tip === "inainte")),
          );
          ft.innerHTML = `<button class="btn red" data-a="send" ${okN ? "" : "disabled"} title="${okN ? "" : "Fiecare neregulă are nevoie de descriere și poză"}">Trimite la remediere</button>`;
        } else
          ft.innerHTML = `<button class="btn" data-a="fin" ${all ? "" : "disabled"}>${F.e.tip === "ctc" ? "Acordă aviz CTC" : "Trimite în Depozit central"}</button>`;
      }
      async function addNer(txt) {
        const r = await sb
          .from("asm_nereguli")
          .insert({
            etapa_id: F.e.id,
            asm_produs_id: F.e.asm_produs_id,
            criteriu_text: txt,
            descriere: "",
          });
        if (r.error) return toast(r.error.message, 1);
        fisa(F.e.id);
      }
      async function setRez(i, v) {
        const s = F.sab[i],
          has = cur().filter((n) => n.criteriu_text === s.text);
        if (v === "ok" && has.length) {
          if (
            !confirm(
              "Neregulile notate pentru acest criteriu vor fi șterse. Continui?",
            )
          )
            return;
          await sb
            .from("asm_nereguli")
            .delete()
            .eq("etapa_id", F.e.id)
            .eq("criteriu_text", s.text);
        }
        const r = await sb
          .from("asm_checklist_rezultate")
          .upsert(
            {
              etapa_id: F.e.id,
              sablon_id: s.id,
              text_criteriu: s.text,
              ordine: i + 1,
              rezultat: v,
            },
            { onConflict: "etapa_id,ordine" },
          );
        if (r.error) return toast(r.error.message, 1);
        if (v === "nok" && !has.length) {
          await addNer(s.text);
          return;
        }
        fisa(F.e.id);
      }
      async function comp(f) {
        const b = await createImageBitmap(f),
          k = Math.min(1, 1600 / Math.max(b.width, b.height)),
          c = document.createElement("canvas");
        c.width = Math.round(b.width * k);
        c.height = Math.round(b.height * k);
        c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
        return new Promise((r) => c.toBlob(r, "image/jpeg", 0.8));
      }
      async function foto(inp) {
        const f = inp.files[0];
        if (!f) return;
        toast("Se încarcă poza...");
        const bl = await comp(f),
          path = `${F.e.asm_produs_id}/${inp.dataset.id}/${Date.now()}.jpg`;
        const u = await sb.storage
          .from(B)
          .upload(path, bl, { contentType: "image/jpeg" });
        if (u.error) return toast(u.error.message, 1);
        const r = await sb
          .from("asm_poze")
          .insert({
            neregula_id: inp.dataset.id,
            tip: inp.dataset.tip,
            storage_path: path,
          });
        if (r.error) return toast(r.error.message, 1);
        F.e.tip === "remediere" ? rem(F.e.id) : fisa(F.e.id);
      }

      /* ---------- FIȘĂ REMEDIERE ---------- */
      async function rem(id) {
        if (!(await loadF(id))) return;
        const { e, p } = F;
        $("#c").innerHTML =
          `<div class="card"><div class="row"><div>${prodTxt(p)}<div class="mut">Remediere · început ${dt(e.started_at)}</div></div></div></div>
 ${
   F.ner
     .map(
       (
         n,
       ) => `<div class="card"><div class="mut">${esc(n.criteriu_text || "În afara checklist-ului")}</div><div style="margin:4px 0"><b>${esc(n.descriere)}</b></div><div class="ph">${imgs(n, "inainte")}</div>
 <div class="row"><label><input type="checkbox" style="width:auto" id="rc-${n.id}" data-c="rd" data-id="${n.id}" ${n.status === "remediata" ? "checked" : ""}> Remediată</label>${fotoBtn(n.id, "dupa", "Poză după")}</div><div class="ph">${imgs(n, "dupa")}</div>
 <input id="nt-${n.id}" data-c="rnota" data-id="${n.id}" placeholder="Notă remediere (opțional)" value="${esc(n.nota_remediere || "")}"></div>`,
     )
     .join("") || '<div class="mut">Nu există nereguli înregistrate.</div>'
 }
 <div class="card"><textarea id="rn" placeholder="Notă generală (opțional)"></textarea></div>
 <div class="foot"><button class="btn gh" data-a="back">← Înapoi</button><button class="btn" data-a="remfin" ${F.ner.every((n) => n.status === "remediata") ? "" : "disabled"}>Trimite în Depozit central</button></div>`;
        clearInterval(tmr);
      }

      /* ---------- ADMIN ---------- */
      let stF = "",
        stQ = "";
      async function vStadii(c) {
        const { data } = await sb
            .from("asm_produse")
            .select("*")
            .order("updated_at", { ascending: false })
            .limit(500),
          all = data || [],
          h = 3600e3,
          now = Date.now();
        const late = all.filter(
          (p) =>
            (["in_asamblare", "in_remediere"].includes(p.stadiu) &&
              now - new Date(p.updated_at) > S.prag_alerta_ore * h) ||
            (p.stadiu === "asteapta_ctc" &&
              now - new Date(p.updated_at) > S.ctc_alerta_zile * 24 * h),
        ).length;
        c.innerHTML = `${late ? `<div class="al">⚠️ ${late} produse depășesc pragul de timp (în lucru > ${S.prag_alerta_ore} h sau CTC > ${S.ctc_alerta_zile} zile).</div>` : ""}
 <div class="kpis">${Object.keys(ST)
   .map(
     (k) =>
       `<button class="kpi ${stF === k ? "on" : ""}" data-a="kpi" data-s="${k}"><span class="pill p-${k}">${ST[k]}</span><b>${all.filter((p) => p.stadiu === k).length}</b></button>`,
   )
   .join("")}</div>
 <div class="card"><input id="sq" placeholder="Caută VIN (parțial)..." value="${esc(stQ)}" style="max-width:300px;margin-bottom:8px"><div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th><th>Culoare</th><th>Stadiu</th><th>De cât timp</th><th>Operator</th><th>Remedieri</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
 <div class="card"><h4 style="margin:0 0 8px">Indicatori (ultimele 30 zile)</h4><div id="indic" class="mut">Se calculează...</div></div>`;
        const draw = () => {
          const q = stQ.toLowerCase();
          $("#tb").innerHTML =
            all
              .filter(
                (p) =>
                  (!stF || p.stadiu === stF) &&
                  (p.vin || "").toLowerCase().includes(q),
              )
              .map(
                (p) =>
                  `<tr><td class="mono">${esc(p.vin || "—")}</td><td>${esc(p.model || "—")}</td><td>${esc(p.culoare || "—")}</td><td><span class="pill p-${p.stadiu}">${ST[p.stadiu]}</span></td><td>${dur(now - new Date(p.updated_at))}</td><td>${p.operator_curent ? esc(nm(p.operator_curent)) : "—"}</td><td>${p.nr_remedieri}</td><td><button class="btn gh sm" data-a="hist" data-id="${p.id}">Istoric</button> ${p.operator_curent ? `<button class="btn gh sm" data-a="elib" data-id="${p.id}">Eliberează</button>` : ""}${p.stadiu === "ctc_avizat" ? `<button class="btn gh sm" data-a="revoc" data-id="${p.id}">Revocă aviz</button>` : ""}</td></tr>`,
              )
              .join("") ||
            '<tr><td colspan="8" class="mut">Niciun produs.</td></tr>';
        };
        draw();
        $("#sq").oninput = (e) => {
          stQ = e.target.value;
          draw();
        };
        $("#indic").innerHTML = "Se calculează...";
        computeIndicatori().then((x) => {
          const el = $("#indic");
          if (el) el.innerHTML = x;
        });
      }

      async function computeIndicatori() {
        const de = new Date(Date.now() - 30 * 864e5).toISOString();
        const { data: et } = await sb
          .from("asm_etape")
          .select("asm_produs_id,tip,rezultat,durata_sec,ended_at")
          .not("ended_at", "is", null)
          .gte("ended_at", de);
        const rows = et || [];
        const avg = (arr) =>
          arr.length
            ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length)
            : null;
        const asmOk = rows
          .filter((r) => r.tip === "asamblare" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const remOk = rows
          .filter((r) => r.tip === "remediere" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const ctcOk = rows.filter(
          (r) => r.tip === "ctc" && r.rezultat === "ok",
        );
        let pctPrima = "—";
        if (ctcOk.length) {
          const ids = [...new Set(ctcOk.map((r) => r.asm_produs_id))];
          const { data: remAny } = await sb
            .from("asm_etape")
            .select("asm_produs_id")
            .eq("tip", "remediere")
            .in("asm_produs_id", ids);
          const cuRemediere = new Set(
            (remAny || []).map((r) => r.asm_produs_id),
          );
          const primaOk = ctcOk.filter(
            (r) => !cuRemediere.has(r.asm_produs_id),
          ).length;
          pctPrima = Math.round((primaOk / ctcOk.length) * 100) + "%";
        }
        const { data: nok } = await sb
          .from("asm_checklist_rezultate")
          .select("text_criteriu")
          .eq("rezultat", "nok")
          .gte("bifat_la", de)
          .limit(3000);
        let topCrit = "—";
        if (nok && nok.length) {
          const cnt = {};
          nok.forEach(
            (r) => (cnt[r.text_criteriu] = (cnt[r.text_criteriu] || 0) + 1),
          );
          topCrit = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
        }
        const card = (l, v) =>
          `<div><div class="mut">${l}</div><b style="font-size:20px">${v}</b></div>`;
        return `<div class="kpis" style="margin-top:0">${card("Timp mediu asamblare", asmOk.length ? dur(avg(asmOk) * 1e3) : "—")}${card("Aprobate din prima la CTC", pctPrima)}${card("Timp mediu remediere", remOk.length ? dur(avg(remOk) * 1e3) : "—")}${card("Criteriu cu cele mai multe NOK", esc(topCrit))}</div>`;
      }

      async function ist(id) {
        const [ev, et, lg] = await Promise.all([
          sb
            .from("asm_evenimente")
            .select("*")
            .eq("asm_produs_id", id)
            .order("created_at"),
          sb
            .from("asm_etape")
            .select("*")
            .eq("asm_produs_id", id)
            .order("started_at"),
          sb.rpc("asm_logistic", { p_asm: id }),
        ]);
        const l = (lg.data || [])[0],
          sit = !l
            ? "În Depozit central / în flux"
            : l.data_vanzare
              ? "Vândut"
              : l.status_linie === "trimis"
                ? "Expediat către " + (l.magazin || "—")
                : "În Depozit central";
        const o = document.createElement("div");
        o.className = "ov";
        o.innerHTML = `<div><div class="row"><h3 style="margin:0">Istoric produs</h3><div><button class="btn gh sm" data-a="pdf" data-id="${id}">Fișă PDF</button> <button class="btn gh sm" data-a="close">Închide</button></div></div><p class="mut">Situație: <b>${esc(sit)}</b></p>
 <div class="tl">${(ev.data || []).map((x) => `<div>${dt(x.created_at)} · <b>${esc(EV[x.tip] || x.tip)}</b> · ${esc(nm(x.user_id))}${x.detalii ? ` <span class="mut">(${esc(x.detalii)})</span>` : ""}</div>`).join("") || "<div>Fără evenimente.</div>"}</div>
 <h4>Durate etape</h4><div class="tl">${(et.data || []).map((x) => `<div>${x.tip} · ${esc(nm(x.user_id))} · ${x.ended_at ? dur(x.durata_sec * 1e3) + " (" + (x.rezultat || "") + ")" : "în curs"}</div>`).join("")}</div></div>`;
        document.body.appendChild(o);
      }
      async function fetchImgDataUrl(url) {
        try {
          const r = await fetch(url);
          const b = await r.blob();
          return await new Promise((res, rej) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.onerror = rej;
            fr.readAsDataURL(b);
          });
        } catch (e) {
          return null;
        }
      }
      function imgDims(u) {
        return new Promise((res) => {
          const im = new Image();
          im.onload = () =>
            res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
          im.onerror = () => res({ w: 4, h: 3 });
          im.src = u;
        });
      }
      async function genereazaFisaPdf(asmId) {
        if (!window.jspdf)
          return toast(
            "Biblioteca PDF nu s-a încărcat. Verifică conexiunea și reîncearcă.",
            1,
          );
        toast("Se generează fișa PDF...");
        const [{ data: prod }, { data: etape }, lg] = await Promise.all([
          sb.from("asm_produse").select("*").eq("id", asmId).single(),
          sb
            .from("asm_etape")
            .select("*")
            .eq("asm_produs_id", asmId)
            .order("started_at"),
          sb.rpc("asm_logistic", { p_asm: asmId }),
        ]);
        if (!prod) return toast("Produsul nu a fost găsit.", 1);
        const etapeIds = (etape || []).map((e) => e.id),
          etapaTip = new Map((etape || []).map((e) => [e.id, e.tip]));
        const [{ data: rez }, { data: ner }] = await Promise.all([
          etapeIds.length
            ? sb
                .from("asm_checklist_rezultate")
                .select("*")
                .in("etapa_id", etapeIds)
                .order("ordine")
            : Promise.resolve({ data: [] }),
          sb
            .from("asm_nereguli")
            .select("*,asm_poze(*)")
            .eq("asm_produs_id", asmId)
            .order("created_at"),
        ]);
        const paths = (ner || []).flatMap((n) =>
          n.asm_poze.map((x) => x.storage_path),
        );
        let urls = {};
        if (paths.length) {
          const { data } = await sb.storage
            .from(B)
            .createSignedUrls(paths, 3600);
          (data || []).forEach((u) => (urls[u.path] = u.signedUrl));
        }
        const imgCache = {};
        for (const path of paths) {
          const u = urls[path];
          if (!u) continue;
          const d = await fetchImgDataUrl(u);
          if (d) imgCache[path] = d;
        }

        const { jsPDF } = window.jspdf,
          doc = new jsPDF({ unit: "mm", format: "a4" }),
          PW = 210,
          MX = 15;
        let y = 18;
        const FN = "RobotoRO";
        doc.addFileToVFS("RobotoRO-Regular.ttf", FONT_REG);
        doc.addFont("RobotoRO-Regular.ttf", FN, "normal");
        doc.addFileToVFS("RobotoRO-Bold.ttf", FONT_BOLD);
        doc.addFont("RobotoRO-Bold.ttf", FN, "bold");
        doc.setFont(FN, "normal");
        const line = () => {
          doc.setDrawColor(226, 231, 235);
          doc.line(MX, y, PW - MX, y);
          y += 5;
        };
        const ensure = (need) => {
          if (y + need > 282) {
            doc.addPage();
            y = 18;
          }
        };
        const h = (t, size = 13) => {
          ensure(9);
          doc.setFont(FN, "bold");
          doc.setFontSize(size);
          doc.setTextColor(15, 20, 25);
          doc.text(t, MX, y);
          y += 6;
          doc.setFont(FN, "normal");
          doc.setTextColor(30, 41, 59);
        };
        const p = (t, size = 10) => {
          doc.setFontSize(size);
          const lines = doc.splitTextToSize(String(t), PW - 2 * MX);
          ensure(lines.length * 5 + 2);
          doc.text(lines, MX, y);
          y += lines.length * 5 + 2;
        };
        const TL = {
          asamblare: "Asamblare",
          remediere: "Remediere",
          ctc: "Verificare CTC",
        };

        doc.setFont(FN, "bold");
        doc.setFontSize(16);
        doc.setTextColor(15, 20, 25);
        doc.text("Fișă produs — Asamblare", MX, y);
        y += 8;
        doc.setFont(FN, "normal");
        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text(
          `Generată ${new Date().toLocaleString("ro-RO")} de ${nm(me.id)}`,
          MX,
          y,
        );
        y += 8;
        doc.setTextColor(30, 41, 59);
        line();

        h("Date produs");
        p(`VIN: ${prod.vin || "—"}`);
        p(`Model: ${prod.model || "—"}   Culoare: ${prod.culoare || "—"}`);
        p(
          `Stadiu curent: ${ST[prod.stadiu] || prod.stadiu}   Remedieri: ${prod.nr_remedieri}`,
        );
        const l = (lg.data || [])[0],
          sit = !l
            ? "În Depozit central / în flux"
            : l.data_vanzare
              ? "Vândut"
              : l.status_linie === "trimis"
                ? "Expediat către " + (l.magazin || "—")
                : "În Depozit central";
        p(`Situație logistică: ${sit}`);
        y += 2;
        line();

        h("Traseu");
        (etape || []).forEach((e) => {
          p(
            `${TL[e.tip] || e.tip} — ${nm(e.user_id)} — ${dt(e.started_at)}${e.ended_at ? " -> " + dt(e.ended_at) + " (" + dur(e.durata_sec * 1e3) + ", " + (e.rezultat || "—") + ")" : " (în curs)"}${e.nota ? " — notă: " + e.nota : ""}`,
          );
        });
        y += 2;
        line();

        h("Checklist");
        const byEtapa = {};
        (rez || []).forEach((r) => {
          (byEtapa[r.etapa_id] = byEtapa[r.etapa_id] || []).push(r);
        });
        let vreunChecklist = false;
        (etape || []).forEach((e) => {
          const rs = byEtapa[e.id] || [];
          if (!rs.length) return;
          vreunChecklist = true;
          ensure(6);
          doc.setFont(FN, "bold");
          p(`${TL[e.tip] || e.tip} — ${dt(e.started_at)}`);
          doc.setFont(FN, "normal");
          rs.forEach((r) =>
            p(`${r.rezultat === "ok" ? "OK" : "NOK"} — ${r.text_criteriu}`),
          );
        });
        if (!vreunChecklist) p("Fără rezultate de checklist înregistrate.");
        y += 2;
        line();

        h("Nereguli constatate");
        if (!(ner || []).length) p("Nicio neregulă înregistrată.");
        for (const n of ner || []) {
          ensure(14);
          doc.setFont(FN, "bold");
          p(
            `${{ asamblare: "Din asamblare", remediere: "Din remediere", ctc: "Din CTC" }[etapaTip.get(n.etapa_id)] || ""} — ${n.criteriu_text || "În afara checklist-ului"}`,
          );
          doc.setFont(FN, "normal");
          p(n.descriere || "—");
          p(
            `Status: ${n.status === "remediata" ? "Remediată" : "Deschisă"}${n.remediata_de ? " de " + nm(n.remediata_de) + " la " + dt(n.remediata_la) : ""}${n.nota_remediere ? " — notă: " + n.nota_remediere : ""}`,
          );
          for (const [label, arr] of [
            ["Înainte", n.asm_poze.filter((x) => x.tip === "inainte")],
            ["După", n.asm_poze.filter((x) => x.tip === "dupa")],
          ]) {
            if (!arr.length) continue;
            ensure(6);
            doc.setFontSize(9);
            doc.setTextColor(100, 116, 139);
            doc.text(label, MX, y);
            y += 4;
            doc.setTextColor(30, 41, 59);
            let x = MX;
            for (const ph of arr) {
              const d = imgCache[ph.storage_path];
              if (!d) continue;
              ensure(36);
              if (x + 32 > PW - MX) {
                x = MX;
                y += 36;
              }
              try {
                const dm = await imgDims(d),
                  w = 32,
                  hh = Math.min(32, (w * dm.h) / dm.w);
                doc.addImage(d, "JPEG", x, y, w, hh);
              } catch (er) {}
              x += 36;
            }
            y += 36;
          }
          y += 2;
        }

        doc.save(
          `fisa-asamblare-${String(prod.vin || asmId).replace(/[^a-zA-Z0-9-]/g, "")}.pdf`,
        );
      }
      async function vCheck(c) {
        const { data } = await sb
            .from("asm_checklist_sabloane")
            .select("*")
            .order("ordine"),
          d = data || [];
        c.innerHTML =
          [
            ["asamblare", "Criterii asamblare"],
            ["ctc", "Criterii CTC"],
          ]
            .map(
              ([
                t,
                l,
              ]) => `<div class="card"><h3 style="margin-top:0">${l}</h3>${
                d
                  .filter((x) => x.tip === t)
                  .map(
                    (x) =>
                      `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input type="number" style="width:64px" data-c="sab" data-f="ordine" data-id="${x.id}" value="${x.ordine}"><input data-c="sab" data-f="text" data-id="${x.id}" value="${esc(x.text)}"><label style="white-space:nowrap"><input type="checkbox" style="width:auto" data-c="sab" data-f="activ" data-id="${x.id}" ${x.activ ? "checked" : ""}> activ</label><button class="btn gh sm" data-a="delsab" data-id="${x.id}" title="Șterge (istoricul rămâne)">✕</button></div>`,
                  )
                  .join("") || '<div class="mut">Niciun criteriu.</div>'
              }
 <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="ns-${t}" placeholder="Criteriu nou..."><button class="btn" data-a="addsab" data-t="${t}">Adaugă</button></div></div>`,
            )
            .join("") +
          '<div class="mut">Modificările se aplică fișelor deschise ulterior. Rezultatele deja salvate păstrează textul criteriului de la data verificării.</div>';
      }
      function vSet(c) {
        const f = (k, l, ty = "number") =>
          `<div style="margin-bottom:10px"><div class="mut">${l}</div>${ty === "checkbox" ? `<input type="checkbox" style="width:auto" data-c="set" data-f="${k}" ${S[k] ? "checked" : ""}>` : `<input type="number" min="1" data-c="set" data-f="${k}" value="${S[k]}">`}</div>`;
        c.innerHTML = `<div class="card" style="max-width:420px">${f("max_in_lucru", "Produse simultane per utilizator")}${f("prag_alerta_ore", "Alertă produs în lucru (ore)")}${f("ctc_alerta_zile", "Alertă produs care așteaptă CTC (zile)")}${f("poze_obligatorii", "Poză obligatorie la fiecare neregulă", "checkbox")}</div>`;
      }
      boot0();
    </script>
