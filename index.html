    <script>
      const app = document.getElementById("app");
      let currentUser = null;
      let currentProfile = null;
      let recoveryMode = false;
      let currentTabKey = null;
      let transportDeschisId = null;
      let transportFiltre = null;
      let transportFiltruDebounce = null;

      let renderGen = 0;
      function isStaleRender(myGen) {
        return myGen !== renderGen;
      }
      const tabSearchTerms = {};
      let searchDebounceTimer = null;

      const CACHE_TTL_MS = 30000; // plasă de siguranță; invalidarea explicită e principalul mecanism
      const _cache = {
        profiles: { data: null, ts: 0, pending: null },
        agent_magazine: { data: null, ts: 0, pending: null },
        hub_magazine: { data: null, ts: 0, pending: null },
      };

      async function getCached(table) {
        const entry = _cache[table];
        const fresh = entry.data && Date.now() - entry.ts < CACHE_TTL_MS;
        if (fresh) return { data: entry.data, error: null };
        if (entry.pending) return entry.pending;
        entry.pending = supa
          .from(table)
          .select("*")
          .then((res) => {
            if (!res.error) {
              entry.data = res.data;
              entry.ts = Date.now();
            }
            entry.pending = null;
            return res;
          });
        return entry.pending;
      }

      function invalidateCache(...tables) {
        tables.forEach((t) => {
          if (_cache[t]) {
            _cache[t].data = null;
            _cache[t].ts = 0;
          }
        });
      }

      const PAGE_SIZE = 50;
      const _pageState = {};

      function getPageState(key) {
        if (!_pageState[key]) _pageState[key] = { page: 0 };
        return _pageState[key];
      }

      function resetPage(key) {
        getPageState(key).page = 0;
      }

      function rangeFor(key) {
        const st = getPageState(key);
        const from = st.page * PAGE_SIZE;
        return { from, to: from + PAGE_SIZE - 1 };
      }

      function paginationBarHtml(key, totalCount) {
        const st = getPageState(key);
        const totalPages = Math.max(
          1,
          Math.ceil((totalCount || 0) / PAGE_SIZE),
        );
        if (st.page > totalPages - 1) st.page = Math.max(0, totalPages - 1);
        const cur = st.page + 1;
        return `<div class="flex items-center justify-between text-xs text-slate-500 mt-3 pt-2 border-t shrink-0" style="border-color:var(--line)" data-pag-key="${key}">
          <span>Pagina ${cur} din ${totalPages} · ${totalCount || 0} rezultate</span>
          <div class="flex gap-1">
            <button type="button" data-pag="prev" class="border rounded-md px-2.5 py-1 text-xs font-medium ${cur <= 1 ? "opacity-40 pointer-events-none" : "hover:bg-slate-50"}" style="border-color:var(--line)">‹ Anterioară</button>
            <button type="button" data-pag="next" class="border rounded-md px-2.5 py-1 text-xs font-medium ${cur >= totalPages ? "opacity-40 pointer-events-none" : "hover:bg-slate-50"}" style="border-color:var(--line)">Următoare ›</button>
          </div>
        </div>`;
      }

      function bindPaginationBar(container, key, onChange) {
        const bar = container.querySelector(
          `[data-pag-key="${CSS.escape(key)}"]`,
        );
        if (!bar) return;
        const st = getPageState(key);
        bar
          .querySelector('[data-pag="prev"]')
          ?.addEventListener("click", () => {
            st.page = Math.max(0, st.page - 1);
            onChange();
          });
        bar
          .querySelector('[data-pag="next"]')
          ?.addEventListener("click", () => {
            st.page = st.page + 1;
            onChange();
          });
      }

      function buildSearchOrFilter(term, columns) {
        const t = (term || "").trim();
        if (!t) return null;

        const curatat = t.replace(/[(),]/g, " ").trim();
        if (!curatat) return null;
        const escapat = curatat.replace(/[%_]/g, (m) => "\\" + m);
        return columns.map((c) => `${c}.ilike.%${escapat}%`).join(",");
      }

      function ilikeEscape(term) {
        return (term || "").trim().replace(/[%_]/g, (m) => "\\" + m);
      }

      function esc(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      let _excelJsLoadPromise = null;
      function ensureExcelJS() {
        if (window.ExcelJS) return Promise.resolve();
        if (_excelJsLoadPromise) return _excelJsLoadPromise;
        _excelJsLoadPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
          script.onload = () => resolve();
          script.onerror = () => {
            _excelJsLoadPromise = null;
            reject(
              new Error(
                "Nu s-a putut încărca biblioteca Excel. Verifică conexiunea la internet.",
              ),
            );
          };
          document.head.appendChild(script);
        });
        return _excelJsLoadPromise;
      }
      function toast(msg, isError = false) {
        const el = document.createElement("div");
        el.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-medium fade-in ${isError ? "bg-red-600 text-white" : "bg-[var(--graphite)] text-white"}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }

      let realtimeChannel = null;
      let realtimeDebounceTimer = null;
      let refreshRealtimeInAsteptare = false;

      function esteModalDeschis() {
        const overlays = document.querySelectorAll(".fixed.inset-0");
        for (const el of overlays) {
          if (el.id === "sidebar-overlay") continue;
          if (el.classList.contains("hidden")) continue;
          return true;
        }
        return false;
      }

      function existaCampuriNesalvate() {
        const campuri = document.querySelectorAll("#page-content [data-field]");
        for (const el of campuri) {
          if (el.tagName === "SELECT") {
            const optImplicita = Array.from(el.options).find(
              (o) => o.defaultSelected,
            );
            if (el.value !== (optImplicita ? optImplicita.value : ""))
              return true;
          } else if (el.value !== el.defaultValue) {
            return true;
          }
        }
        return false;
      }

      function existaEditareInCurs() {
        return esteModalDeschis() || existaCampuriNesalvate();
      }

      function aplicaRefreshRealtime() {
        if (existaEditareInCurs()) {
          refreshRealtimeInAsteptare = true;
          return;
        }
        refreshRealtimeInAsteptare = false;
        invalidateCache("profiles", "agent_magazine", "hub_magazine");
        if (currentTabKey) dispatchTab(currentTabKey);
        actualizeazaBadgeComenziNoi();
        toast("Date actualizate");
      }

      const realtimeModalObserver = new MutationObserver(() => {
        if (refreshRealtimeInAsteptare && !existaEditareInCurs()) {
          aplicaRefreshRealtime();
        }
      });
      realtimeModalObserver.observe(document.body, { childList: true });

      document.addEventListener("input", () => {
        if (refreshRealtimeInAsteptare && !existaEditareInCurs()) {
          aplicaRefreshRealtime();
        }
      });
      document.addEventListener("change", () => {
        if (refreshRealtimeInAsteptare && !existaEditareInCurs()) {
          aplicaRefreshRealtime();
        }
      });

      function planificaRefreshRealtime() {
        clearTimeout(realtimeDebounceTimer);
        realtimeDebounceTimer = setTimeout(aplicaRefreshRealtime, 400);
      }

      function pornesteRealtime() {
        if (realtimeChannel) return;
        realtimeChannel = supa
          .channel("app-changes")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "produse" },
            planificaRefreshRealtime,
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "comenzi" },
            planificaRefreshRealtime,
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "comanda_produse" },
            planificaRefreshRealtime,
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "incarcari_baterie" },
            planificaRefreshRealtime,
          )
          .subscribe();
      }

      function opresteRealtime() {
        if (realtimeChannel) {
          supa.removeChannel(realtimeChannel);
          realtimeChannel = null;
        }
        refreshRealtimeInAsteptare = false;
        clearTimeout(realtimeDebounceTimer);
      }

      function poateVedeaJurnal() {
        return (
          currentProfile &&
          (currentProfile.role === "admin" ||
            currentProfile.role === "superadmin")
        );
      }
      function roleLabelText(role) {
        const map = {
          magazin: "Magazin",
          agent: "Agent",
          admin: "Admin",
          superadmin: "Super Admin",
          magazin_hub: "Magazin-HUB",
          asm_operator: "Asamblare",
          asm_remediere: "Remediere",
          asm_ctc: "CTC",
          asm_admin: "Admin asamblare",
        };
        return map[role] || "Fără rol";
      }
      async function inregistreazaLog(
        tipEntitate,
        entitateId,
        actiune,
        detalii,
      ) {
        if (!entitateId) return;
        try {
          const numeUtilizator = currentProfile
            ? currentProfile.nume || currentProfile.email
            : null;
          const efectuatDeNume =
            numeUtilizator && currentProfile && currentProfile.role
              ? `${numeUtilizator} (${roleLabelText(currentProfile.role)})`
              : numeUtilizator;
          await supa.from("jurnal_actiuni").insert({
            tip_entitate: tipEntitate,
            entitate_id: entitateId,
            actiune,
            detalii: detalii || null,
            efectuat_de: currentUser ? currentUser.id : null,
            efectuat_de_nume: efectuatDeNume,
          });
        } catch (e) {}
      }
      function logButtonHtml(id) {
        return `<button type="button" id="${id}" class="rounded-md px-2 py-0.5 text-[10px] font-semibold border text-slate-500 hover:bg-slate-50 hover:text-slate-700" style="border-color:var(--line)" title="Jurnal acțiuni">LOG</button>`;
      }
      async function renderLogModal(tipEntitate, entitateId, titlu, onVazut) {
        const overlay = document.createElement("div");
        overlay.id = "log-actiuni-overlay";
        overlay.className =
          "fixed inset-0 z-50 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";
        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-lg fade-in my-auto">
      <div class="flex items-start justify-between mb-1">
        <h2 class="text-base font-bold">Jurnal acțiuni${titlu ? " — " + esc(titlu) : ""}</h2>
        <button type="button" id="log-actiuni-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
      </div>
      <p class="text-sm text-slate-500 mb-3">Cine, când și ce acțiune a fost efectuată.</p>
      <div id="log-actiuni-list" class="space-y-2 max-h-[65vh] overflow-y-auto">
        <p class="text-sm text-slate-400 text-center py-4">Se încarcă...</p>
      </div>
    </div>`;
        document.body.appendChild(overlay);
        document
          .getElementById("log-actiuni-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const listEl = document.getElementById("log-actiuni-list");
        const { data, error } = await supa
          .from("jurnal_actiuni")
          .select("*")
          .eq("tip_entitate", tipEntitate)
          .eq("entitate_id", entitateId)
          .order("created_at", { ascending: false });

        if (!listEl.isConnected) return;
        if (error) {
          listEl.innerHTML = `<p class="text-sm text-red-600 text-center py-4">Eroare la încărcarea jurnalului: ${esc(error.message)}</p>`;
          return;
        }
        if (tipEntitate === "produs") {
          await marcheazaNotificariProdusVazute(entitateId);
          if (typeof onVazut === "function") onVazut();
        }
        if (!data || !data.length) {
          listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Niciun eveniment înregistrat încă.</p>`;
          return;
        }
        listEl.innerHTML = data
          .map(
            (l) => `
    <div class="border rounded-lg p-2.5" style="border-color:var(--line)">
      <div class="flex items-center justify-between gap-2">
        <span class="text-sm font-semibold">${esc(l.actiune)}</span>
        <span class="text-[10px] text-slate-400 shrink-0">${new Date(l.created_at).toLocaleString("ro-RO")}</span>
      </div>
      <div class="text-xs text-slate-500 mt-0.5">${esc(l.efectuat_de_nume || "—")}</div>
      ${l.detalii ? `<div class="text-xs text-slate-400 mt-1">${esc(l.detalii)}</div>` : ""}
    </div>`,
          )
          .join("");
      }
      function rolePill(role) {
        const map = {
          magazin: ["Magazin", "role-magazin"],
          agent: ["Agent", "role-agent"],
          admin: ["Admin", "role-admin"],
          superadmin: ["Super Admin", "role-superadmin"],
          magazin_hub: ["Magazin-HUB", "role-magazin-hub"],
        };
        if (role && role.startsWith("asm_")) {
          return `<span class="role-pill" style="background:#ccfbf1;color:#0b9b82">${esc(roleLabelText(role))}</span>`;
        }
        const [label, cls] = map[role] || ["Fără rol", "role-none"];
        return `<span class="role-pill ${cls}">${label}</span>`;
      }

      supa.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          renderResetPassword();
          return;
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentProfile = null;
          opresteRealtime();
          renderAuthScreen();
          return;
        }
        if (session && !recoveryMode) {
          const esteAcelasiUtilizator =
            currentUser && currentUser.id === session.user.id;
          currentUser = session.user;

          if (esteAcelasiUtilizator && currentProfile) return;
          loadProfileAndRender();
        }
      });

      (async function init() {
        const tokenHash = new URLSearchParams(window.location.search).get(
          "token_hash",
        );
        const otpType = new URLSearchParams(window.location.search).get("type");
        if (tokenHash && otpType) {
          renderConfirmScreen(tokenHash, otpType);
          return;
        }
        const {
          data: { session },
        } = await supa.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadProfileAndRender();
        } else {
          renderAuthScreen();
        }
      })();

      function renderConfirmScreen(tokenHash, type) {
        const isRecovery = type === "recovery";
        app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(circle at 20% 20%, #1B2430 0%, #0E1318 65%);">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl p-6 fade-in text-center">
        <h2 class="text-lg font-bold mb-2">${isRecovery ? "Resetare parolă" : "Confirmare cont"}</h2>
        <p class="text-sm text-slate-500 mb-5">${isRecovery ? "Apasă butonul de mai jos pentru a continua resetarea parolei." : "Apasă butonul de mai jos pentru a-ți confirma adresa de email."}</p>
        <button id="btn-confirm-otp" class="w-full btn-primary rounded-lg py-2.5 text-sm">${isRecovery ? "Continuă" : "Confirmă contul"}</button>
        <p id="confirm-msg" class="text-sm text-center mt-3"></p>
      </div>
    </div>
  </div>`;

        document
          .getElementById("btn-confirm-otp")
          .addEventListener("click", async () => {
            const btn = document.getElementById("btn-confirm-otp");
            const msg = document.getElementById("confirm-msg");
            btn.disabled = true;
            btn.textContent = "Se verifică...";

            const { error } = await supa.auth.verifyOtp({
              token_hash: tokenHash,
              type,
            });

            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );

            if (error) {
              msg.className = "text-sm text-center text-red-600 mt-3";
              msg.textContent = "Linkul nu mai este valid. Cere un link nou.";
              btn.disabled = false;
              btn.textContent = isRecovery ? "Continuă" : "Confirmă contul";
              return;
            }

            if (isRecovery) {
              recoveryMode = true;
              renderResetPassword();
            } else {
              await supa.auth.signOut();
              renderAuthScreen("login");
              toast("Cont confirmat cu succes. Te poți autentifica.");
            }
          });
      }

      async function loadProfileAndRender() {
        const { data, error } = await supa
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error) {
          toast("Eroare la încărcarea profilului: " + error.message, true);
        }
        currentProfile = data || null;
        renderShell();
        pornesteRealtime();
      }

      function renderAuthScreen(mode = "login") {
        app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(circle at 20% 20%, #1B2430 0%, #0E1318 65%);">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <img src="./assets/logo.png" alt="Geeli Distribution" style="width:80%;height:auto;margin:0 auto;" />
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-6 fade-in">
        <div class="flex text-sm font-semibold mb-6 border-b" style="border-color:var(--line)">
          <button data-tab="login" class="auth-tab px-3 py-2 -mb-px ${mode === "login" ? "tab-active" : "tab-inactive"}">Autentificare</button>
          <button data-tab="signup" class="auth-tab px-3 py-2 -mb-px ${mode === "signup" ? "tab-active" : "tab-inactive"}">Cont nou</button>
          <button data-tab="forgot" class="auth-tab px-3 py-2 -mb-px ${mode === "forgot" ? "tab-active" : "tab-inactive"}">Am uitat parola</button>
        </div>
        <div id="auth-panel"></div>
      </div>
      <p class="text-center text-slate-500 text-xs mt-6">© ${new Date().getFullYear()} Geeli Distribution</p>
    </div>
  </div>`;

        document.querySelectorAll(".auth-tab").forEach((btn) => {
          btn.addEventListener("click", () =>
            renderAuthScreen(btn.dataset.tab),
          );
        });

        const panel = document.getElementById("auth-panel");
        if (mode === "login") panel.innerHTML = loginForm();
        if (mode === "signup") panel.innerHTML = signupForm();
        if (mode === "forgot") panel.innerHTML = forgotForm();

        if (mode === "login") bindLoginForm();
        if (mode === "signup") bindSignupForm();
        if (mode === "forgot") bindForgotForm();
      }

      function fieldLabel(txt) {
        return `<label class="block text-sm font-medium text-slate-700 mb-1">${txt}</label>`;
      }
      function inputBase() {
        return "w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--teal)] focus:border-transparent";
      }
      function produsFieldLabel(txt) {
        return `<label class="block text-[11px] font-medium text-slate-600 mb-0.5">${txt}</label>`;
      }
      function produsInputBase() {
        return "w-full border rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-[var(--teal)] focus:border-transparent";
      }

      function loginForm() {
        return `
  <form id="form-login" class="space-y-4">
    <div>${fieldLabel("Email")}<input type="email" id="login-email" required class="${inputBase()}" placeholder="nume@exemplu.ro"></div>
    <div>${fieldLabel("Parolă")}<input type="password" id="login-pass" required class="${inputBase()}" placeholder="••••••••"></div>
    <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Autentificare</button>
    <p id="login-msg" class="text-sm text-center"></p>
  </form>`;
      }
      function bindLoginForm() {
        document
          .getElementById("form-login")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-pass").value;
            const { error } = await supa.auth.signInWithPassword({
              email,
              password,
            });
            btn.disabled = false;
            const msg = document.getElementById("login-msg");
            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message.includes("Invalid login")
                ? "Email sau parolă incorectă."
                : error.message;
            }
          });
      }

      function signupForm() {
        return `
  <form id="form-signup" class="space-y-4">
    <div>${fieldLabel("Email")}<input type="email" id="signup-email" required class="${inputBase()}" placeholder="nume@exemplu.ro"></div>
    <div>${fieldLabel("Parolă")}<input type="password" id="signup-pass" required minlength="6" class="${inputBase()}" placeholder="Minim 6 caractere"></div>
    <div>${fieldLabel("Confirmă parola")}<input type="password" id="signup-pass2" required minlength="6" class="${inputBase()}"></div>
    <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Creează cont</button>
    <p id="signup-msg" class="text-sm text-center"></p>
    <p class="text-xs text-slate-500 text-center">Contul nou nu are niciun rol alocat. Un administrator va activa contul și îi va atribui rolul.</p>
  </form>`;
      }
      function bindSignupForm() {
        document
          .getElementById("form-signup")

        scope,

        if (!scope.all && !scope.ids.length) return [];
        let q = supa
          .from("produse")
          .select("*")
          .not(coloanaData, "is", null)
          .gte(coloanaData, cutoffZileInUrma(zile))
          .order(coloanaData, { ascending: false });
        if (!scope.all) q = q.in(coloanaScop, scope.ids);
        const { data, error } = await q;
        if (error) return [];
        return data || [];

        const aa = String(d.getFullYear()).slice(-2);

      function fmtNum(n) {

      const CAMPURI_PRET_LOG = [
        { key: "pret_intrare", label: "Preț intrare" },
        { key: "alte_costuri", label: "Alte costuri" },
        { key: "pret_vanzare", label: "Total intrare" },

        { key: "pret_recomandat", label: "Preț recomandat" },
        { key: "discount", label: "Discount" },
      ];
      function valNumLog(v) {
        return v === null || v === undefined || v === "" ? null : Number(v);
      }
      function modificariPretProdus(original, payload) {
        const rezultat = [];
        CAMPURI_PRET_LOG.forEach(({ key, label }) => {
          if (!(key in payload)) return;
          const vechi = valNumLog(original[key]);
          const nou = valNumLog(payload[key]);
          const eDiferit =
            (vechi === null) !== (nou === null) ||
            (vechi !== null && nou !== null && Math.abs(vechi - nou) > 0.001);
          if (eDiferit) {
            rezultat.push({
              label,
              vechi: vechi === null ? "—" : vechi.toFixed(2),
              nou: nou === null ? "—" : nou.toFixed(2),
            });
          }
        });
        return rezultat;
      }

      function distinctMarci(produse) {
        const set = new Set();
        (produse || []).forEach((p) => {
          if (p.marca) set.add(p.marca);
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b, "ro"));
      }

      function distinctModele(produse) {
        const set = new Set();
        (produse || []).forEach((p) => {
          if (p.model) set.add(p.model);
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b, "ro"));
      }

      function buildMarcaCategorieMap(produse) {
        const counts = {};
        (produse || []).forEach((p) => {
          if (!p.marca || !p.categorie) return;
          const key = p.marca.trim().toLowerCase();
          counts[key] = counts[key] || {};
          counts[key][p.categorie] = (counts[key][p.categorie] || 0) + 1;
        });
        const map = {};
        Object.keys(counts).forEach((key) => {
          let best = null;
          let bestCount = -1;
          Object.entries(counts[key]).forEach(([categorie, n]) => {
            if (n > bestCount) {
              best = categorie;
              bestCount = n;
            }
          });
          map[key] = best;
        });
        return map;
      }

      function attachAgentAutocomplete(inputEl, listEl, names, onChange) {
        function renderMatches() {
          const q = inputEl.value.trim().toLowerCase();
          if (!q) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          const matches = names
            .filter((n) => n.toLowerCase().includes(q))
            .slice(0, 8);
          if (!matches.length) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          listEl.innerHTML = matches
            .map(
              (n) =>
                `<div class="agent-suggestion px-3 py-1.5 hover:bg-slate-100 cursor-pointer">${esc(n)}</div>`,
            )
            .join("");
          listEl.classList.remove("hidden");
          listEl.querySelectorAll(".agent-suggestion").forEach((el, i) => {
            el.addEventListener("mousedown", (e) => {
              e.preventDefault();
              inputEl.value = matches[i];
              listEl.classList.add("hidden");
              listEl.innerHTML = "";
              if (onChange) onChange(inputEl.value);
            });
          });
        }
        inputEl.addEventListener("input", renderMatches);
        inputEl.addEventListener("focus", renderMatches);
        inputEl.addEventListener("blur", () => {
          setTimeout(() => {
            listEl.classList.add("hidden");
          }, 150);
          if (onChange) onChange(inputEl.value);

      // Structura preturilor unui produs (pozitiile 1-7):
      //   1. PRET INTRARE        (pret_intrare, editabil)
      //   2. ALTE COSTURI        (alte_costuri, editabil)
      //   3. TOTAL INTRARE       (pret_vanzare, calculat = 1 + 2)
      //   4. ADAOS               (adaos = camp VALOARE, editabil; camp PROCENT calculat/editabil, nu se salveaza separat)
      //   5. PRET V. FARA TVA    (total_fara_tva, calculat = 3 + 4, cu DISCOUNT aplicat)
      //   6. PRET CU TVA         (pret_cu_tva, calculat = 5 + TVA)
      //   7. PRET RECOMANDAT     (pret_recomandat, editabil, neschimbat)
      function attachPriceAutoCalc({
        intrareInput,
        alteInput,
        totalIntrareInput,
        adaosProcentInput,
        adaosValoareInput,
        totalInput,
        tvaInput,
        discountInput,
        discountTipInput,
      }) {
        function updateTotalTva() {
          const totalIntrareStr = totalIntrareInput.value.trim();
          if (totalIntrareStr === "") {
            totalInput.value = "";
            tvaInput.value = "";
            return;
          }
          const totalIntrare = parseFloat(totalIntrareStr) || 0;
          const adaosVal = parseFloat(adaosValoareInput.value) || 0;
          const discount = discountInput
            ? parseFloat(discountInput.value) || 0
            : 0;

          const discountTip = discountTipInput
            ? discountTipInput.value
            : "procent";
          const totalBrut = totalIntrare + adaosVal;
          const total =
            discountTip === "suma"
              ? totalBrut - discount
              : totalBrut * (1 - discount / 100);
          totalInput.value = fmtNum(total);
          tvaInput.value = fmtNum(total * (1 + TVA_RATE));
        }
        function updateTotalIntrare() {
          const intrare = parseFloat(intrareInput.value) || 0;
          const alte = parseFloat(alteInput.value) || 0;
          totalIntrareInput.value = (intrare + alte).toFixed(2);
        }
        function syncProcentDinValoare() {
          const totalIntrare = parseFloat(totalIntrareInput.value) || 0;
          const valoareStr = adaosValoareInput.value.trim();
          if (valoareStr === "") {
            adaosProcentInput.value = "";
            return;
          }
          if (!totalIntrare) return;
          const valoare = parseFloat(valoareStr) || 0;
          adaosProcentInput.value = ((valoare / totalIntrare) * 100).toFixed(2);
        }
        intrareInput.addEventListener("input", () => {
          updateTotalIntrare();
          syncProcentDinValoare();
          updateTotalTva();
        });
        alteInput.addEventListener("input", () => {
          updateTotalIntrare();
          syncProcentDinValoare();
          updateTotalTva();
        });
        adaosProcentInput.addEventListener("input", () => {
          const procentStr = adaosProcentInput.value.trim();
          if (procentStr !== "") {
            const totalIntrare = parseFloat(totalIntrareInput.value) || 0;
            const procent = parseFloat(procentStr) || 0;
            adaosValoareInput.value = ((totalIntrare * procent) / 100).toFixed(
              2,
            );
          }
          updateTotalTva();
        });
        adaosValoareInput.addEventListener("input", () => {
          syncProcentDinValoare();
          updateTotalTva();
        });
        if (discountInput)
          discountInput.addEventListener("input", updateTotalTva);
        return { updateTotalTva, updateTotalIntrare };
      }

      async function loadStocCentralData(pageKey) {
        const termenCautare = tabSearchTerms[currentTabKey] || "";
        const { from, to } = rangeFor(pageKey);
        let produseQuery = supa
          .from("produse")
          .select("*", { count: "exact" })
          .is("magazin_id", null)
          .eq("vanzare_directa", false)
          .eq("vandut", false)
          .order("updated_at", { ascending: false })
          .range(from, to);
        const orFilter = buildSearchOrFilter(
          termenCautare,
          PRODUSE_CAUTARE_COLOANE,
        );
        if (orFilter) produseQuery = produseQuery.or(orFilter);

        const [
          { data: produse, error: prodErr, count },
          { data: profiles, error: profErr },
          { data: asocieri, error: asoErr },
          marci,
          modele,
        ] = await Promise.all([
          produseQuery,
          getCached("profiles"),
          getCached("agent_magazine"),
          fetchMarciDistincte(),
          fetchModeleDistincte(),
          loadTvaRate(),
        ]);

        const error =
          (prodErr && "Eroare la încărcarea stocului: " + prodErr.message) ||
          (profErr &&
            "Eroare la încărcarea profilurilor: " + profErr.message) ||
          null;
        if (error) return { error };

        const agenti = (profiles || []).filter((p) => p.role === "agent");
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const agentMagazinMap = buildAgentMagazinMap(
          asoErr ? [] : asocieri,
          agenti,
        );

        const produsIds = (produse || []).map((p) => p.id);
        const { data: linii } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("produs_id")
              .in("produs_id", produsIds)
              .eq("status_linie", "asignat")
          : { data: [] };
        const reservedIds = new Set((linii || []).map((l) => l.produs_id));
        const notificariActive =
          await fetchProduseCuNotificariActive(produsIds);

        const tvaProcentCurent = Math.round(TVA_RATE * 10000) / 100;

          reservedIds,

      const ASM_STADIU_LABEL = {
        in_asamblare: ["În asamblare", "bg-amber-100 text-amber-700"],
        in_remediere: ["În remediere", "bg-red-100 text-red-700"],
        asteapta_ctc: ["Așteaptă CTC", "bg-slate-100 text-slate-600"],
        in_ctc: ["În CTC", "bg-blue-100 text-blue-700"],
        ctc_avizat: ["Avizat CTC", "bg-emerald-100 text-emerald-700"],

      async function fetchAsmStadiuMap(produsIds) {
        const map = new Map();
        if (
          !produsIds.length ||
          !["admin", "superadmin"].includes(currentProfile?.role)
        )
          return map;
        const { data, error } = await supa
          .from("v_produse_stadiu")
          .select("produs_id, stadiu")
          .in("produs_id", produsIds);
        if (error || !data) return map;
        data.forEach((r) => map.set(r.produs_id, r.stadiu));
        return map;
      }

          stadiu,
          "bg-slate-100 text-slate-600",

        return `<span class="inline-block px-1.5 py-0.5 rounded-full text-[10px] font-semibold ${cls}" title="${poateFiAsignat ? "Produs avizat CTC, poate fi asignat unei comenzi" : "Produs în fluxul de asamblare, nu poate fi asignat unei comenzi până nu primește aviz CTC"}">${esc(label)}</span>`;

      function renderTvaModal(tvaProcentCurent) {
        const overlay = document.createElement("div");

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm fade-in relative">

      const antedepozitFilters = { model: "", vin: "", culoare: "" };
      const antedepozitSelectie = new Set();

      function buildAntedepozitQuery() {
        let q = supa.from("antedepozit_import").select("*", { count: "exact" });
        const modelVal = antedepozitFilters.model.trim();
        const vinVal = antedepozitFilters.vin.trim();
        const culoareVal = antedepozitFilters.culoare.trim();
        if (modelVal)
          q = q.ilike(
            "model",
            `%${modelVal.replace(/[%_]/g, (m) => "\\" + m)}%`,
          );
        if (vinVal)
          q = q.ilike("vin", `%${vinVal.replace(/[%_]/g, (m) => "\\" + m)}%`);
        if (culoareVal)
          q = q.ilike(
            "culoare",
            `%${culoareVal.replace(/[%_]/g, (m) => "\\" + m)}%`,
          );
        return q;
      }

      async function loadAntedepozitData(pageKey) {
        const { from, to } = rangeFor(pageKey);
        const { data, error, count } = await buildAntedepozitQuery()
          .order("created_at", { ascending: true })
          .range(from, to);
        return {
          itemi: data || [],
          error: error?.message,
          totalCount: count || 0,
        };
      }

        container.innerHTML = `

      <button type="button" id="btn-antedepozit-verifica-selectie" class="rounded-lg px-4 py-2 text-sm font-medium border ${antedepozitSelectie.size ? "btn-primary" : "text-slate-400 cursor-not-allowed"}" style="border-color:var(--line)" ${antedepozitSelectie.size ? "" : "disabled"}>Mută toate</button>
    </div>

    ${renderAntedepozitTableHtml(d.itemi, getPageState(pageKey).page * PAGE_SIZE, profileById)}
    ${paginationBarHtml(pageKey, d.totalCount)}`;

        const refresh = () => renderAntedepozitImport(container);

        d.itemi.forEach((item) =>
          bindAntedepozitRow(item, agentiList, marci, modele, refresh),
        );

        function actualizeazaBaraSelectie() {
          const countEl = document.getElementById("antedepozit-selectie-count");
          if (countEl) {
            countEl.innerHTML = `<span class="font-semibold">${antedepozitSelectie.size}</span> produs${antedepozitSelectie.size === 1 ? "" : "e"} selectat${antedepozitSelectie.size === 1 ? "" : "e"}`;
          }
          const verificaBtn = document.getElementById(
            "btn-antedepozit-verifica-selectie",

          if (verificaBtn) {

            verificaBtn.classList.toggle(

            verificaBtn.classList.toggle(
              "text-slate-400",
              !antedepozitSelectie.size,
            );
            verificaBtn.classList.toggle(
              "cursor-not-allowed",
              !antedepozitSelectie.size,
            );
          }
          const selectAllBox = document.getElementById(
            "antedepozit-select-all",

        container.querySelectorAll(".antedepozit-row-check").forEach((cb) => {
          cb.checked = antedepozitSelectie.has(cb.dataset.id);
          cb.addEventListener("change", () => {
            if (cb.checked) antedepozitSelectie.add(cb.dataset.id);
            else antedepozitSelectie.delete(cb.dataset.id);
            actualizeazaBaraSelectie();
          });
        });

        const selectAllBox = document.getElementById("antedepozit-select-all");
        if (selectAllBox) {
          selectAllBox.checked =
            d.itemi.length > 0 &&
            d.itemi.every((it) => antedepozitSelectie.has(String(it.id)));
          selectAllBox.addEventListener("change", () => {
            container
              .querySelectorAll(".antedepozit-row-check")
              .forEach((cb) => {

                if (selectAllBox.checked)
                  antedepozitSelectie.add(cb.dataset.id);

        document

            renderVerificaSelectieAntedepozitModal(refresh).catch((e) => {

          `[data-antedepozit-row="${item.id}"]`,

        const btn = row.querySelector(`[data-muta-antedepozit="${item.id}"]`);
        if (!btn) return;
        btn.addEventListener("click", () => {
          renderAddProductModal(
            agenti,
            refresh,
            async (produsNou) => {
              const { error } = await supa
                .from("antedepozit_import")
                .delete()
                .eq("id", item.id);
              if (error) {
                toast(
                  "Produsul a fost salvat, dar nu a putut fi șters din antedepozit: " +
                    error.message,
                  true,
                );
                return;
              }
              inregistreazaLog(
                "produs",
                produsNou.id,
                "Mutat din Antedepozit Import",
                `Model: ${item.model || "—"} · VIN: ${item.vin || "—"} · Culoare: ${item.culoare || "—"}`,

              refresh();
            },
            { model: item.model, vin: item.vin, culoare: item.culoare },
            marci,
            modele,
          );

          .select("*")
          .in("id", idsSelectate)
          .order("created_at", { ascending: true });

          toast(
            "Eroare la încărcarea produselor selectate: " + error.message,
            true,
          );
          return;

        const itemiValizi = itemi || [];
        const idsValide = new Set(itemiValizi.map((it) => String(it.id)));

              if (!q) return true;

                (it.model || "").toLowerCase().includes(q) ||

            btn.disabled = true;

            msg.className = "text-sm text-center text-slate-400";
            const listaDeProcesat = itemiRamasi.slice();
            const nCurent = listaDeProcesat.length;
            msg.textContent = `Se adaugă produsele (0/${nCurent})...`;

            const produseNoi = [];
            const erori = [];
            const itemiEsuati = [];
            let procesate = 0;

            const randPentruItem = (item, idProdus) => ({
              id_produs: idProdus,
              agent: null,
              categorie: categorieVal || null,
              marca: marcaVal || null,
              model: item.model || null,

              pret_cu_tva: cuTva,
              pret_recomandat: pretRecomandat,
              discount: discountVal,
              discount_tip: addDiscountTip.value,
              civ: civVal,
              created_by: currentUser.id,
            });

            const finalizeazaProdusMutat = async (item, produsNou) => {
              await supa.from("antedepozit_import").delete().eq("id", item.id);
              antedepozitSelectie.delete(String(item.id));
              inregistreazaLog(
                "produs",
                produsNou.id,
                "Mutat din Antedepozit Import (mutare multiplă)",
                `Model: ${item.model || "—"} · VIN: ${item.vin || "—"} · Culoare: ${item.culoare || "—"}`,
              );
              produseNoi.push(produsNou);
            };

            // Fallback rând-cu-rând (comportamentul original, cu reîncercare la
            // coliziune de ID) — folosit doar dacă inserarea în lot eșuează.
            const insereazaUnItemCuRetry = async (item) => {
              let produsNou = null;
              let error = null;
              for (let incercare = 0; incercare < 5; incercare++) {
                const idProdus = generateProductId();
                const rezultat = await supa
                  .from("produse")
                  .insert(randPentruItem(item, idProdus))
                  .select()
                  .single();
                error = rezultat.error;
                produsNou = rezultat.data;
                const esteDuplicatId =
                  error &&
                  (error.code === "23505" ||
                    /duplicate key/i.test(error.message || "")) &&
                  /id_produs/i.test(error.message || "");
                if (!error || !esteDuplicatId) break;
                // ID produs generat coincide cu unul existent — se reîncearcă cu alt ID.
              }
              if (error) {
                erori.push(
                  `${item.model || item.vin || item.id}: ${error.message}`,
                );
                itemiEsuati.push(item);
                return;
              }
              await finalizeazaProdusMutat(item, produsNou);
            };

            const MARIME_LOT = 20;
            for (
              let start = 0;
              start < listaDeProcesat.length;
              start += MARIME_LOT
            ) {
              const lot = listaDeProcesat.slice(start, start + MARIME_LOT);

              // ID-uri unice în interiorul lotului (evită coliziuni între rândurile
              // aceluiași lot; coliziunile cu produse deja existente în bază sunt
              // tratate mai jos, prin fallback-ul rând-cu-rând).
              const idPerItem = new Map();
              const idsDinLot = new Set();
              lot.forEach((item) => {
                let idProdus;
                do {
                  idProdus = generateProductId();
                } while (idsDinLot.has(idProdus));
                idsDinLot.add(idProdus);
                idPerItem.set(item, idProdus);
              });

              const randuriLot = lot.map((item) =>
                randPentruItem(item, idPerItem.get(item)),
              );

              const rezultatLot = await supa
                .from("produse")
                .insert(randuriLot)
                .select();

              if (!rezultatLot.error) {
                const produsPeIdProdus = new Map(
                  (rezultatLot.data || []).map((r) => [r.id_produs, r]),
                );
                for (const item of lot) {
                  const produsNou = produsPeIdProdus.get(idPerItem.get(item));
                  if (!produsNou) {
                    erori.push(
                      `${item.model || item.vin || item.id}: produsul nu a fost regăsit după inserarea în lot`,
                    );
                    itemiEsuati.push(item);
                    continue;
                  }
                  await finalizeazaProdusMutat(item, produsNou);
                }
              } else {
                // Inserarea în lot a eșuat (de ex. coliziune de id_produs cu un
                // produs deja existent) — se reîncearcă acest lot rând cu rând,
                // cu aceeași robustețe ca înainte, izolând eșecurile per produs.
                for (const item of lot) {
                  await insereazaUnItemCuRetry(item);
                }
              }

              procesate += lot.length;
              msg.textContent = `Se adaugă produsele (${procesate}/${nCurent})...`;
            }

            itemiRamasi = itemiEsuati;

            if (erori.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = `${produseNoi.length} produse adăugate, ${erori.length} eșuate — se reîncearcă doar produsele eșuate: ${erori.join("; ")}`;
              btn.disabled = false;
              btn.textContent = `Reîncearcă produsele eșuate (${itemiRamasi.length})`;
              if (produseNoi.length) onSaved();
              return;
            }

            overlay.remove();
            toast(
              `${produseNoi.length} produse adăugate cu succes în Depozitul central.`,
            );
            onSaved();
          });
      }

      async function importAntedepozitExcel(file) {
        const msg = document.getElementById("antedepozit-upload-msg");
        if (msg) {
          msg.className = "text-xs text-slate-400 mb-2";
          msg.textContent = "Se citește fișierul...";
        }
        try {
          await ensureExcelJS();
          const buffer = await file.arrayBuffer();
          const wb = new ExcelJS.Workbook();
          await wb.xlsx.load(buffer);
          const sheet = wb.worksheets[0];
          if (!sheet)
            throw new Error("Fișierul Excel nu conține niciun sheet.");

          const headerRow = sheet.getRow(1);
          const colIndex = { model: null, vin: null, culoare: null };
          headerRow.eachCell((cell, colNumber) => {
            const val = String(cell.value || "")
              .trim()
              .toUpperCase();
            if (val === "MODEL") colIndex.model = colNumber;
            else if (val === "SERIE SASIU") colIndex.vin = colNumber;
            else if (val === "CULOARE") colIndex.culoare = colNumber;
          });
          if (!colIndex.model && !colIndex.vin && !colIndex.culoare) {
            throw new Error(
              'Nu am găsit coloanele "MODEL", "SERIE SASIU" sau "CULOARE" pe primul rând al fișierului.',
            );
          }

          const randuri = [];
          sheet.eachRow((row, rowNumber) => {
            if (rowNumber === 1) return;
            const model = colIndex.model
              ? String(row.getCell(colIndex.model).value || "").trim()
              : "";
            const vin = colIndex.vin
              ? String(row.getCell(colIndex.vin).value || "").trim()
              : "";
            const culoare = colIndex.culoare
              ? String(row.getCell(colIndex.culoare).value || "").trim()
              : "";
            if (!model && !vin && !culoare) return;
            randuri.push({
              model: model || null,
              vin: vin || null,
              culoare: culoare || null,
              created_by: currentUser.id,
            });
          });

          if (!randuri.length) {
            if (msg) {
              msg.className = "text-xs text-amber-600 mb-2";
              msg.textContent =
                "Fișierul nu conține rânduri valide de importat.";
            }
            return;
          }

          // Evită dublarea rândurilor cu VIN deja existent în antedepozit.
          const vinuriNoi = randuri.map((r) => r.vin).filter((v) => v);
          let vinuriExistente = new Set();
          if (vinuriNoi.length) {
            const { data: existente } = await supa
              .from("antedepozit_import")
              .select("vin")
              .in("vin", vinuriNoi);
            vinuriExistente = new Set((existente || []).map((r) => r.vin));
          }
          const randuriDeInserat = randuri.filter(
            (r) => !r.vin || !vinuriExistente.has(r.vin),
          );
          const ignorate = randuri.length - randuriDeInserat.length;

          const CHUNK = 500;
          let inserate = 0;
          for (let i = 0; i < randuriDeInserat.length; i += CHUNK) {
            const lot = randuriDeInserat.slice(i, i + CHUNK);
            if (!lot.length) continue;
            const { error } = await supa.from("antedepozit_import").insert(lot);
            if (error) throw new Error(error.message);
            inserate += lot.length;
          }

          if (msg) {
            msg.className = "text-xs text-emerald-600 mb-2";
            msg.textContent = `Import finalizat: ${inserate} produse adăugate${ignorate ? `, ${ignorate} ignorate (VIN deja existent în antedepozit)` : ""}.`;
          }
          toast(
            `Import finalizat: ${inserate} produse adăugate în antedepozit.`,
          );
        } catch (e) {
          const errMsg = e && e.message ? e.message : String(e);
          if (msg) {
            msg.className = "text-xs text-red-600 mb-2";
            msg.textContent = "Eroare la import: " + errMsg;
          }
          toast("Eroare la import: " + errMsg, true);
        }
      }

      async function loadProduseTrimiseData(pageKey) {
        const termenCautare = tabSearchTerms[currentTabKey] || "";
        const { from, to } = rangeFor(pageKey);
        let produseQuery = supa
          .from("produse")
          .select("*", { count: "exact" })
          .or("magazin_id.not.is.null,vanzare_directa.eq.true")
          .eq("vandut", false)
          .order("updated_at", { ascending: false })
          .range(from, to);
        const orFilter = buildSearchOrFilter(
          termenCautare,
          PRODUSE_CAUTARE_COLOANE,
        );
        if (orFilter) produseQuery = produseQuery.or(orFilter);

        const [
          { data: produse, error: prodErr, count },
          { data: profiles, error: profErr },
          { data: asocieri, error: asoErr },
          marci,
          modele,
        ] = await Promise.all([
          produseQuery,
          getCached("profiles"),
          getCached("agent_magazine"),
          fetchMarciDistincte(),
          fetchModeleDistincte(),
        ]);

        const error =
          (prodErr && "Eroare la încărcarea stocului: " + prodErr.message) ||
          (profErr &&
            "Eroare la încărcarea profilurilor: " + profErr.message) ||
          null;
        if (error) return { error };

        const agenti = (profiles || []).filter((p) => p.role === "agent");
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const agentMagazinMap = buildAgentMagazinMap(
          asoErr ? [] : asocieri,
          agenti,
        );

        const produsIds = (produse || []).map((p) => p.id);
        const { data: liniiProduse } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("*")
              .in("produs_id", produsIds)
              .eq("status_linie", "trimis")
          : { data: [] };
        const comandaIds = Array.from(
          new Set(
            (liniiProduse || []).map((l) => l.comanda_id).filter(Boolean),
          ),
        );

        const [{ data: linii }, { data: comenzi }] = comandaIds.length
          ? await Promise.all([
              supa
                .from("comanda_produse")
                .select("*")
                .in("comanda_id", comandaIds),
              supa.from("comenzi").select("*").in("id", comandaIds),
            ])
          : [{ data: [] }, { data: [] }];

        const produsComandaMap = buildProdusComandaMap(liniiProduse, comenzi);
        const comandaCtx = {
          map: produsComandaMap,
          linii: linii || [],
          profiles: profiles || [],
        };
        const notificariActive =
          await fetchProduseCuNotificariActive(produsIds);

        return {
          error: null,
          agenti,
          magazine,
          agentMagazinMap,
          marci,
          modele,
          produseTrimise: produse || [],
          comandaCtx,
          notificariActive,
          totalCount: count || 0,
        };
      }

      async function renderProduseTrimiseTab(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const myGen = renderGen;

      function magazinLabelPentru(magazinId, magazineList, esteVanzareDirecta) {
        if (!magazinId) return esteVanzareDirecta ? "Vânzare directă" : "—";
        const m = (magazineList || []).find((x) => x.id === magazinId);
        if (m)
          return `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`;
        const toateProfilurile =
          (_cache.profiles && _cache.profiles.data) || [];
        const hub = toateProfilurile.find(
          (x) => x.id === magazinId && x.role === "magazin_hub",
        );
        if (hub) return "Depozit HUB";
        return esteVanzareDirecta ? "Vânzare directă" : "—";
      }

      function bindProductRow(
        p,
        agenti,
        magazine,
        agentMagazinMap,
        marci,
        modele,
        refresh,
        comandaCtx,
        isReserved,
      ) {
        const row = document.querySelector(`tr[data-prow="${p.id}"]`);
        if (!row) return;

        row.querySelector(".produs-id-link").addEventListener("click", () => {
          const poateVanzareDirecta =
            !isReserved && !p.magazin_id && !p.vanzare_directa && !p.vandut;
          renderEditProductModal(
            p,
            agenti,
            magazine,
            refresh,
            marci,
            modele,
            poateVanzareDirecta,
            agentMagazinMap,
          );
        });

        const comandaLink = row.querySelector(".comanda-produs-link");
        if (comandaLink && comandaCtx) {
          comandaLink.addEventListener("click", () => {
            const comanda = comandaCtx.map.get(p.id);
            if (comanda) {
              deschideComandaInitiala(
                comanda,
                comandaCtx.linii,
                comandaCtx.profiles,
              );
            }
          });
        }

        row.querySelectorAll(".adresa-cell").forEach((adresaCell) => {
          adresaCell.addEventListener("click", () => {
            const span = adresaCell.querySelector(".adresa-clamp");
            if (span) span.classList.toggle("adresa-expanded");
          });
        });
      }

        } = bindPretFieldsProdus("add");

              .forEach((b) => b.classList.toggle("btn-primary", b === btn));

              .querySelectorAll(".add-civ-btn")
              .forEach((b) => b.classList.toggle("btn-primary", b === btn));
          });
        });

        document
          .getElementById("form-add-produs")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("add-produs-msg");
            const btn = e.target.querySelector('button[type="submit"]');

            const categorieVal = !catAltaWrap.classList.contains("hidden")
              ? catAlta.value.trim()
              : catSelect.value;
            if (!categorieVal) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Alege sau specifică o categorie.";
              return;
            }
            const agentVal =
              document.getElementById("add-agent").value.trim() || null;

            const intrare = parseFloat(addIntrare.value) || null;
            const vanzare = parseFloat(addTotalIntrare.value) || null;
            const alte = parseFloat(addAlte.value) || 0;
            const adaos = addAdaos.value.trim()
              ? parseFloat(addAdaos.value)
              : null;
            const total = addTotal.value.trim()
              ? parseFloat(addTotal.value)
              : null;
            const cuTva = addTva.value.trim() ? parseFloat(addTva.value) : null;
            const pretRecomandat = document
              .getElementById("add-pret-recomandat")
              .value.trim()
              ? parseFloat(document.getElementById("add-pret-recomandat").value)
              : null;
            const discountVal = addDiscount.value.trim()
              ? parseFloat(addDiscount.value)
              : 0;
            const civVal = addCiv.value === "da";

            btn.disabled = true;
            btn.textContent = "Se salvează...";

            // Reîncercare la coliziune de id_produs (același model folosit la
            // importul în masă din Antedepozit) — dacă ID-ul generat la
            // deschiderea modalului a fost între timp folosit de altcineva,
            // se regenerează și se reîncearcă în loc să eșueze direct.
            let idProdusDeSalvat = idProdus;
            let rezultatInsert;
            for (let incercare = 0; incercare < 5; incercare++) {
              rezultatInsert = await supa
                .from("produse")
                .insert({
                  id_produs: idProdusDeSalvat,
                  agent: agentVal,
                  categorie: categorieVal,
                  marca:
                    document.getElementById("add-marca").value.trim() || null,
                  model:
                    document.getElementById("add-model").value.trim() || null,
                  culoare:
                    document.getElementById("add-culoare").value.trim() || null,
                  vin: document.getElementById("add-vin").value.trim() || null,
                  pret_intrare: intrare,
                  pret_vanzare: vanzare,
                  adaos,
                  alte_costuri: alte,
                  total_fara_tva: total,
                  pret_cu_tva: cuTva,
                  pret_recomandat: pretRecomandat,
                  discount: discountVal,
                  discount_tip: addDiscountTip.value,
                  civ: civVal,
                  created_by: currentUser.id,
                })
                .select()
                .single();
              const esteDuplicatId =
                rezultatInsert.error &&
                (rezultatInsert.error.code === "23505" ||
                  /duplicate key/i.test(rezultatInsert.error.message || "")) &&
                /id_produs/i.test(rezultatInsert.error.message || "");
              if (!rezultatInsert.error || !esteDuplicatId) break;
              idProdusDeSalvat = generateProductId();
            }
            const { data: produsNou, error } = rezultatInsert;

            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message;
              btn.disabled = false;
              btn.textContent = "Salvează produsul";
              return;
            }

            overlay.remove();
            toast("Produs adăugat cu succes în stoc.");
            inregistreazaLog(
              "produs",
              produsNou.id,
              "Adăugare în Depozitul central",
              `ID produs: ${produsNou.id_produs}`,
            );
            onSaved();
            if (onCreated) onCreated(produsNou);
          });
      }

      const COMANDA_FILTER_STATUSES = [
        { key: "in_asteptare", label: "În așteptare" },
        { key: "partial_onorata", label: "Parțial onorată" },
        { key: "onorata", label: "Onorată" },
      ];
      const STADIU_PLATA_FILTER_OPTIONS = [
        { key: "neachitat", label: "Neachitat" },
        { key: "integral", label: "Achitat integral" },
        { key: "partial", label: "Achitat parțial" },
      ];
      let comenziStatusFilter = [];

      function aplicaFiltruStadiuPlata(query, chei) {
        if (!chei.length) return query;
        if (chei.length === 1) {
          return chei[0] === "neachitat"
            ? query.is("stadiu_plata", null)
            : query.eq("stadiu_plata", chei[0]);
        }
        const map = {
          neachitat: "stadiu_plata.is.null",
          integral: "stadiu_plata.eq.integral",
          partial: "stadiu_plata.eq.partial",
        };
        return query.or(chei.map((k) => map[k]).join(","));
      }

      function statusFilterChipsHtml(selected) {
        const chip = (key, label, active) =>
          `<button type="button" data-status-filter="${key}" class="status-filter-chip rounded-full px-3 py-1 text-xs font-medium border transition-colors ${active ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-600 hover:bg-slate-50"}">${esc(label)}</button>`;
        const chipPlata = (key, label, active) =>
          `<button type="button" data-stadiu-plata-filter="${key}" class="stadiu-plata-filter-chip rounded-full px-3 py-1 text-xs font-medium border transition-colors ${active ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-600 hover:bg-slate-50"}">${esc(label)}</button>`;
        return `
    <div class="flex items-center gap-1.5 flex-wrap mb-3">
      <span class="text-xs text-slate-400 mr-1">Filtru status:</span>
      ${chip("__all__", "Toate", !selected.length)}
      ${COMANDA_FILTER_STATUSES.map((s) => chip(s.key, s.label, selected.includes(s.key))).join("")}
      <button type="button" id="dropshipping-filter-chip" class="rounded-full px-3 py-1 text-xs font-medium border transition-colors ml-1 ${comenziDropshippingFilter ? "bg-purple-700 text-white border-purple-700" : "border-slate-300 text-slate-600 hover:bg-slate-50"}">Dropshipping</button>
      <span class="w-px h-4 bg-slate-200 mx-1"></span>
      ${STADIU_PLATA_FILTER_OPTIONS.map((s) => chipPlata(s.key, s.label, comenziStadiuPlataFilter.includes(s.key))).join("")}
    </div>`;
      }

      function bindStatusFilterChips(container, onChange) {
        container.querySelectorAll(".status-filter-chip").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.statusFilter;
            if (key === "__all__") {
              comenziStatusFilter = [];
              resetPage(currentTabKey);
              onChange();
              return;
            }
            const next = comenziStatusFilter.slice();
            const idx = next.indexOf(key);
            if (idx >= 0) {
              next.splice(idx, 1);
            } else {
              if (next.length >= 2) next.shift();
              next.push(key);
            }
            comenziStatusFilter = next;
            resetPage(currentTabKey);
            onChange();
          });
        });
        container
          .querySelectorAll(".stadiu-plata-filter-chip")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              const key = btn.dataset.stadiuPlataFilter;
              const next = comenziStadiuPlataFilter.slice();
              const idx = next.indexOf(key);
              if (idx >= 0) {
                next.splice(idx, 1);
              } else {
                if (next.length >= 2) next.shift();
                next.push(key);
              }
              comenziStadiuPlataFilter = next;
              resetPage(currentTabKey);
              onChange();
            });
          });
        const dropshippingChip = container.querySelector(
          "#dropshipping-filter-chip",
        );
        if (dropshippingChip) {
          dropshippingChip.addEventListener("click", () => {
            comenziDropshippingFilter = !comenziDropshippingFilter;
            resetPage(currentTabKey);
            onChange();
          });
        }
      }

          : "";

      function comandaStatusFiltrabil(c, lines) {
        return c.status === "anulata" ? "anulata" : computeComandaStatus(lines);
      }

      function filtreazaComenziDupaStatus(comenzi, linii) {
        if (!comenziStatusFilter.length) return comenzi;
        return comenzi.filter((c) => {
          const st = comandaStatusFiltrabil(
            c,
            linii.filter((l) => l.comanda_id === c.id),
          );
          return comenziStatusFilter.includes(st);
        });
      }

      function lineStatusLabel(s) {
        if (s === "trimis") return "Trimis";
        if (s === "realocat") return "Realocat";
        if (s === "asignat") return "Pregătit (rezervat)";
        return "Neasignat";
      }

      function produsMatchesLinie(p, l) {
        if (l.categorie && p.categorie !== l.categorie) return false;
        if (
          l.marca &&
          (p.marca || "").trim().toLowerCase() !==
            (l.marca || "").trim().toLowerCase()
        )
          return false;
        if (
          l.model &&
          (p.model || "").trim().toLowerCase() !==
            (l.model || "").trim().toLowerCase()
        )
          return false;
        if (
          l.culoare &&
          (p.culoare || "").trim().toLowerCase() !==
            (l.culoare || "").trim().toLowerCase()
        )
          return false;
        return true;
      }

      async function loadStocDisponibilPentruComenzi() {
        const [
          { data: produse, error: prodErr },
          { data: linii, error: liniiErr },
        ] = await Promise.all([
          supa
            .from("produse")
            .select("*")
            .is("magazin_id", null)
            .eq("vandut", false)
            .eq("vanzare_directa", false),
          supa
            .from("comanda_produse")
            .select("*")
            .eq("status_linie", "asignat"),
        ]);
        return {
          produse: prodErr ? [] : produse || [],
          allLinii: liniiErr ? [] : linii || [],
        };
      }

      async function completeazaProduseLinii(linii, produseExistente) {
        const idsNecesare = Array.from(
          new Set(
            (linii || []).filter((l) => l.produs_id).map((l) => l.produs_id),
          ),
        );
        const idsExistente = new Set((produseExistente || []).map((p) => p.id));
        const idsLipsa = idsNecesare.filter((id) => !idsExistente.has(id));
        if (!idsLipsa.length) return produseExistente || [];
        const { data, error } = await supa
          .from("produse")
          .select("*")
          .in("id", idsLipsa);
        if (error || !data) return produseExistente || [];
        return [...(produseExistente || []), ...data];
      }

      function stocDisponibilPentruComenzi(context, excludeLinieId) {
        const reserved = new Set(
          (context.allLinii || [])
            .filter((x) => x.produs_id && x.id !== excludeLinieId)
            .map((x) => x.produs_id),
        );
        return (context.produse || []).filter(
          (p) =>
            !p.magazin_id &&
            !p.vandut &&
            !p.vanzare_directa &&
            !reserved.has(p.id),
        );
      }

      function findMatchingStockProduct(l, context) {
        if (l.produs_id) return null;
        const disponibile = stocDisponibilPentruComenzi(context, l.id);
        return disponibile.find((p) => produsMatchesLinie(p, l)) || null;
      }

      function computeComandaStatus(lines) {
        if (!lines.length) return "in_asteptare";
        const allTrimis = lines.every((l) => l.status_linie === "trimis");
        const anyTrimis = lines.some((l) => l.status_linie === "trimis");
        if (allTrimis) return "onorata";
        if (anyTrimis) return "partial_onorata";
        return "in_asteptare";
      }

      async function syncComandaStatus(comandaId, lines) {
        if (!comandaId) return;
        const status = computeComandaStatus(lines || []);
        const updatePayload = { status, updated_at: new Date().toISOString() };
        if (status === "onorata") {
          // Termenul de plată curge de la data onorării integrale (= data facturării),
          // nu de la data creării comenzii. Se ștampilează o singură dată, la prima
          // atingere a stadiului "onorată" — nu se resuprascrie la reveniri ulterioare.
          const { data: comandaCurenta } = await supa
            .from("comenzi")
            .select("termen_plata, data_limita_plata")
            .eq("id", comandaId)
            .single();
          if (
            comandaCurenta &&
            comandaCurenta.termen_plata &&
            !comandaCurenta.data_limita_plata
          ) {
            updatePayload.data_limita_plata = adaugaZileData(
              astaziISO(),
              comandaCurenta.termen_plata,
            );
          }
        }
        await supa
          .from("comenzi")
          .update(updatePayload)
          .eq("id", comandaId)
          .neq("status", "anulata");
      }

      async function nextOrderNumber() {
        const sufixAn = String(new Date().getFullYear()).slice(-2);
        const prefix = `C${sufixAn}-`;
        const { data } = await supa.from("comenzi").select("numar_comanda");
        let max = 0;
        (data || []).forEach((c) => {
          const numar = c.numar_comanda || "";
          if (!numar.startsWith(prefix)) return;
          const m = new RegExp(`^${prefix}(\\d+)$`).exec(numar);
          if (m) max = Math.max(max, parseInt(m[1], 10));
        });
        return prefix + String(max + 1).padStart(4, "0");
      }

      async function insertComandaCuNumarUnic(
        payloadFaraNumar,
        maxIncercari = 5,
      ) {
        let ultimaEroare = null;
        for (let incercare = 0; incercare < maxIncercari; incercare++) {
          const numarComanda = await nextOrderNumber();
          const { data, error } = await supa
            .from("comenzi")
            .insert({ ...payloadFaraNumar, numar_comanda: numarComanda })
            .select()
            .single();
          if (!error) {
            return { data, error: null, numarComanda };
          }
          ultimaEroare = error;
          const esteDuplicatNumarComanda =
            error.code === "23505" && /numar_comanda/.test(error.message || "");
          if (!esteDuplicatNumarComanda) {
            return { data: null, error, numarComanda: null };
          }
        }
        return { data: null, error: ultimaEroare, numarComanda: null };
      }

          <span class="font-semibold whitespace-nowrap">${p.pret_cu_tva !== null && p.pret_cu_tva !== undefined ? fmtNum(p.pret_cu_tva) + " lei" : "—"}</span>
        </button>`,
                )
                .join("")
            : `<p class="text-xs text-slate-400 text-center py-3">Niciun produs disponibil în stoc.</p>`;
          stocList.querySelectorAll("[data-stoc-produs]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const p = stocDisponibilComanda.find(
                (x) => x.id === btn.dataset.stocProdus,
              );
              if (!p) return;
              const row = editor.addLineRow();
              editor.fillLineFromProdus(row, p);
            });
          });
        }
        function repaintStocCentral() {
          paintStocCentral(
            document.getElementById("comanda-stoc-central-search").value,
            document.getElementById("comanda-stoc-central-filtru-marca").value,
            document.getElementById("comanda-stoc-central-filtru-model").value,
            document.getElementById("comanda-stoc-central-filtru-culoare")
              .value,
          );
        }
        if (veziStocBtn) {
          function ajusteazaLatimileModalelorComanda(stocDeschis) {
            const card = document.getElementById("comanda-nou-card");
            const wrap = document.getElementById("comanda-stoc-central-wrap");
            const baseRem = 56;
            const remPx = 16;
            const marginePx = 48;
            if (!stocDeschis) {
              const latimePx = Math.min(
                baseRem * remPx,
                window.innerWidth - marginePx,
              );
              card.style.width = latimePx + "px";
              return;
            }
            const gapPx = 16; // gap-4 dintre cele două modale
            const disponibilPx = window.innerWidth - marginePx - gapPx;
            const fiecarePx = Math.max(
              280,
              Math.min(baseRem * remPx, disponibilPx / 2),
            );
            card.style.width = fiecarePx + "px";
            wrap.style.width = fiecarePx + "px";
          }
          veziStocBtn.addEventListener("click", () => {
            const wasHidden = stocWrap.classList.contains("hidden");
            const card = document.getElementById("comanda-nou-card");
            if (wasHidden) {
              stocWrap.style.maxHeight = card.offsetHeight + "px";
              ajusteazaLatimileModalelorComanda(true);
              stocWrap.classList.remove("hidden");
              repaintStocCentral();
            } else {
              ajusteazaLatimileModalelorComanda(false);
              stocWrap.classList.add("hidden");
            }
          });
          document
            .getElementById("comanda-stoc-central-search")
            .addEventListener("input", repaintStocCentral);
          document
            .getElementById("comanda-stoc-central-filtru-marca")
            .addEventListener("input", repaintStocCentral);
          document
            .getElementById("comanda-stoc-central-filtru-model")
            .addEventListener("input", repaintStocCentral);
          document
            .getElementById("comanda-stoc-central-filtru-culoare")
            .addEventListener("input", repaintStocCentral);
          const stocCentralCloseBtn = document.getElementById(
            "comanda-stoc-central-close",
          );
          if (stocCentralCloseBtn) {
            stocCentralCloseBtn.addEventListener("click", () => {
              veziStocBtn.click();
            });
          }
        }

        document
          .getElementById("form-new-comanda")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("comanda-msg");
            const btn = e.target.querySelector('button[type="submit"]');

            const magazinId = document.getElementById("comanda-magazin").value;
            if (!magazinId) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Alege magazinul pentru care se face comanda.";
              return;
            }
            const lines = editor.getLines();
            if (!lines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Adaugă cel puțin un produs în comandă.";
              return;
            }

            const esteDropshipping = document.getElementById(
              "comanda-dropshipping",
            ).checked;
            const awbFiles = awbFilesSelected.slice();
            if (esteDropshipping && !awbFiles.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent =
                "Comanda este marcată Dropshipping — încarcă cel puțin un document AWB.";
              return;
            }

            const agentVal =
              mode === "admin"
                ? document.getElementById("comanda-agent").value.trim() || null
                : currentProfile.nume || currentProfile.email;

            btn.disabled = true;
            btn.textContent = "Se trimite...";

            const esteVanzareDirecta =
              mode === "admin" && magazinId === VANZARE_DIRECTA;
            const termenPlataVal = document
              .getElementById("comanda-termen-plata")
              .value.trim();
            const termenPlataZile = termenPlataVal
              ? parseInt(termenPlataVal, 10)
              : null;
            const numarComandaPayload = {
              magazin_id: esteVanzareDirecta ? null : magazinId,
              vanzare_directa: esteVanzareDirecta,
              agent: agentVal,
              creat_de: currentUser.id,
              status: "in_asteptare",
              termen_plata: termenPlataZile,
              dropshipping: esteDropshipping,
              observatii:
                document.getElementById("comanda-observatii").value.trim() ||
                null,
            };
            const {
              data: comanda,
              error: comErr,
              numarComanda,
            } = await insertComandaCuNumarUnic(numarComandaPayload);

            if (comErr) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = comErr.message;
              btn.disabled = false;
              btn.textContent = "Trimite comanda";
              return;
            }

            const { error: liniiErr } = await supa
              .from("comanda_produse")
              .insert(
                lines.flatMap((l) =>
                  Array.from({ length: l.cantitate }, () => ({
                    comanda_id: comanda.id,
                    categorie: l.categorie,
                    marca: l.marca,
                    model: l.model,
                    culoare: l.culoare,
                    cantitate: 1,
                    status_linie: "neasignat",
                  })),
                ),
              );

            if (liniiErr) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = liniiErr.message;
              btn.disabled = false;
              btn.textContent = "Trimite comanda";
              return;
            }

            if (esteDropshipping && awbFiles.length) {
              try {
                await incarcaDocumenteAwbComanda(comanda.id, awbFiles);
              } catch (awbErr) {
                toast(
                  "Comanda a fost creată, dar încărcarea documentelor AWB a eșuat: " +
                    awbErr.message,
                  true,
                );
              }
            }

            overlay.remove();
            toast(`Comanda ${comanda.numar_comanda} a fost creată.`);
            inregistreazaLog(
              "comanda",
              comanda.id,
              "Creare",
              `Nr. comandă: ${comanda.numar_comanda}${esteDropshipping ? " · Dropshipping" : ""}`,
            );
            onSaved();
          });
      }
