<!doctype html>
<html lang="ro">
  <head>
    <!-- Legătura către Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#111827" />

    <!-- Setări pentru ecran complet pe mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#161b22" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asamblare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <style>
      /* Design tokens preluate din aplicația de distribuții */
      :root {
        --graphite: #161b22;
        --graphite-2: #20272f;
        --teal: #0fbf9f;
        --teal-dark: #0b9b82;
        --amber: #f0a93b;
        --bg: #f5f7f8;
        --line: #e3e7e9;
        --card: #fff;
        --ink: #1e293b;
        --mut: #64748b;
        --gr: #161b22;
        --tb: #d9f5ee;
        --ok: #0b8a5f;
        --okb: #eaf7f0;
        --no: #b91c1c;
        --nob: #fee2e2;
        --wa: #b4650b;
        --wab: #fff1de;
        --bl: #1d6fa5;
        --blb: #e6f4ff;
        --sl: #64748b;
        --slb: #f1f2f4;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        --r: 16px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
      }
      h1,
      h2,
      h3,
      h4,
      .brand {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
      }
      h3 {
        font-size: 16px;
      }
      h4 {
        font-size: 14px;
      }
      button {
        font-family: inherit;
        touch-action: manipulation;
      }
      a {
        color: var(--teal-dark);
      }
      /* antet + navigare */
      header {
        background: var(--graphite);
        color: #fff;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
        padding-right: calc(16px + env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      header b {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
        font-size: 17px;
      }
      header small {
        color: #94a3b8;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
      }
      nav {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 max(16px, calc((100% - 980px) / 2 + 16px));
      }
      nav::-webkit-scrollbar {
        display: none;
      }
      nav button {
        flex: 0 0 auto;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        color: #6b7280;
        padding: 14px 16px;
        min-height: 48px;
        font:
          600 14px Inter,
          system-ui,
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      nav button:hover {
        color: #111827;
      }
      nav button.on {
        background: transparent;
        border-color: var(--teal);
        color: #111827;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }
      /* carduri */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .crit-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 5px;
        margin-bottom: 3px;
      }
      .crit-row input[type="number"] {
        width: 38px;
        flex: 0 0 auto;
        padding: 3px 5px;
        min-height: 28px;
        font-size: 12.5px;
        text-align: center;
      }
      .crit-row input[data-f="model"] {
        width: 78px;
        flex: 0 0 auto;
        padding: 3px 6px;
        min-height: 28px;
        font-size: 12.5px;
      }
      .crit-row input[data-f="text"] {
        flex: 1 1 auto;
        min-width: 50px;
        padding: 3px 8px;
        min-height: 28px;
        font-size: 12.5px;
      }
      .crit-row label {
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--mut);
        flex: 0 0 auto;
      }
      .crit-row label input[type="checkbox"] {
        width: 15px !important;
        height: 15px;
      }
      .crit-row button.btn {
        padding: 3px 7px;
        min-height: 28px;
        font-size: 12px;
        flex: 0 0 auto;
      }
      .add-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .add-row input {
        padding: 6px 10px;
        min-height: 32px;
        font-size: 13px;
      }
      .add-row input#nm-asamblare {
        width: 110px;
        flex: 0 0 auto;
      }
      .add-row input#ns-asamblare,
      .add-row input#ns-ctc {
        flex: 1 1 auto;
        min-width: 60px;
      }
      .add-row button.btn {
        padding: 6px 12px;
        min-height: 32px;
        font-size: 13px;
        flex: 0 0 auto;
      }
      .model-toggle {
        border: 0;
        background: transparent;
        color: var(--mut);
        cursor: pointer;
        font:
          800 15px Manrope,
          system-ui,
          sans-serif;
        padding: 0 6px 0 0;
        line-height: 1;
      }
      .model-toggle:hover {
        color: var(--ink);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      /* câmpuri */
      input,
      textarea,
      select {
        border: 1px solid #d5dbe0;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
        width: 100%;
        min-height: 42px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: transparent;
        box-shadow: 0 0 0 2px var(--teal);
      }
      textarea {
        min-height: 64px;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: #9ca3af;
      }
      input[type="checkbox"] {
        width: 20px !important;
        height: 20px;
        min-height: 0;
        accent-color: var(--teal-dark);
        vertical-align: middle;
      }
      /* butoane */
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        min-height: 44px;
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        background: var(--teal);
        color: #0a1210;
        transition: background-color 0.12s ease;
      }
      .btn:hover {
        background: var(--teal-dark);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.red {
        background: var(--no);
        color: #fff;
      }
      .btn.red:hover {
        background: #991b1b;
      }
      .btn.gh {
        background: #fff;
        color: var(--ink);
        border: 1px solid #d5dbe0;
      }
      .btn.gh:hover {
        background: #f8fafb;
      }
      .btn.sm {
        padding: 6px 12px;
        min-height: 36px;
        font-size: 13px;
      }
      /* etichete stadiu */
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .p-in_asamblare {
        background: var(--wab);
        color: var(--wa);
      }
      .p-in_remediere {
        background: var(--nob);
        color: var(--no);
      }
      .p-asteapta_ctc {
        background: var(--slb);
        color: var(--sl);
      }
      .p-in_ctc {
        background: var(--blb);
        color: var(--bl);
      }
      .p-ctc_avizat {
        background: var(--okb);
        color: var(--ok);
      }
      /* fișă */
      .timer {
        font:
          700 24px Manrope,
          ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--teal-dark);
      }
      .crit {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .crit.nok {
        border-color: var(--no);
      }
      .crit.ok {
        border-color: var(--ok);
      }
      .tg {
        display: flex;
        gap: 8px;
      }
      .tg button {
        min-width: 72px;
        min-height: 46px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #d5dbe0;
        background: #fff;
        color: var(--ink);
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      .tg .ok {
        background: var(--okb);
        color: var(--ok);
        border-color: var(--ok);
      }
      .tg .no {
        background: var(--nob);
        color: var(--no);
        border-color: var(--no);
      }
      .def {
        margin-top: 10px;
        padding: 12px;
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 12px;
      }
      .ist-nr {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin: 8px 0;
      }
      .ist-nr .h {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .ist-b {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        white-space: nowrap;
        height: fit-content;
      }
      .ist-b.o {
        background: #fee2e2;
        color: #b91c1c;
      }
      .ist-b.r {
        background: #dcfce7;
        color: #15803d;
      }
      .ist-lb {
        z-index: 60;
      }
      .ov > div.ist-m {
        max-width: 1060px;
        max-height: 94vh;
        max-height: 94dvh;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .ist-m .tl div {
        padding: 5px 0;
        font-size: 13px;
      }
      .ist-m h4 {
        margin: 12px 0 4px;
      }
      .ist-g {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 22px;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .ist-g > div {
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }
      .ist-g.s {
        grid-template-columns: minmax(0, 1fr);
      }
      .ist-g details {
        margin-top: 0 !important;
      }
      .ist-pp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 6px;
      }
      .ist-lb > div.ist-lbc {
        max-width: min(96vw, 1100px);
        max-height: 96vh;
        max-height: 96dvh;
        padding: 14px;
      }
      .ist-lbc img {
        max-width: 100%;
        max-height: calc(100vh - 190px);
        max-height: calc(100dvh - 190px);
        border-radius: 10px;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .ist-g,
        .ist-pp {
          grid-template-columns: minmax(0, 1fr);
        }
        .ov > div.ist-m {
          display: block;
          overflow: auto;
        }
        .ist-g {
          display: block;
          overflow: visible;
        }
        .ist-g > div {
          overflow: visible;
        }
      }
      .ph {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0;
      }
      .ph img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .lbl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        color: var(--ink);
      }
      .lbl:hover {
        border-color: var(--teal-dark);
        background: #eefaf7;
      }
      .lbl input {
        display: none;
      }
      /* dashboard */
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .kpi:hover {
        border-color: var(--teal);
      }
      .kpi.on {
        border-color: var(--teal);
        box-shadow: 0 0 0 2px var(--tb);
      }
      .kpi b {
        display: block;
        font:
          800 26px Manrope,
          system-ui,
          sans-serif;
        margin-top: 4px;
      }
      .al {
        background: #fef3e2;
        color: #92400e;
        border: 1px solid #fde8c8;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .list-scroll {
        max-height: 55vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .list-scroll .card:last-child {
        margin-bottom: 0;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 600px;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #eef1f3;
        font-size: 12.5px;
        white-space: nowrap;
      }
      #tb .btn.sm {
        padding: 4px 8px;
        min-height: 28px;
        font-size: 11.5px;
      }
      .list-scroll thead th {
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 2;
      }
      .pg-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      /* datepicker ZZ.LL.AAAA */
      .dp {
        position: relative;
      }
      .dp .dp-txt {
        cursor: pointer;
        background: #fff;
        padding-right: 16px;
      }
      .dp .dp-native {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      /* filtre Statistici: padding vertical minim */
      .sta-filters input,
      .sta-filters select {
        padding-top: 6px;
        padding-bottom: 6px;
        min-height: 34px;
      }
      /* tabel Statistici: fără scroll orizontal pe desktop, coloane compacte */
      .tbl-sta th,
      .tbl-sta td {
        white-space: normal;
        word-break: break-word;
        padding: 3px 6px;
      }
      .tbl-sta {
        min-width: 0;
        width: 100%;
      }
      .tbl-sta .mono {
        font-size: 11px;
      }
      /* pe mobil: revenire la nowrap + glisare orizontală (mai lizibil decât wrap pe litere) */
      @media (max-width: 820px) {
        .tbl-sta th,
        .tbl-sta td {
          white-space: nowrap;
          word-break: normal;
          padding: 4px 8px;
        }
        .tbl-sta {
          min-width: 760px;
          width: auto;
        }
        .tbl-sta .mono {
          font-size: 12.5px;
        }
      }
      th {
        color: var(--mut);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: #f8fafb;
      }
      tbody tr {
        background: #fff;
        transition: background-color 0.12s ease;
      }
      tbody tr:nth-child(2n) {
        background: #fafbfc;
      }
      tbody tr:hover {
        background: #eefaf7;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      /* bara de jos a fișei */
      .foot {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(
          to top,
          var(--bg) 82%,
          rgba(245, 247, 248, 0)
        );
      }
      /* autentificare */
      .auth {
        max-width: 380px;
        margin: 8vh auto;
        padding: 0 16px;
      }
      .auth h2 {
        font-size: 22px;
        margin: 0 0 14px;
      }
      .auth .card {
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }
      .auth .card > * {
        margin-bottom: 12px;
      }
      .auth .card > *:last-child {
        margin-bottom: 0;
      }
      /* notificare + fereastră modală */
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--graphite);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 99;
        display: none;
        max-width: 92%;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
      }
      #toast.e {
        background: var(--no);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(15, 20, 25, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
        animation: fadeIn 0.25s ease;
      }
      .ov > div {
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        max-height: 88dvh;
        overflow: auto;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
      }
      .tl div {
        padding: 8px 0;
        border-bottom: 1px solid #eef1f3;
        font-size: 14px;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header .btn.gh {
        background: transparent;
      }
      header .btn.gh:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* ---- tablete și telefoane ---- */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px;
          min-height: 46px;
        }
        .btn {
          min-height: 48px;
        }
        .btn.sm {
          min-height: 44px;
        }
        .lbl {
          min-height: 48px;
        }
        .tg button {
          min-height: 50px;
          min-width: 80px;
        }
        nav button {
          min-height: 52px;
        }
        th,
        td {
          padding: 10px 12px;
        }
      }
      @media (max-width: 820px) {
        main {
          padding: 12px 12px calc(32px + env(safe-area-inset-bottom, 0px));
        }
        .card {
          padding: 14px;
        }
        .ov {
          padding: 0;
          align-items: flex-end;
        }
        .ov > div {
          max-width: none;
          border-radius: 20px 20px 0 0;
          max-height: 92vh;
          max-height: 92dvh;
        }
      }
      @media (max-width: 640px) {
        .row[style*="nowrap"] {
          flex-wrap: wrap !important;
        }
        .row[style*="nowrap"]
          input:not([type="checkbox"]):not([type="number"]) {
          flex: 1 1 100%;
        }
        .foot > * {
          flex: 1 1 auto;
        }
        .foot .btn {
          width: 100%;
        }
        .foot > div:first-child {
          display: flex;
          gap: 8px;
        }
        .foot > div:first-child .btn {
          width: auto;
          flex: 1;
        }
        .tg {
          width: 100%;
        }
        .tg button {
          flex: 1;
        }
        .crit .row {
          align-items: stretch;
        }
        .ph img {
          width: 64px;
          height: 64px;
        }
        header b {
          font-size: 16px;
        }
      }
      /* Stiluri pentru logo */
      .logo-header {
        height: 72px; /* = înălțimea benzii închise; fără margini sus/jos/stânga */
        width: auto;
        display: block;
        vertical-align: middle;
        margin: 0 8px 0 0;
      }
      /* logo lipit de marginile benzii (sus, jos, stânga) */
      header {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: 0;
        padding-left: env(safe-area-inset-left, 0px);
      }
      header > div:first-child {
        display: flex;
        align-items: center;
      }
      /* rol (culoare diferită per rol) deasupra, nume alb mai gros dedesubt */
      header {
        --hf: 13px; /* aceeași mărime pentru rol/nume și textele butoanelor */
        --hl: 168px; /* lungimea liniilor albe (stânga = dreapta pe desktop) */
      }
      header .who {
        position: relative;
        align-self: stretch;
        min-width: var(--hl);
        display: grid;
        grid-template-rows: 1fr 1fr; /* rol = jumătatea de sus, nume = jumătatea de jos */
        grid-template-columns: minmax(0, 1fr);
        line-height: 1.2;
      }
      header .who::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: var(--hl);
        height: 1px;
        background: linear-gradient(
          to right,
          #fff 0%,
          #fff 70%,
          rgba(255, 255, 255, 0) 100%
        ); /* pornește lângă logo, se pierde spre dreapta */
        pointer-events: none;
      }
      header .who .role,
      header .who .uname {
        display: flex;
        align-items: center; /* centrat vertical în jumătatea lui */
        font-size: var(--hf);
      }
      header .who .role {
        font-weight: 700;
        color: #94a3b8;
      }
      header .who .role-asm_operator {
        color: #f0a93b;
      }
      header .who .role-asm_remediere {
        color: #f87171;
      }
      header .who .role-asm_ctc {
        color: #38bdf8;
      }
      header .who .role-asm_admin {
        color: #2dd4bf;
      }
      header .who .role-superadmin {
        color: #c084fc;
      }
      header .who .uname {
        font-weight: 600;
        color: #fff;
      }
      /* zona din dreapta a antetului: linie albă la mijloc, două butoane */
      header .hdr-actions {
        position: relative;
        align-self: stretch;
        min-height: 72px;
        display: grid;
        grid-template-rows: 1fr 1fr;
        padding-left: 28px; /* linia se termină la ~jumătate din lungimea textului, în stânga lui */
      }
      header .hdr-actions::before {
        content: "";
        position: absolute;
        top: 50%;
        left: auto;
        width: var(--hl);
        right: calc(
          -16px - env(safe-area-inset-right, 0px)
        ); /* pornește din marginea dreaptă */
        height: 1px;
        background: linear-gradient(
          to left,
          #fff 0%,
          #fff 70%,
          rgba(255, 255, 255, 0) 100%
        ); /* se pierde treptat spre stânga */
        pointer-events: none;
      }
      header .hdr-actions > div {
        display: flex;
        align-items: center; /* buton centrat între linie și margine */
      }
      header .hdr-actions .btn {
        width: 100%;
        min-height: 32px;
        padding: 5px 12px;
        font-size: var(--hf);
        white-space: nowrap;
      }
      /* telefoane: toate elementele antetului pe aceeași linie */
      @media (max-width: 640px) {
        header {
          flex-wrap: nowrap;
          gap: 8px;
        }
        header > div:first-child {
          flex: 1 1 auto;
          min-width: 0; /* permite micșorarea zonei rol/nume */
        }
        .logo-header {
          flex: 0 0 auto;
        }
        header .who {
          flex: 1 1 auto;
          min-width: 0;
        }
        header .who::before {
          width: min(
            var(--hl),
            calc(100% - 8px)
          ); /* nu se unește cu linia din dreapta */
        }
        header .who .role,
        header .who .uname {
          display: block;
          align-self: center;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis; /* text lung => "..." în loc de rând nou */
        }
        header .hdr-actions {
          flex: 0 0 auto;
        }
        header .hdr-actions::before {
          left: 0;
          width: auto; /* pe mobil linia din dreapta merge de la butoane la margine */
        }
      }
      @media (max-width: 400px) {
        header {
          --hf: 12px;
        }
        header .hdr-actions .btn {
          padding: 5px 8px;
        }
      }

      .logo-auth {
        width: 300px; /* mai mic decât înainte (360px) */
        max-width: 100%; /* nu depășește lățimea ferestrei de login */
        height: auto;
        display: block;
        margin: 0 auto 14px auto; /* centrat pe aceeași axă cu fereastra de login */
      }
    </style>

      function openChangePassword(trigger) {
        if ($("#pwov")) return;
        const o = document.createElement("div");
        o.className = "ov";
        o.id = "pwov";
        o.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="pwt" style="max-width:420px">
 <h3 id="pwt" style="margin:0 0 4px">Schimbă parola</h3>
 <p class="mut" style="margin:0 0 12px">Alege o parolă nouă pentru contul cu care ești autentificat.</p>
 <input id="np1" type="password" placeholder="Parola nouă (minim 6 caractere)" autocomplete="new-password" style="margin-bottom:8px">
 <input id="np2" type="password" placeholder="Confirmă parola nouă" autocomplete="new-password">
 <label class="mut" style="display:flex;align-items:center;gap:8px;margin:10px 0 0;cursor:pointer"><input type="checkbox" id="npshow"> Arată parolele</label>
 <div id="nperr" role="alert" style="color:var(--no);font-size:13px;min-height:20px;margin:8px 0"></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button class="btn gh" id="npx" type="button">Anulează</button><button class="btn" id="npgo" type="button">Schimbă parola</button></div></div>`;
        document.body.appendChild(o);
        const p1 = $("#np1", o),
          p2 = $("#np2", o),
          show = $("#npshow", o),
          err = $("#nperr", o),
          ok = $("#npgo", o),
          cancel = $("#npx", o);
        let busy = false;
        const close = () => {
          document.removeEventListener("keydown", onKey, true);
          o.remove();
          if (trigger && trigger.focus) trigger.focus();
        };
        const onKey = (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            if (!busy) close();
          } else if (e.key === "Tab") {
            const f = [p1, p2, show, cancel, ok].filter((x) => !x.disabled),
              i = f.indexOf(document.activeElement);
            if (e.shiftKey && i <= 0) {
              e.preventDefault();
              f[f.length - 1].focus();
            } else if (!e.shiftKey && (i === -1 || i === f.length - 1)) {
              e.preventDefault();
              f[0].focus();
            }
          }
        };
        document.addEventListener("keydown", onKey, true);
        show.onchange = () => {
          p1.type = p2.type = show.checked ? "text" : "password";
        };
        const fail = (m, el) => {
          err.textContent = m;
          if (el) el.focus();
        };
        const submit = async () => {
          if (busy) return;
          const a = p1.value,
            b = p2.value;
          err.textContent = "";
          if (a.length < 6)
            return fail("Parola trebuie să aibă minim 6 caractere.", p1);
          if (a !== b) return fail("Parolele introduse nu coincid.", p2);
          busy = true;
          ok.disabled = cancel.disabled = true;
          ok.textContent = "Se salvează...";
          let r;
          try {
            r = await sb.auth.updateUser({ password: a });
          } catch (e) {
            r = { error: e };
          }
          busy = false;
          if (r.error) {
            ok.disabled = cancel.disabled = false;
            ok.textContent = "Schimbă parola";
            const m = String(r.error.message || "").toLowerCase();
            return fail(
              m.includes("different from the old")
                ? "Parola nouă trebuie să fie diferită de cea actuală."
                : m.includes("reauthenticat") || m.includes("recent")
                  ? "Din motive de securitate, deconectează-te, autentifică-te din nou și repetă operația."
                  : r.error.message || "Parola nu a putut fi schimbată.",
              p1,
            );
          }
          close();
          toast("Parola a fost schimbată.");
        };
        ok.onclick = submit;
        cancel.onclick = close;
        [p1, p2].forEach(
          (i) =>
            (i.onkeydown = (e) => {
              if (e.key === "Enter") submit();
            }),
        );
        p1.focus();
      }

      async function computeIndicatori() {
        const de = new Date(Date.now() - 30 * 864e5).toISOString();
        const { data: et } = await sb
          .from("asm_etape")
          .select("asm_produs_id,tip,rezultat,durata_sec,ended_at")
          .not("ended_at", "is", null)
          .gte("ended_at", de);
        const rows = et || [];
        const avg = (arr) =>
          arr.length
            ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length)
            : null;
        const asmOk = rows
          .filter((r) => r.tip === "asamblare" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const remOk = rows
          .filter((r) => r.tip === "remediere" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const ctcOk = rows.filter(
          (r) => r.tip === "ctc" && r.rezultat === "ok",
        );
        let pctPrima = "—";
        if (ctcOk.length) {
          const ids = [...new Set(ctcOk.map((r) => r.asm_produs_id))];
          const { data: remAny } = await sb
            .from("asm_etape")
            .select("asm_produs_id")
            .eq("tip", "remediere")
            .in("asm_produs_id", ids);
          const cuRemediere = new Set(
            (remAny || []).map((r) => r.asm_produs_id),
          );
          const primaOk = ctcOk.filter(
            (r) => !cuRemediere.has(r.asm_produs_id),
          ).length;
          pctPrima = Math.round((primaOk / ctcOk.length) * 100) + "%";
        }
        const { data: nok } = await sb
          .from("asm_checklist_rezultate")
          .select("text_criteriu")
          .eq("rezultat", "nok")
          .gte("bifat_la", de)
          .limit(3000);
        let topCrit = "—";
        if (nok && nok.length) {
          const cnt = {};
          nok.forEach(
            (r) => (cnt[r.text_criteriu] = (cnt[r.text_criteriu] || 0) + 1),
          );
          topCrit = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
        }
        const card = (l, v) =>
          `<div><div class="mut">${l}</div><b style="font-size:20px">${v}</b></div>`;
        return `<div class="kpis" style="margin-top:0;margin-bottom:0">${card("Timp mediu asamblare", asmOk.length ? dur(avg(asmOk) * 1e3) : "—")}${card("Aprobate din prima la CTC", pctPrima)}${card("Timp mediu remediere", remOk.length ? dur(avg(remOk) * 1e3) : "—")}${card("Criteriu cu cele mai multe NOK", esc(topCrit))}</div>`;
      }

      }

      async function exportStatisticiExcel() {
        if (!staFiltered.length) return toast("Nu există date de exportat.", 1);
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Statistici");
        ws.columns = [
          { header: "Nr. crt.", key: "nr", width: 8 },
          { header: "Data", key: "data", width: 18 },
          { header: "Tip activitate", key: "tip", width: 16 },
          { header: "Operator", key: "operator", width: 22 },
          { header: "VIN", key: "vin", width: 20 },
          { header: "Model", key: "model", width: 16 },
          { header: "Culoare", key: "culoare", width: 14 },
          { header: "Stadiu curent", key: "stadiu", width: 16 },
          { header: "Rezultat", key: "rezultat", width: 12 },
          { header: "Durată", key: "durata", width: 12 },
        ];
        ws.getRow(1).font = { bold: true };
        staFiltered.forEach((r, i) =>
          ws.addRow({
            nr: i + 1,
            data: fmtDT(r.ended_at),
            tip: TIP_ACT[r.tip] || r.tip,
            operator: nm(r.user_id),
            vin: r.produs.vin || "—",
            model: r.produs.model || "—",
            culoare: r.produs.culoare || "—",
            stadiu: r.produs.stadiu ? ST[r.produs.stadiu] : "—",
            rezultat: (r.rezultat || "—").toUpperCase(),
            durata: r.durata_sec ? dur(r.durata_sec * 1e3) : "—",
          }),
        );
        const buf = await wb.xlsx.writeBuffer();
        const blob = new Blob([buf], {
          type: "application/octet-stream",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `statistici-asamblare_${staDe}_${staPana}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function istNereguli(ner, etape, vin) {
        IST.items = [];
        IST.url = {};
        IST.signed = false;
        IST.i = 0;
        if (!ner.length) return { h: "", c: 0 };
        const eMap = new Map(etape.map((e) => [e.id, e])),
          ET = { asamblare: "Asamblare", remediere: "Remediere", ctc: "CTC" },
          slug = (x) => String(x || "").replace(/[^A-Za-z0-9_-]+/g, "");
        let total = 0;
        const cards = ner
          .map((n, k) => {
            const e = eMap.get(n.etapa_id),
              et = e ? e.tip : "",
              rem = n.status === "remediata",
              poze = (n.asm_poze || [])
                .slice()
                .sort((a, b) =>
                  String(a.storage_path).localeCompare(String(b.storage_path)),
                ),
              titlu = n.criteriu_text || "Neregulă " + (k + 1),
              th = (tip) => {
                const lst = poze.filter((p) => p.tip === tip);
                if (!lst.length) return '<span class="mut">—</span>';
                return lst
                  .map((p, j) => {

lvt5GZDZ4F2U8cwTLIGSNXdlOegrNxtl9CCSajIyIz2LflvuLvAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA2AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//9k=";
      async function genereazaFisaPdf(asmId) {
        if (!window.jspdf)
          return toast(
            "Biblioteca PDF nu s-a încărcat. Verifică conexiunea și reîncearcă.",
            1,
          );
        toast("Se generează fișa PDF...");
        const [{ data: prod }, { data: etape }, lg] = await Promise.all([
          sb.from("asm_produse").select("*").eq("id", asmId).single(),
          sb
            .from("asm_etape")
            .select("*")
            .eq("asm_produs_id", asmId)
            .order("started_at"),
          sb.rpc("asm_logistic", { p_asm: asmId }),
        ]);
        if (!prod) return toast("Produsul nu a fost găsit.", 1);
        const etapeIds = (etape || []).map((e) => e.id),
          etapaTip = new Map((etape || []).map((e) => [e.id, e.tip]));
        const [{ data: rez }, { data: ner }] = await Promise.all([
          etapeIds.length
            ? sb
                .from("asm_checklist_rezultate")
                .select("*")
                .in("etapa_id", etapeIds)
                .order("ordine")
            : Promise.resolve({ data: [] }),
          sb
            .from("asm_nereguli")
            .select("*,asm_poze(*)")
            .eq("asm_produs_id", asmId)
            .order("created_at"),
        ]);
        const paths = (ner || []).flatMap((n) =>
          n.asm_poze.map((x) => x.storage_path),
        );
        let urls = {};
        if (paths.length) {
          const { data } = await sb.storage
            .from(B)
            .createSignedUrls(paths, 3600);
          (data || []).forEach((u) => (urls[u.path] = u.signedUrl));
        }
        const imgCache = {};
        for (const path of paths) {
          const u = urls[path];
          if (!u) continue;
          const d = await fetchImgDataUrl(u);
          if (d) imgCache[path] = d;
        }

        const { jsPDF } = window.jspdf,
          doc = new jsPDF({ unit: "mm", format: "a4" }),
          PW = 210,
          PH = 297,
          MX = 12,
          MT = 10,
          MB = 14,
          CW = PW - 2 * MX,
          LR = 1280 / 800;
        const FN = "RobotoRO";
        doc.addFileToVFS("RobotoRO-Regular.ttf", FONT_REG);
        doc.addFont("RobotoRO-Regular.ttf", FN, "normal");
        doc.addFileToVFS("RobotoRO-Bold.ttf", FONT_BOLD);
        doc.addFont("RobotoRO-Bold.ttf", FN, "bold");
        doc.setFont(FN, "normal");
        let y = MT;
        const TL = {
          asamblare: "Asamblare",
          remediere: "Remediere",
          ctc: "Verificare CTC",
        };
        const TLN = {
          asamblare: "Din asamblare",
          remediere: "Din remediere",
          ctc: "Din CTC",
        };
        const font = (st, sz) => {
          doc.setFont(FN, st);
          doc.setFontSize(sz);
        };
        const ink = () => doc.setTextColor(15, 23, 42);
        const gray = () => doc.setTextColor(100, 116, 139);
        const thin = () => {
          doc.setDrawColor(226, 231, 235);
          doc.setLineWidth(0.2);
        };
        const black = (w) => {
          doc.setDrawColor(0, 0, 0);
          doc.setLineWidth(w);
        };
        const vinTxt = String(prod.vin || "—");
        const contHeader = () => {
          const w = 24;
          doc.addImage(LOGO_ANTET, "JPEG", MX, MT, w, w / LR);
          font("bold", 9);
          ink();
          doc.text(
            `Fișă asamblare - ${prod.model || "—"} - ${vinTxt}`,
            PW - MX,
            MT + 5,
            { align: "right" },
          );
          font("normal", 8);
          gray();
          doc.text("(continuare)", PW - MX, MT + 9.5, { align: "right" });
          y = MT + w / LR + 3;
          black(0.5);
          doc.line(MX, y, PW - MX, y);
          y += 4;
        };
        const ensure = (need) => {
          if (y + need > PH - MB) {
            doc.addPage();
            contHeader();
          }
        };
        const p = (t, size = 9) => {
          font("normal", size);
          ink();
          const ls = doc.splitTextToSize(String(t), CW);
          ensure(ls.length * 4 + 2);
          doc.text(ls, MX, y + 3);
          y += ls.length * 4 + 2;
        };
        let secN = 0;
        const sec = (t, minBody = 12) => {
          ensure(10 + minBody);
          secN++;
          font("bold", 9.5);
          ink();
          doc.text(`${secN}. ${t.toUpperCase()}`, MX, y + 3);
          y += 5;
          black(0.5);
          doc.line(MX, y, PW - MX, y);
          y += 4;
        };

        /* ===== Antet + titlu ===== */
        doc.addImage(LOGO_ANTET, "JPEG", MX, MT, 48, 48 / LR);
        font("normal", 8);
        gray();
        const _now = new Date();
        doc.text(
          `Generată de: ${nm(me.id)},  la data de: ${_now.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" })}, ora: ${_now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`,
          PW - MX,
          MT + 3,
          { align: "right" },
        );
        y = MT + 48 / LR + 5;
        const stTxt = String(
          ST[prod.stadiu] || prod.stadiu || "—",
        ).toUpperCase();
        font("bold", 8.5);
        const bw = Math.min(55, doc.getTextWidth(stTxt) + 7);
        const titlu = `FIȘĂ ASAMBLARE - ${prod.model || "—"} - ${vinTxt}`;
        let ts = 15;
        font("bold", ts);
        while (ts > 9 && doc.getTextWidth(titlu) > CW - bw - 4) {
          ts -= 0.5;
          font("bold", ts);
        }
        ink();
        doc.text(titlu, MX, y + 5);
        doc.setFillColor(15, 23, 42);
        doc.roundedRect(PW - MX - bw, y, bw, 7, 1.2, 1.2, "F");
        font("bold", 8.5);
        doc.setTextColor(255, 255, 255);
        doc.text(stTxt, PW - MX - bw / 2, y + 4.7, { align: "center" });
        y += 10;
        doc.setFillColor(0, 0, 0);
        doc.rect(MX, y, CW, 1.2, "F");
        y += 5;

        /* ===== 1. Date produs (2 coloane) ===== */
        sec("Date produs", 14);
        const colW = (CW - 6) / 2,
          X2 = MX + colW + 6;
        const kv = (l, v, x, w) => {
          font("bold", 9);
          const lw = doc.getTextWidth(l + " ") + 0.5;
          font("normal", 9);
          const ls = doc.splitTextToSize(String(v), w - lw);
          return {
            h: ls.length * 4.2 + 1.2,
            draw: (yy) => {
              font("bold", 9);
              ink();
              doc.text(l, x, yy);
              font("normal", 9);
              doc.text(ls, x + lw, yy);
            },
          };
        };
        const l = (lg.data || [])[0],
          sit = !l
            ? "În Depozit central / în flux"
            : l.data_vanzare
              ? "Vândut"
              : l.status_linie === "trimis"
                ? "Expediat către " +
                  (l.magazin || "—") +
                  (l.filiala ? " - " + l.filiala : "")
                : "În Depozit central";
        const kvRows = [
          [
            ["VIN:", vinTxt],
            ["Stadiu curent:", ST[prod.stadiu] || prod.stadiu || "—"],
          ],
          [
            ["Model:", prod.model || "—"],
            ["Remedieri:", String(prod.nr_remedieri ?? 0)],
          ],
          [
            ["Culoare:", prod.culoare || "—"],
            ["Situație logistică:", sit],
          ],
        ];
        kvRows.forEach(([a, b]) => {
          const ka = kv(a[0], a[1], MX, colW),
            kb = kv(b[0], b[1], X2, colW),
            rh = Math.max(ka.h, kb.h);
          ensure(rh);
          ka.draw(y + 3);
          kb.draw(y + 3);
          y += rh;
        });
        y += 3;

        /* ===== 2. Traseu (tabel, fără durată) ===== */
        sec("Traseu", 14);
        if (!(etape || []).length) p("Nicio etapă înregistrată.");
        else {
          const cols = [
            ["Etapă", 32],
            ["Operator", 46],
            ["Început", 34],
            ["Sfârșit", 34],
            ["Rezultat", 40],
          ];
          doc.setFillColor(241, 245, 249);
          doc.rect(MX, y, CW, 5.6, "F");
          font("bold", 8);
          ink();
          let cx = MX;
          cols.forEach(([n, w]) => {
            doc.text(n, cx + 1.5, y + 3.9);
            cx += w;
          });
          y += 5.6;
          for (const e of etape) {
            const cells = [
              TL[e.tip] || e.tip,
              nm(e.user_id),
              dt(e.started_at),
              e.ended_at ? dt(e.ended_at) : "în curs",
              e.rezultat || "—",
            ];
            font("normal", 8.5);
            const wr = cells.map((c, i) =>
              doc.splitTextToSize(String(c), cols[i][1] - 3),
            );
            const rh = Math.max(...wr.map((a) => a.length)) * 3.9 + 2.2;
            font("normal", 8);
            const nl = e.nota
              ? doc.splitTextToSize("Notă: " + e.nota, CW - 3)
              : null;
            const nh = nl ? nl.length * 3.5 + 2.6 : 0;
            ensure(rh + nh);
            font("normal", 8.5);
            ink();
            cx = MX;
            wr.forEach((a, i) => {
              doc.text(a, cx + 1.5, y + 3.6);
              cx += cols[i][1];
            });
            y += rh;
            if (nl) {
              font("normal", 8);
              gray();
              doc.text(nl, MX + 1.5, y + 2.2);
              y += nh;
            }
            thin();
            doc.line(MX, y, PW - MX, y);
          }
        }
        y += 4;

        /* ===== 3. Checklist (2 coloane) ===== */
        sec("Checklist", 16);
        const byEtapa = {};
        (rez || []).forEach((r) => {
          (byEtapa[r.etapa_id] = byEtapa[r.etapa_id] || []).push(r);
        });
        let vreunChecklist = false;
        const cw2 = (CW - 6) / 2;
        for (const e of etape || []) {
          const rs = byEtapa[e.id] || [];
          if (!rs.length) continue;
          vreunChecklist = true;
          ensure(14);
          font("bold", 9);
          ink();
          doc.text(`${TL[e.tip] || e.tip} — ${dt(e.started_at)}`, MX, y + 3);
          y += 5.2;
          const half = Math.ceil(rs.length / 2),
            L = rs.slice(0, half),
            R = rs.slice(half);
          const wrap = (r) => {
            font("normal", 8.5);
            return r
              ? doc.splitTextToSize(String(r.text_criteriu || ""), cw2 - 9)
              : [];
          };
          for (let i = 0; i < half; i++) {
            const a = L[i],
              b = R[i],
              la = wrap(a),
              lb = wrap(b),
              rh = Math.max(la.length, lb.length, 1) * 3.8 + 1.4;
            ensure(rh);
            [
              [a, la, MX],
              [b, lb, X2],
            ].forEach(([r, ls, x]) => {
              if (!r) return;
              const ok = r.rezultat === "ok";
              font("bold", 8);
              if (ok) doc.setTextColor(22, 128, 61);
              else doc.setTextColor(185, 28, 28);
              doc.text(ok ? "OK" : "NOK", x, y + 3);
              font("normal", 8.5);
              ink();
              doc.text(ls, x + 9, y + 3);
            });
            y += rh;
          }
          y += 1.5;
        }
        if (!vreunChecklist) p("Fără rezultate de checklist înregistrate.");
        y += 3;

        /* ===== 4. Nereguli constatate ===== */
        sec("Nereguli constatate", (ner || []).length ? 55 : 14);
        if (!(ner || []).length) p("Nicio neregulă înregistrată.");
        const PS = 26,
          PG = 2;
        for (const n of ner || []) {
          const tip = TLN[etapaTip.get(n.etapa_id)] || "",
            tt = `${tip}${tip ? " — " : ""}${n.criteriu_text || "În afara checklist-ului"}`,
            rem = n.status === "remediata";
          font("bold", 9);
          const tl = doc.splitTextToSize(tt, CW - 28);
          font("normal", 8.5);
          const dl = doc.splitTextToSize(n.descriere || "—", CW);
          const sTxt = rem
            ? `Remediată${n.remediata_de ? " de " + nm(n.remediata_de) : ""}${n.remediata_la ? " la " + dt(n.remediata_la) : ""}${n.nota_remediere ? " — notă: " + n.nota_remediere : ""}`
            : "";
          font("normal", 8);
          const sl = sTxt ? doc.splitTextToSize(sTxt, CW) : [];
          const bef = n.asm_poze.filter(
              (x) => x.tip === "inainte" && imgCache[x.storage_path],
            ),
            aft = n.asm_poze.filter(
              (x) => x.tip === "dupa" && imgCache[x.storage_path],
            ),
            rows = Math.ceil(Math.max(bef.length, aft.length) / 3);
          const textH = tl.length * 3.9 + dl.length * 3.8 + sl.length * 3.5 + 3;
          ensure(textH + (rows ? 4 + PS + PG : 0));
          font("bold", 9);
          ink();
          doc.text(tl, MX, y + 3);
          font("bold", 8);
          if (rem) doc.setTextColor(22, 128, 61);
          else doc.setTextColor(185, 28, 28);
          doc.text(rem ? "REMEDIATĂ" : "DESCHISĂ", PW - MX, y + 3, {
            align: "right",
          });
          y += tl.length * 3.9 + 1.2;
          font("normal", 8.5);
          ink();
          doc.text(dl, MX, y + 3);
          y += dl.length * 3.8 + 0.6;
          if (sl.length) {
            font("normal", 8);
            gray();
            doc.text(sl, MX, y + 3);
            y += sl.length * 3.5 + 1.5;
          }
          if (rows) {
            font("normal", 8);
            gray();
            if (bef.length) doc.text("Înainte", MX, y + 2.5);
            if (aft.length) doc.text("După", MX + colW + 6, y + 2.5);
            y += 4;
            for (let r = 0; r < rows; r++) {
              ensure(PS + PG);
              for (const [arr, bx] of [
                [bef, MX],
                [aft, MX + colW + 6],
              ]) {
                for (let k = 0; k < 3; k++) {
                  const ph = arr[r * 3 + k];
                  if (!ph) continue;
                  const d = imgCache[ph.storage_path];
                  try {
                    const dm = await imgDims(d);
                    let w = PS,
                      hh = (w * dm.h) / dm.w;
                    if (hh > PS) {
                      hh = PS;
                      w = (hh * dm.w) / dm.h;
                    }
                    doc.addImage(d, "JPEG", bx + k * (PS + PG), y, w, hh);
                  } catch (er) {}
                }
              }
              y += PS + PG;
            }
          }
          y += 1;
          thin();
          doc.line(MX, y, PW - MX, y);
          y += 3;
        }

        /* ===== Subsol: numerotare pagini ===== */
        const np = doc.getNumberOfPages();
        for (let i = 1; i <= np; i++) {
          doc.setPage(i);
          thin();
          doc.line(MX, PH - 10, PW - MX, PH - 10);
          font("normal", 8);
          gray();
          doc.text("GEELI GENERATION ELECTRIC SRL", MX, PH - 6.5);
          doc.text(`Pagina ${i}/${np}`, PW - MX, PH - 6.5, { align: "right" });
        }

        doc.save(
          `fisa-asamblare-${String(prod.vin || asmId).replace(/[^a-zA-Z0-9-]/g, "")}.pdf`,
        );
      }
      async function vCheck(c) {
        const { data } = await sb
            .from("asm_checklist_sabloane")
            .select("*")
            .order("model_key", { nullsFirst: true })
            .order("ordine"),
          d = data || [];
        const asmR = d.filter((x) => x.tip === "asamblare"),
          ctcR = d.filter((x) => x.tip === "ctc");
        const groups = [];
        asmR.forEach((x) => {
          const k = x.model_key || "";
          if (!groups.some((g) => g.key === k))
            groups.push({
              key: k,
              model: x.model,
              rows: asmR.filter((y) => (y.model_key || "") === k),
            });
        });
        const row = (x, showModel) =>
          `<div class="crit-row"><input type="number" data-c="sab" data-f="ordine" data-id="${x.id}" value="${x.ordine}">${showModel ? `<input data-c="sab" data-f="model" data-id="${x.id}" value="${esc(x.model || "")}" placeholder="Model" list="dl-modele" autocomplete="off">` : ""}<input data-c="sab" data-f="text" data-id="${x.id}" value="${esc(x.text)}"><label><input type="checkbox" data-c="sab" data-f="activ" data-id="${x.id}" ${x.activ ? "checked" : ""}> activ</label><button class="btn gh sm" data-a="delsab" data-id="${x.id}" title="Șterge (istoricul rămâne)">✕</button></div>`;
        c.innerHTML = `<div class="card"><h3 style="margin-top:0">Criterii asamblare — pe model</h3>
 <div class="add-row">
   <input id="nm-asamblare" list="dl-modele" placeholder="Model..." value="${esc(ultimulModel)}" autocomplete="off">
   <input id="ns-asamblare" list="dl-crit-asamblare" placeholder="Criteriu nou..." autocomplete="off">
   <button type="button" class="btn gh sm" id="btn-imp-crit" title="Importă criterii din Excel/CSV (rândul 1 = antet, se ignoră)">📊</button>
   <input type="file" id="file-imp-crit" accept=".xlsx,.xls,.csv" style="display:none">
   <button class="btn" data-a="addsab" data-t="asamblare">Adaugă</button>
 </div>
 ${
   groups
     .map((g) => {
       const open = modeleExpandate.has(g.key);
       return `<div style="border-top:1px solid var(--line);padding-top:6px;margin-top:6px">
   <div class="row" style="margin-bottom:4px"><h4 style="margin:0"><button class="model-toggle" data-a="togmodel" data-key="${esc(g.key)}" title="${open ? "Restrânge" : "Expandează"}">${open ? "−" : "+"}</button>${g.key ? esc(g.model) : '<span class="mut">Fără model — completează câmpul „Model" pe fiecare rând ca să se aplice</span>'}</h4>${g.key ? `<button class="btn gh sm" data-a="dupmodel" data-key="${esc(g.key)}">Copiază la alt model</button>` : ""}</div>
   ${open ? g.rows.map((x) => row(x, true)).join("") : ""}
 </div>`;
     })
     .join("") || '<div class="mut">Niciun criteriu de asamblare încă.</div>'
 }
 </div>
 <div class="card"><h3 style="margin-top:0">Criterii CTC</h3>
 <div class="add-row">
   <input id="ns-ctc" list="dl-crit-ctc" placeholder="Criteriu nou..." autocomplete="off">
   <button class="btn" data-a="addsab" data-t="ctc">Adaugă</button>
 </div>
 <button class="model-toggle" data-a="togctc" style="display:block;margin:2px 0 8px" title="${ctcExpandat ? "Restrânge" : "Expandează"}">${ctcExpandat ? "− Criterii" : "+ Criterii"}</button>
 ${ctcExpandat ? ctcR.map((x) => row(x, false)).join("") || '<div class="mut">Niciun criteriu.</div>' : ""}
 </div>
 <datalist id="dl-modele"></datalist>
 <datalist id="dl-crit-asamblare">${[
   ...new Set(asmR.map((x) => x.text.trim()).filter(Boolean)),
 ]
   .sort((a, b) => a.localeCompare(b, "ro"))
   .map((t) => `<option value="${esc(t)}">`)
   .join("")}</datalist>
 <datalist id="dl-crit-ctc">${[
   ...new Set(ctcR.map((x) => x.text.trim()).filter(Boolean)),
 ]
   .sort((a, b) => a.localeCompare(b, "ro"))
   .map((t) => `<option value="${esc(t)}">`)
   .join("")}</datalist>
 <div class="mut">Modificările se aplică fișelor deschise ulterior. Rezultatele deja salvate păstrează textul criteriului de la data verificării.</div>`;
        refreshModeleDatalist("");
        $("#btn-imp-crit").onclick = () => $("#file-imp-crit").click();
        $("#file-imp-crit").onchange = (e) =>
          handleImportCriterii(e.target.files[0]);
      }
      let dlModeleT;
      function parseCSVFirstCol(text) {
        return text
          .split(/\r\n|\n|\r/)
          .filter((l) => l.length)
          .map((line) => {
            if (line[0] === '"') {
              let i = 1,
                out = "";
              while (i < line.length) {
                if (line[i] === '"' && line[i + 1] === '"') {
                  out += '"';
                  i += 2;
                } else if (line[i] === '"') {
                  i++;
                  break;
                } else {
                  out += line[i];
                  i++;
                }
              }
              return out.trim();
            }
            const idx = line.indexOf(",");
            return (idx === -1 ? line : line.slice(0, idx)).trim();
          });
      }
      async function parseCriteriiFile(file) {
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        if (ext === "csv") {
          const text = await file.text();
          return parseCSVFirstCol(text).slice(1);
        }
        const buf = await file.arrayBuffer();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        const ws = wb.worksheets[0];
        if (!ws) return [];
        const out = [];
        ws.eachRow((row) => {
          const v = row.getCell(1).value;
          out.push(
            v == null
              ? ""
              : typeof v === "object" && v.text
                ? String(v.text).trim()
                : String(v).trim(),
          );
        });
        return out.slice(1);
      }
      async function handleImportCriterii(file) {
        if (!file) return;
        const model = $("#nm-asamblare").value.trim();
        const fi = $("#file-imp-crit");
        if (!model) {
          if (fi) fi.value = "";
          return toast("Completează modelul pentru acest criteriu.", 1);
        }
        let rows;
        try {
          rows = await parseCriteriiFile(file);
        } catch {
          if (fi) fi.value = "";
          return toast(
            "Fișierul nu a putut fi citit. Salvează-l ca .xlsx sau .csv și încearcă din nou.",
            1,
          );
        }
        if (fi) fi.value = "";
        const texte = [
          ...new Set(rows.map((t) => (t || "").trim()).filter(Boolean)),
        ];
        if (!texte.length)
          return toast("Nu am găsit niciun criteriu în fișier.", 1);
        const mk = modelKey(model);
        const { data: exist } = await sb
          .from("asm_checklist_sabloane")
          .select("text")
          .eq("tip", "asamblare")
          .eq("model_key", mk);
        const existSet = new Set(
          (exist || []).map((x) => x.text.trim().toLowerCase()),
        );
        showImportPreview(model, texte, existSet);
      }
      function showImportPreview(model, texte, existSet) {
        const items = texte.map((t, i) => ({
          i,
          t,
          dup: existSet.has(t.toLowerCase()),
        }));
        const noi = items.filter((x) => !x.dup).length;
        const o = document.createElement("div");
        o.className = "ov";
        o.innerHTML = `<div><div class="row"><h3 style="margin:0">Import criterii — ${esc(model)}</h3><button class="btn gh sm" data-a="close">Închide</button></div>
 <p class="mut">${items.length} criterii găsite în fișier${items.length - noi ? `, ${items.length - noi} deja existente la acest model (marcate, neimportabile)` : ""}.</p>
 <div class="tl" style="max-height:50vh;overflow-y:auto">${items
   .map(
     (x) =>
       `<div><label style="display:flex;align-items:center;gap:8px${x.dup ? ";opacity:.5" : ""}"><input type="checkbox" data-imp-chk data-i="${x.i}" ${x.dup ? "disabled" : "checked"} style="width:auto"><span>${esc(x.t)}${x.dup ? ' <span class="mut">(există deja)</span>' : ""}</span></label></div>`,
   )
   .join("")}</div>
 <div class="foot"><button class="btn gh" data-a="close">Anulează</button><button class="btn" id="btn-conf-imp">Importă (${noi})</button></div></div>`;
        document.body.appendChild(o);
        const updateCount = () => {
          const n = o.querySelectorAll("[data-imp-chk]:checked").length;
          const b = $("#btn-conf-imp");
          b.textContent = `Importă (${n})`;
          b.disabled = !n;
        };
        o.querySelectorAll("[data-imp-chk]").forEach(
          (cb) => (cb.onchange = updateCount),
        );
        $("#btn-conf-imp").onclick = async () => {
          const alese = items
            .filter((x) => !x.dup)
            .filter(
              (x) => o.querySelector(`[data-imp-chk][data-i="${x.i}"]`).checked,
            )
            .map((x) => x.t);
          if (!alese.length) return;
          await confirmaImportCriterii(model, alese);
          o.remove();
        };
      }
      async function confirmaImportCriterii(model, texte) {
        const mk = modelKey(model);
        const { data: ex } = await sb
          .from("asm_checklist_sabloane")
          .select("ordine")
          .eq("tip", "asamblare")
          .eq("model_key", mk);
        let next = Math.max(0, ...(ex || []).map((x) => x.ordine));
        const rows = texte.map((t) => ({
          tip: "asamblare",
          model,
          text: t,
          ordine: ++next,
        }));
        const r = await sb.from("asm_checklist_sabloane").insert(rows);
        if (r.error) return toast(r.error.message, 1);
        ultimulModel = model;
        modeleExpandate.add(mk);
        toast(`${rows.length} criterii importate la modelul „${model}".`);
        go("checklist");
      }
      async function refreshModeleDatalist(q) {
        let data = null;
        try {
          const res = await sb.rpc("asm_modele_antedepozit", { p_q: q });
          data = res.data;
          if (res.error) console.error(res.error);
        } catch (err) {
          console.error(err);
        }
        const dl = $("#dl-modele");
        if (dl)
          dl.innerHTML = (data || [])
            .map((r) => `<option value="${esc(r.model)}">`)
            .join("");
      }
      document.addEventListener("input", (e) => {
        if (
          e.target.getAttribute &&
          e.target.getAttribute("list") === "dl-modele"
        ) {
          clearTimeout(dlModeleT);
          const val = e.target.value;
          dlModeleT = setTimeout(() => refreshModeleDatalist(val), 250);
        }
      });
      function vSet(c) {
        const f = (k, l, ty = "number") =>
          `<div style="margin-bottom:10px"><div class="mut">${l}</div>${ty === "checkbox" ? `<input type="checkbox" style="width:auto" data-c="set" data-f="${k}" ${S[k] ? "checked" : ""}>` : `<input type="number" min="1" data-c="set" data-f="${k}" value="${S[k]}">`}</div>`;
        c.innerHTML = `<div class="card" style="max-width:420px">${f("max_in_lucru", "Produse simultane per utilizator")}${f("prag_alerta_ore", "Alertă produs în lucru (ore)")}${f("poze_obligatorii", "Poză obligatorie la fiecare neregulă", "checkbox")}</div>`;
      }
      boot0();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker înregistrat cu succes!"))
            .catch((err) =>
              console.error("Eroare la înregistrarea Service Worker:", err),
            );
        });
      }
    </script>
  </body>
