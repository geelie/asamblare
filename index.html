      function renderPickProductModal(l, context, onPick) {
        const overlay = document.createElement("div");
        overlay.id = "pick-produs-overlay";
        overlay.className =
          "fixed inset-0 z-50 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        const available = stocDisponibilPentruComenzi(context, l.id).sort(
          (a, b) => {
            const am = produsMatchesLinie(a, l) ? 0 : 1;
            const bm = produsMatchesLinie(b, l) ? 0 : 1;
            return am - bm;
          },
        );

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg fade-in my-auto">
      <h2 class="text-lg font-bold mb-1">Alege produsul din stoc</h2>
      <p class="text-sm text-slate-500 mb-3">Se cere: ${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.model ? " · " + esc(l.model) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</p>
      <input type="text" id="pick-produs-search" class="${inputBase()} mb-3" placeholder="Caută după categorie, marcă, model, culoare, VIN...">
      <div id="pick-produs-list" class="space-y-1.5 max-h-72 overflow-y-auto"></div>
      <button type="button" id="pick-produs-cancel" class="w-full mt-4 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("pick-produs-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const listEl = document.getElementById("pick-produs-list");
        let pickAsmMap = new Map();
        function paint(filterQ) {
          const q = (filterQ || "").trim().toLowerCase();
          const filtered = !q
            ? available
            : available.filter((p) =>
                [p.categorie, p.marca, p.model, p.culoare, p.vin, p.id_produs]
                  .filter(Boolean)
                  .some((v) => v.toLowerCase().includes(q)),
              );
          if (!filtered.length) {
            listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Niciun produs disponibil în stoc.</p>`;
            return;
          }
          listEl.innerHTML = filtered
            .map(
              (p) => `
      <button type="button" data-pick="${p.id}" class="pick-produs-item w-full text-left border rounded-lg px-3 py-2 text-sm hover:bg-slate-50" style="border-color:var(--line)">
        <div class="font-medium">${esc(p.categorie || "—")} · ${esc(p.marca || "—")} · ${esc(p.model || "—")} · ${esc(p.culoare || "—")}</div>
        <div class="text-xs text-slate-400 font-mono">${esc(p.id_produs)}${p.vin ? " · VIN " + esc(p.vin) : ""}</div>
        <div class="text-xs mt-1 flex items-center gap-1.5">C.I.V.: ${p.civ ? '<span class="inline-block px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-100 text-indigo-700">Da</span>' : '<span class="text-slate-400">Nu</span>'} ${asmStadiuBadgeHtml(p.id, pickAsmMap)}</div>
      </button>`,
            )
            .join("");
          listEl.querySelectorAll(".pick-produs-item").forEach((btn) => {
            btn.addEventListener("click", () => {
              const produs = available.find((p) => p.id === btn.dataset.pick);
              overlay.remove();
              onPick(produs);
            });
          });
        }
        paint("");
        document
          .getElementById("pick-produs-search")
          .addEventListener("input", (e) => paint(e.target.value));
        fetchAsmStadiuMap(available.map((p) => p.id)).then((map) => {
          pickAsmMap = map;
          if (document.body.contains(overlay)) {
            paint(document.getElementById("pick-produs-search")?.value || "");
          }
        });
      }

      function comandaLineRow(l, context) {
        const produs = l.produs_id
          ? context.produse.find((p) => p.id === l.produs_id)
          : null;
        const transport =
          l.transport_id && context.transportById
            ? context.transportById.get(l.transport_id)
            : null;

        const canManageStock =
          currentProfile.role === "admin" ||
          currentProfile.role === "superadmin";
        const canManageLines =
          canManageStock || currentProfile.role === "agent";

        const arePeStoc = !produs && !!findMatchingStockProduct(l, context);
        const statusText = arePeStoc
          ? "Pe stoc"
          : lineStatusLabel(l.status_linie);
        const statusCls = arePeStoc
          ? "text-sky-700"
          : l.status_linie === "trimis"
            ? "text-emerald-700"
            : l.status_linie === "realocat"
              ? "text-red-600"
              : l.status_linie === "asignat"
                ? "text-blue-700"
                : "text-amber-700";
        return `
  <div class="border rounded-lg p-2 flex items-center justify-between flex-wrap" style="border-color:var(--line);gap:.25rem .75rem" data-linie="${l.id}">
    <div class="text-sm min-w-0">
      <div class="font-medium flex items-center flex-wrap gap-2">
        <span>${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.model ? " · " + esc(l.model) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</span>
        ${
          produs
            ? `<span class="text-xs text-slate-500 font-normal">C.I.V.: ${produs.civ ? '<span class="text-indigo-700 font-semibold">Da</span>' : '<span class="text-slate-400">Nu</span>'} · Preț: ${produs.pret_cu_tva !== null && produs.pret_cu_tva !== undefined ? fmtNum(produs.pret_cu_tva) + " lei" : "—"}</span>`
            : ""
        }
      </div>
      ${
        produs && l.status_linie === "trimis"
          ? `<div class="text-xs text-emerald-700 mt-0.5">ID produs: ${canManageStock ? `<button type="button" data-edit-produs-line="${l.id}" class="underline decoration-dotted hover:text-[var(--teal-dark)]" title="Deschide și editează datele produsului">${esc(produs.id_produs)}</button>` : esc(produs.id_produs)}${produs.vin ? " · VIN " + esc(produs.vin) : ""}</div>`
          : ""
      }
    </div>
    <div class="flex items-center gap-2">
      <div class="flex flex-col items-end">
        <span class="text-xs font-medium ${statusCls}">${esc(statusText)}</span>
        ${
          l.status_linie === "trimis" && l.data_trimis
            ? `<span class="text-[10px] text-slate-400 leading-tight">${new Date(l.data_trimis).toLocaleDateString("ro-RO")}${transport ? " · " + esc(transport.numar_inmatriculare) : ""}</span>`
            : ""
        }
      </div>
      ${
        l.status_linie === "trimis"
          ? ""
          : `${
              canManageStock
                ? `<button data-link-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border" style="border-color:var(--line)">${produs ? "Schimbă produsul" : "Leagă produs"}</button>
             <button data-newprod-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200">+ Produs nou</button>
             ${
               l.status_linie === "asignat"
                 ? `<button data-unlink-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border text-amber-700" style="border-color:var(--line)">Anulează legătura</button>`
                 : ""
             }`
                : ""
            }
             ${
               canManageLines
                 ? `<button data-delete-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border text-red-600" style="border-color:var(--line)" title="Șterge acest produs din comandă">Șterge</button>`
                 : ""
             }`
      }
    </div>
  </div>`;
      }

      function bindComandaLineRow(
        l,
        context,
        paintLines,
        overlay,
        agenti,
        lines,
      ) {
        const row = overlay.querySelector(`[data-linie="${l.id}"]`);
        if (!row) return;
        const linkBtn = row.querySelector(`[data-link-line="${l.id}"]`);
        if (linkBtn) {
          linkBtn.addEventListener("click", () => {
            renderPickProductModal(l, context, async (produs) => {
              await supa
                .from("comanda_produse")
                .update({ produs_id: produs.id, status_linie: "asignat" })
                .eq("id", l.id);
              l.produs_id = produs.id;
              l.status_linie = "asignat";
              inregistreazaLog(
                "comanda",
                l.comanda_id,
                "Asignare produs existent",
                `ID produs: ${produs.id_produs}`,
              );
              if (lines) syncComandaStatus(l.comanda_id, lines);
              paintLines();
            });
          });
        }
        const newProdBtn = row.querySelector(`[data-newprod-line="${l.id}"]`);
        if (newProdBtn) {
          newProdBtn.addEventListener("click", () => {
            renderAddProductModal(
              agenti,
              () => {},
              async (produsNou) => {
                await supa
                  .from("comanda_produse")
                  .update({ produs_id: produsNou.id, status_linie: "asignat" })
                  .eq("id", l.id);
                l.produs_id = produsNou.id;
                l.status_linie = "asignat";
                context.produse.push(produsNou);
                inregistreazaLog(
                  "comanda",
                  l.comanda_id,
                  "Asignare produs nou",
                  `ID produs: ${produsNou.id_produs}`,
                );
                if (lines) syncComandaStatus(l.comanda_id, lines);
                paintLines();
              },
              {
                categorie: l.categorie,
                marca: l.marca,
                model: l.model,
                culoare: l.culoare,
              },
              distinctMarci(context.produse),
              distinctModele(context.produse),
            );
          });
        }
        const unlinkBtn = row.querySelector(`[data-unlink-line="${l.id}"]`);
        if (unlinkBtn) {
          unlinkBtn.addEventListener("click", async () => {
            const ok = confirm(
              "Anulezi legătura acestui produs cu comanda? Produsul va reveni la statusul „Neasignat”.",
            );
            if (!ok) return;
            await supa
              .from("comanda_produse")
              .update({ produs_id: null, status_linie: "neasignat" })
              .eq("id", l.id);
            const produsDeslegat = context.produse.find(
              (p) => p.id === l.produs_id,
            );
            inregistreazaLog(
              "comanda",
              l.comanda_id,
              "Deslegare produs din linie",
              produsDeslegat ? `ID produs: ${produsDeslegat.id_produs}` : null,
            );
            l.produs_id = null;
            l.status_linie = "neasignat";
            if (lines) syncComandaStatus(l.comanda_id, lines);
            paintLines();
          });
        }
        const editProdusBtn = row.querySelector(
          `[data-edit-produs-line="${l.id}"]`,
        );
        if (editProdusBtn) {
          editProdusBtn.addEventListener("click", () => {
            const produs = context.produse.find((p) => p.id === l.produs_id);
            if (!produs) return;
            renderEditProductModal(
              produs,
              context.agenti || [],
              context.magazine || [],
              () => paintLines(),
              context.marci || [],
              context.modele || [],
              undefined,
              null,
              false,
            );
          });
        }
        const deleteBtn = row.querySelector(`[data-delete-line="${l.id}"]`);
        if (deleteBtn && lines) {
          deleteBtn.addEventListener("click", async () => {
            const ok = confirm(
              "Ștergi acest produs din comandă? Acțiunea nu poate fi anulată.",
            );
            if (!ok) return;
            await supa.from("comanda_produse").delete().eq("id", l.id);
            inregistreazaLog(
              "comanda",
              l.comanda_id,
              "Ștergere linie din comandă",
              `${l.categorie || "—"}${l.marca ? " · " + l.marca : ""}${l.model ? " · " + l.model : ""}${l.culoare ? " · " + l.culoare : ""}`,
            );
            const idx = lines.findIndex((x) => x.id === l.id);
            if (idx >= 0) lines.splice(idx, 1);
            syncComandaStatus(l.comanda_id, lines);
            paintLines();
          });
        }
      }

        document.body.appendChild(overlay);
        if (c.magazin_id) {

            .from("v_bilant_magazine")

              if (el) el.innerHTML = bilantInfoBoxHtml(bilant);
            });

        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

          (async () => {
            const { data: docsAwb, error: docsAwbErr } = await supa

              .select("*")
              .eq("comanda_id", c.id)
              .order("created_at", { ascending: true });

              listEl.innerHTML = `<span class="text-red-600">Eroare la încărcarea documentelor.</span>`;

            }

          "comanda-detail-log-btn",

          });

          "comanda-achitare-toggle",

        if (achitareToggleBtn) {
          achitareToggleBtn.addEventListener("click", () => {
            const body = document.getElementById("comanda-achitare-body");

        const linesEl = document.getElementById("comanda-lines-detail");

            ? lines.map((l) => comandaLineRow(l, context)).join("")

              l,
              context,
              paintLines,
              overlay,
              context.agenti,
              lines,

                  .from("comanda_produse")
                  .insert({
                    comanda_id: c.id,

                    marca: lineData.marca,

        const btnTrimite = document.getElementById("comanda-trimite");

            const readyLines = lines.filter(
              (l) => l.status_linie === "asignat",

            const msg = document.getElementById("comanda-detail-msg");
            if (!readyLines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Nu există produse pregătite de trimis.";
              return;
            }
            const btn = document.getElementById("comanda-trimite");
            btn.disabled = true;
            btn.textContent = "Se trimite...";

            for (const l of readyLines) {
              const produs = context.produse.find((p) => p.id === l.produs_id);
              if (!produs) continue;
              const payload = {
                magazin_id: c.magazin_id,
                agent: c.agent,
                telefon: m ? m.telefon || null : null,
                adresa_facturare: m ? m.adresa_facturare || null : null,
                vanzare_directa: !!c.vanzare_directa,
                updated_at: new Date().toISOString(),
              };
              if (!produs.data_comenzii) {
                payload.data_comenzii = new Date().toISOString().slice(0, 10);
              }
              await supa.from("produse").update(payload).eq("id", produs.id);
              const dataTrimis = new Date().toISOString();
              await supa
                .from("comanda_produse")
                .update({ status_linie: "trimis", data_trimis: dataTrimis })
                .eq("id", l.id);
              l.status_linie = "trimis";
              l.data_trimis = dataTrimis;
              Object.assign(produs, payload);
            }

            const newStatus = computeComandaStatus(lines);
            await supa
              .from("comenzi")
              .update({
                status: newStatus,
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);

            toast("Produsele pregătite au fost trimise către magazin.");
            inregistreazaLog(
              "comanda",
              c.id,
              "Trimitere produse către magazin",
              `${readyLines.length} produs${readyLines.length === 1 ? "" : "e"} trimis${readyLines.length === 1 ? "" : "e"}`,
            );
            overlay.remove();
            onSaved();
          });

        const btnAnuleaza = document.getElementById("comanda-anuleaza");
        if (btnAnuleaza)
          btnAnuleaza.addEventListener("click", async () => {
            const ok = confirm(`Anulezi definitiv comanda ${c.numar_comanda}?`);
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                status: "anulata",
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Comanda a fost anulată.");
            inregistreazaLog("comanda", c.id, "Anulare comandă");
            overlay.remove();
            onSaved();
          });

        const btnSterge = document.getElementById("comanda-sterge");
        if (btnSterge) {
          btnSterge.addEventListener("click", async () => {
            const ok1 = confirm(
              `Ești sigur că vrei să ștergi definitiv comanda ${c.numar_comanda}? Această acțiune nu poate fi anulată.`,
            );
            if (!ok1) return;
            const ok2 = confirm(
              "Confirmă din nou: comanda și toate liniile ei vor fi șterse definitiv.",
            );
            if (!ok2) return;
            inregistreazaLog(
              "comanda",
              c.id,
              "Ștergere definitivă",
              `Nr. comandă: ${c.numar_comanda}`,
            );
            await supa.from("comanda_produse").delete().eq("comanda_id", c.id);
            await supa.from("comenzi").delete().eq("id", c.id);
            toast("Comanda a fost ștearsă definitiv.");
            overlay.remove();
            onSaved();
          });
        }

        const btnCereStergere = document.getElementById(
          "comanda-cere-stergere",
        );
        if (btnCereStergere) {
          btnCereStergere.addEventListener("click", async () => {
            const ok = confirm(
              `Soliciți ștergerea comenzii ${c.numar_comanda}? Cererea va fi trimisă spre aprobare unui Super admin.`,
            );
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                stergere_ceruta: true,
                stergere_ceruta_de: currentProfile.nume || currentProfile.email,
                stergere_ceruta_la: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Solicitarea de ștergere a fost trimisă spre aprobare.");
            inregistreazaLog("comanda", c.id, "Solicitare ștergere comandă");
            overlay.remove();
            onSaved();
          });
        }

        let stadiuPlataSelectat = c.stadiu_plata || null;
        const plataBtns = overlay.querySelectorAll(".plata-btn");
        const sumaAchitataWrap = document.getElementById(
          "comanda-suma-achitata-wrap",
        );
        plataBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            stadiuPlataSelectat = btn.dataset.plata;
            plataBtns.forEach((b) =>
              b.classList.toggle("btn-primary", b === btn),
            );
            if (sumaAchitataWrap)
              sumaAchitataWrap.classList.toggle(
                "hidden",
                stadiuPlataSelectat !== "partial",
              );
          });
        });
        const btnSalveazaPlata = document.getElementById(
          "comanda-salveaza-plata",
        );
        if (btnSalveazaPlata) {
          btnSalveazaPlata.addEventListener("click", async () => {
            const plataMsg = document.getElementById("comanda-plata-msg");
            if (!stadiuPlataSelectat) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent =
                "Alege stadiul achitării (integral sau parțial).";
              return;
            }
            const sumaInput = document.getElementById("comanda-suma-achitata");
            const sumaVal =
              sumaInput && sumaInput.value.trim() !== ""
                ? parseFloat(sumaInput.value)
                : null;
            if (
              stadiuPlataSelectat === "partial" &&
              (sumaVal === null || isNaN(sumaVal))
            ) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent = "Completează suma achitată parțial.";
              return;
            }
            const detaliiVal =
              document.getElementById("comanda-detalii-plata").value.trim() ||
              null;
            btnSalveazaPlata.disabled = true;
            btnSalveazaPlata.textContent = "Se salvează...";
            const { error: plataErr } = await supa
              .from("comenzi")
              .update({
                stadiu_plata: stadiuPlataSelectat,
                suma_achitata:
                  stadiuPlataSelectat === "partial" ? sumaVal : null,
                detalii_plata: detaliiVal,
                achitat_integral_la:
                  stadiuPlataSelectat === "integral"
                    ? c.stadiu_plata === "integral"
                      ? c.achitat_integral_la
                      : new Date().toISOString()
                    : null,
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);
            if (plataErr) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent = plataErr.message;
              btnSalveazaPlata.disabled = false;
              btnSalveazaPlata.textContent = "Salvează achitarea";
              return;
            }
            toast("Informațiile de achitare au fost salvate.");
            inregistreazaLog(
              "comanda",
              c.id,
              "Actualizare achitare",
              plataStadiuLabel({
                stadiu_plata: stadiuPlataSelectat,
                suma_achitata: sumaVal,
              }),
            );
            overlay.remove();
            onSaved();
          });
        }
      }

      function renderAddLinieComandaModal(
        marci,
        modele,
        marcaCategorieMap,
        onAdd,
      ) {
        const overlay = document.createElement("div");
        overlay.id = "add-linie-comanda-overlay";
        overlay.className =
          "fixed inset-0 z-50 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";
        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg fade-in my-auto">
      <h2 class="text-lg font-bold mb-3">Adaugă produs în comandă</h2>
      <div id="add-linie-lines" class="space-y-2"></div>
      <div class="flex gap-2 pt-4">
        <button type="button" id="add-linie-cancel" class="flex-1 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
        <button type="button" id="add-linie-save" class="flex-1 btn-primary rounded-lg py-2.5 text-sm">Adaugă</button>
      </div>
      <p id="add-linie-msg" class="text-sm text-center mt-2"></p>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("add-linie-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const editor = renderComandaLinesEditor(
          document.getElementById("add-linie-lines"),
          marci,
          modele,
          marcaCategorieMap,
        );

        document
          .getElementById("add-linie-save")
          .addEventListener("click", async () => {
            const msg = document.getElementById("add-linie-msg");
            const lines = editor.getLines();
            if (!lines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent =
                "Completează cel puțin categoria, marca, modelul sau culoarea.";
              return;
            }
            overlay.remove();

            for (const l of lines) {
              for (let i = 0; i < l.cantitate; i++) {
                await onAdd({
                  categorie: l.categorie,
                  marca: l.marca,
                  model: l.model,
                  culoare: l.culoare,
                  cantitate: 1,
                });
              }
            }
          });
      }

      function renderComandaReadonlyModal(c, lines, profiles, produse) {

        overlay.innerHTML = `

            return `
        <div class="border rounded-lg p-2 flex items-center justify-between flex-wrap" style="border-color:var(--line);gap:.25rem .75rem">
          <div class="text-sm min-w-0">
            <div class="font-medium flex items-center flex-wrap gap-2">

                  : ""
              }
            </div>
            ${
              produs && l.status_linie === "trimis"
                ? `<div class="text-xs text-emerald-700 mt-0.5">ID produs: ${esc(produs.id_produs)}${produs.vin ? " · VIN " + esc(produs.vin) : ""}</div>`
                : ""
            }
          </div>
          <div class="flex flex-col items-end">
            <span class="text-xs font-medium ${l.status_linie === "trimis" ? "text-emerald-700" : l.status_linie === "realocat" ? "text-red-600" : l.status_linie === "asignat" ? "text-blue-700" : "text-amber-700"}">${esc(lineStatusLabel(l.status_linie))}</span>
            ${l.status_linie === "trimis" && l.data_trimis ? `<span class="text-[10px] text-slate-400 leading-tight">${new Date(l.data_trimis).toLocaleDateString("ro-RO")}<span id="linie-transport-${l.id}"></span></span>` : ""}
          </div>
        </div>`;
          })
          .join("")}
      </div>
      </div>

            .then(({ data: bilant }) => {
              const el = document.getElementById("comanda-readonly-bilant");
              if (el) el.innerHTML = bilantInfoBoxHtml(bilant);
            });
        }
        const transportIdsReadonly = [
          ...new Set(lines.map((l) => l.transport_id).filter(Boolean)),
        ];
        if (transportIdsReadonly.length) {
          supa
            .from("transporturi")
            .select("id, numar_inmatriculare")
            .in("id", transportIdsReadonly)
            .then(({ data: transporturiData }) => {
              const map = new Map(
                (transporturiData || []).map((t) => [t.id, t]),
              );
              lines.forEach((l) => {
                if (!l.transport_id) return;
                const t = map.get(l.transport_id);
                const el = document.getElementById(`linie-transport-${l.id}`);
                if (el && t) el.textContent = " · " + t.numar_inmatriculare;

          .getElementById("comanda-readonly-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
      }

      async function renderComenziAdmin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const myGen = renderGen;
        const pageKey = currentTabKey;
        const { from, to } = rangeFor(pageKey);

        let comenziQuery = supa
          .from("comenzi")
          .select("*", { count: "exact" })
          .order("created_at", { ascending: false })
          .range(from, to);
        const orFilterAdmin = buildSearchOrFilter(
          tabSearchTerms[currentTabKey] || "",
          ["numar_comanda"],
        );
        if (orFilterAdmin) comenziQuery = comenziQuery.or(orFilterAdmin);
        if (comenziStatusFilter.length)
          comenziQuery = comenziQuery.in("status", comenziStatusFilter);

      // ============================================================
      // Transporturi — grupare produse de livrat pe camioane/rute
      // ============================================================

      // Dacă un refresh complet al paginii (ex.: refresh realtime) reconstruiește
      // câmpurile de căutare din Transporturi în timp ce utilizatorul scrie,
      // focusul și poziția cursorului sunt readuse în același câmp.
      function salveazaFocusCamp(prefixId) {
        const a = document.activeElement;
        if (!a || !a.id || !a.id.startsWith(prefixId)) return null;
        return { id: a.id, start: a.selectionStart, end: a.selectionEnd };
      }

      function restaureazaFocusCamp(stare) {
        if (!stare) return;
        const el = document.getElementById(stare.id);
        if (!el) return;
        el.focus();
        try {
          el.setSelectionRange(stare.start, stare.end);
        } catch (e) {
          /* ignorat */
        }
      }

      async function fetchLiniiTransportContext(rows) {
        rows = rows || [];
        const comandaIds = [...new Set(rows.map((r) => r.comanda_id))];
        let comenziMap = new Map();
        if (comandaIds.length) {
          const { data: comenziData } = await supa
            .from("comenzi")
            .select("id, numar_comanda, magazin_id, agent, vanzare_directa")
            .in("id", comandaIds);
          comenziMap = new Map((comenziData || []).map((c) => [c.id, c]));
        }
        const { data: profiles } = await getCached("profiles");
        const profileById = new Map((profiles || []).map((p) => [p.id, p]));
        const produsIds = [
          ...new Set(rows.map((r) => r.produs_id).filter(Boolean)),
        ];
        let produsById = new Map();
        if (produsIds.length) {
          const { data: produseData } = await supa
            .from("produse")
            .select("*")
            .in("id", produsIds);
          produsById = new Map((produseData || []).map((p) => [p.id, p]));
        }
        return rows.map((r) => {
          const c = comenziMap.get(r.comanda_id);
          const magazin =
            c && c.magazin_id ? profileById.get(c.magazin_id) : null;
          const magazinNume =
            c && c.vanzare_directa
              ? "Vânzare directă"
              : magazin
                ? (magazin.nume || magazin.email) +
                  (magazin.filiala ? " - " + magazin.filiala : "")
                : "—";
          const produsAsociat = r.produs_id
            ? produsById.get(r.produs_id)
            : null;
          return {
            ...r,
            numar_comanda: c ? c.numar_comanda : "—",
            magazin_nume: magazinNume,
            produs_asociat: produsAsociat || null,
            id_produs: produsAsociat ? produsAsociat.id_produs : null,
          };
        });
      }

      function grupeazaLiniiPeComanda(linii) {
        const map = new Map();
        linii.forEach((l) => {
          if (!map.has(l.comanda_id))
            map.set(l.comanda_id, {
              numar_comanda: l.numar_comanda,
              magazin_nume: l.magazin_nume,
              linii: [],
            });
          map.get(l.comanda_id).linii.push(l);
        });
        return [...map.values()].sort((a, b) =>
          (a.magazin_nume || "").localeCompare(b.magazin_nume || "", "ro"),
        );
      }

      async function confirmaTransport(transport, linii) {
        const comandaIds = [...new Set(linii.map((l) => l.comanda_id))];
        const { data: comenziData } = await supa
          .from("comenzi")
          .select("id, numar_comanda, magazin_id, agent, vanzare_directa")
          .in("id", comandaIds);
        const comenziMap = new Map((comenziData || []).map((c) => [c.id, c]));

        const magazinIds = [
          ...new Set(
            (comenziData || []).map((c) => c.magazin_id).filter(Boolean),
          ),
        ];
        let profileById = new Map();
        if (magazinIds.length) {
          const { data: profilesData } = await supa
            .from("profiles")
            .select("id, telefon, adresa_facturare")
            .in("id", magazinIds);
          profileById = new Map((profilesData || []).map((p) => [p.id, p]));
        }

        const dataTrimis = new Date().toISOString();
        for (const l of linii) {
          const c = comenziMap.get(l.comanda_id);
          if (!c) continue;
          const m = c.magazin_id ? profileById.get(c.magazin_id) : null;
          if (l.produs_id) {
            const { data: produs } = await supa
              .from("produse")
              .select("id, data_comenzii")
              .eq("id", l.produs_id)
              .maybeSingle();
            const payload = {
              magazin_id: c.magazin_id,
              agent: c.agent,
              telefon: m ? m.telefon || null : null,
              adresa_facturare: m ? m.adresa_facturare || null : null,
              vanzare_directa: !!c.vanzare_directa,
              updated_at: new Date().toISOString(),
            };
            if (produs && !produs.data_comenzii) {
              payload.data_comenzii = new Date().toISOString().slice(0, 10);
            }
            await supa.from("produse").update(payload).eq("id", l.produs_id);
          }
          await supa
            .from("comanda_produse")
            .update({ status_linie: "trimis", data_trimis: dataTrimis })
            .eq("id", l.id);
        }

        for (const comandaId of comandaIds) {
          const { data: toateLiniile } = await supa
            .from("comanda_produse")
            .select("status_linie")
            .eq("comanda_id", comandaId);
          const newStatus = computeComandaStatus(toateLiniile || []);
          await supa
            .from("comenzi")
            .update({ status: newStatus, updated_at: new Date().toISOString() })
            .eq("id", comandaId);
        }

        await supa
          .from("transporturi")
          .update({ status: "plecat", plecat_la: new Date().toISOString() })
          .eq("id", transport.id);

        inregistreazaLog(
          "transport",
          transport.id,
          "Confirmare plecare transport",
          `${transport.numar_inmatriculare}${transport.ruta ? " · " + transport.ruta : ""} · ${linii.length} produs${linii.length === 1 ? "" : "e"} · ${comandaIds.length} comand${comandaIds.length === 1 ? "ă" : "ă"}`,
        );
        toast(`Transportul ${transport.numar_inmatriculare} a fost confirmat.`);
      }

      async function exportTransportExcel(transport, linii) {
        try {
          await ensureExcelJS();
        } catch (e) {
          toast(e.message || "Nu s-a putut încărca modulul Excel.", true);
          return;
        }
        const antete = [
          "Comandă",
          "Magazin",
          "Categorie",
          "Marcă",
          "Model",
          "Culoare",
          "Cantitate",
        ];
        const randuriDate = linii.map((l) => [
          l.numar_comanda || "",
          l.magazin_nume || "",
          l.categorie || "",
          l.marca || "",
          l.model || "",
          l.culoare || "",
          l.cantitate || 1,
        ]);

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Foaie de parcurs");
        ws.addRow([
          `Transport: ${transport.numar_inmatriculare}${transport.ruta ? " · " + transport.ruta : ""}`,
        ]);
        ws.addRow([`Șofer: ${transport.sofer || "—"}`]);
        ws.addRow([`Cazare: ${transport.cazare || "—"}`]);
        ws.addRow([`Data plecării: ${transport.data_plecare}`]);
        ws.addRow([]);
        const toateRandurile = [antete, ...randuriDate];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 45) };
        });
        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRand(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }
        stilizeazaRand(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRand(ws.addRow(r), false));

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Transport_${(transport.numar_inmatriculare || "").replace(/[^a-zA-Z0-9]/g, "")}_${transport.data_plecare}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function renderTransportDetaliu(container, transportId) {

        if (String(transportPickerFiltre.transportId) !== String(transportId)) {

          .select("*")

          .single();
        if (error || !transport) {
          container.innerHTML = `<div class="text-red-600 text-sm">Transportul nu a putut fi încărcat.</div>`;
          return;
        }

        const { data: incarcateRaw } = await supa
          .from("comanda_produse")
          .select(
            "id, comanda_id, produs_id, categorie, marca, model, culoare, cantitate",

          .eq("transport_id", transportId);

        let disponibile = [];
        if (esteEditabil) {
          const { data: dispRaw } = await supa
            .from("comanda_produse")
            .select(
              "id, comanda_id, produs_id, categorie, marca, model, culoare, cantitate",

            .eq("status_linie", "asignat")
            .is("transport_id", null);
          disponibile = await fetchLiniiTransportContext(dispRaw || []);
        }

        const grupIncarcate = grupeazaLiniiPeComanda(incarcate);

        // Filtrare client-side pentru lista "Produse disponibile de încărcat".
        // Se reconstruiește DOAR conținutul listei (nu și câmpurile de căutare),
        // deci cursorul rămâne în câmp după fiecare caracter scris.
        // Selecția bifată se păstrează între filtrări.
        const selectateDisp = new Set();

        function potrivesteTokeni(text, filtru) {
          const tokeni = stripDiacritice(filtru).split(/\s+/).filter(Boolean);
          if (!tokeni.length) return true;
          const t = stripDiacritice(text);
          return tokeni.every((tk) => t.includes(tk));
        }

        function disponibileFiltrate() {
          const f = transportPickerFiltre;
          const vinCautat = stripDiacritice(f.vin).replace(/\s+/g, "");
          return disponibile.filter(
            (l) =>
              potrivesteTokeni(l.magazin_nume, f.magazin) &&
              potrivesteTokeni(l.model, f.model) &&
              stripDiacritice(
                l.produs_asociat && l.produs_asociat.vin,
              ).includes(vinCautat),
          );
        }

        function listaDisponibileHtml() {
          const filtrate = disponibileFiltrate();
          if (disponibile.length && !filtrate.length)

      function transportFiltreImplicite() {

          start: dataLocalaISO(oLunaInUrma),
          end: dataLocalaISO(azi),

      function aplicaFiltreTransport(q, filtre) {
        if (filtre.start) q = q.gte("data_plecare", filtre.start);
        if (filtre.end) q = q.lte("data_plecare", filtre.end);
        if (filtre.numar.trim())
          q = q.ilike("numar_inmatriculare", `%${ilikeEscape(filtre.numar)}%`);
        if ((filtre.sofer || "").trim())
          q = q.ilike("sofer", `%${ilikeEscape(filtre.sofer)}%`);
        if (filtre.ruta.trim())

      async function exportListaTransporturiExcel(
        transporturi,
        countByTransport,
      ) {
        try {
          await ensureExcelJS();
        } catch (e) {
          toast(e.message || "Nu s-a putut încărca modulul Excel.", true);
          return;
        }
        const antete = [
          "Nr. înmatriculare",
          "Șofer",
          "Cazare",
          "Rută",
          "Data plecării",
          "Status",
          "Produse",
        ];
        const randuriDate = transporturi.map((t) => [
          t.numar_inmatriculare || "",
          t.sofer || "",
          t.cazare || "",
          t.ruta || "",
          t.data_plecare || "",
          t.status === "plecat" ? "Plecat" : "Planificat",
          countByTransport.get(t.id) || 0,
        ]);

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Transporturi");
        const toateRandurile = [antete, ...randuriDate];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 45) };
        });
        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRand(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }
        stilizeazaRand(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRand(ws.addRow(r), false));

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Transporturi_${astaziISO()}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function grupeazaIstoricPlati(randuri) {
        const map = new Map();
        randuri.forEach((r) => {
          if (!map.has(r.plata_id)) {
            map.set(r.plata_id, {
              plata_id: r.plata_id,
              data_plata: r.data_plata,
              suma_totala: Number(r.suma_totala) || 0,
              detalii: r.detalii,
              creat_de_nume: r.creat_de_nume,
              sold_inainte:
                r.sold_neachitat_inainte !== null &&
                r.sold_neachitat_inainte !== undefined
                  ? Number(r.sold_neachitat_inainte)
                  : null,
              sold_dupa:
                r.sold_neachitat_dupa !== null &&
                r.sold_neachitat_dupa !== undefined
                  ? Number(r.sold_neachitat_dupa)
                  : null,
              alocari: [],
            });
          }
          if (r.comanda_id) {
            map.get(r.plata_id).alocari.push({
              comanda_id: r.comanda_id,
              numar_comanda: r.numar_comanda,
              suma_alocata: Number(r.suma_alocata) || 0,
              stadiu_rezultat: r.stadiu_rezultat,
            });
          }
        });
        return Array.from(map.values()).sort((a, b) =>
          (b.data_plata || "").localeCompare(a.data_plata || ""),
        );
      }

      async function exportIstoricPlatiExcel(
        magazinNume,
        magazinFiliala,
        plati,
      ) {
        try {
          await ensureExcelJS();
        } catch (e) {
          toast(e.message || "Nu s-a putut încărca modulul Excel.", true);
          return;
        }
        const antete = [
          "Magazin/HUB",
          "Filiala",
          "Data plății",
          "Efectuată de",
          "Sumă totală plătită",
          "Detalii de plată",
          "Sold neachitat înainte",
          "Sold neachitat după",
          "Nr. comandă",
          "Sumă alocată",
          "Stadiu rezultat",
        ];
        const randuriDate = [];
        plati.forEach((p) => {
          const dataPlata = new Date(p.data_plata).toLocaleString("ro-RO");
          const soldInainte =
            p.sold_inainte !== null ? Number(p.sold_inainte) : "";
          const soldDupa = p.sold_dupa !== null ? Number(p.sold_dupa) : "";
          if (!p.alocari.length) {
            randuriDate.push([
              magazinNume || "",
              magazinFiliala || "",
              dataPlata,
              p.creat_de_nume || "",
              Number(p.suma_totala || 0),
              p.detalii || "",
              soldInainte,
              soldDupa,
              "",
              "",
              "",
            ]);
          } else {
            p.alocari.forEach((a) => {
              randuriDate.push([
                magazinNume || "",
                magazinFiliala || "",
                dataPlata,
                p.creat_de_nume || "",
                Number(p.suma_totala || 0),
                p.detalii || "",
                soldInainte,
                soldDupa,
                a.numar_comanda || "",
                Number(a.suma_alocata || 0),
                a.stadiu_rezultat === "integral"
                  ? "Achitat integral"
                  : "Achitat parțial",
              ]);
            });
          }
        });

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Istoric plăți");
        const toateRandurile = [antete, ...randuriDate];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 45) };
        });
        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRand(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }
        stilizeazaRand(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRand(ws.addRow(r), false));

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Istoric_plati_${(magazinNume || "magazin").replace(/[^\w-]+/g, "_")}_${new Date().toISOString().slice(0, 10)}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function loadStocMagazinPagina(magazinId, pageKey, doarNevandute) {
        const { from, to } = rangeFor(pageKey);
        let q = supa
          .from("produse")
          .select("*", { count: "exact" })
          .eq("magazin_id", magazinId)
          .order("updated_at", { ascending: false })
          .range(from, to);
        if (doarNevandute) q = q.eq("vandut", false);
        const { data: produse, error, count } = await q;
        if (error) return { error };

        const produsIds = (produse || []).map((p) => p.id);
        const { data: liniiProduse, error: liniiProduseErr } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("*")
              .in("produs_id", produsIds)
              .eq("status_linie", "trimis")
          : { data: [] };
        if (liniiProduseErr) return { error: liniiProduseErr };
        const comandaIds = Array.from(
          new Set(
            (liniiProduse || []).map((l) => l.comanda_id).filter(Boolean),
          ),
        );
        const [
          { data: linii, error: liniiErr },
          { data: comenzi, error: comErr },
        ] = comandaIds.length
          ? await Promise.all([
              supa
                .from("comanda_produse")
                .select("*")
                .in("comanda_id", comandaIds),
              supa.from("comenzi").select("*").in("id", comandaIds),
            ])
          : [{ data: [] }, { data: [] }];
        if (liniiErr) return { error: liniiErr };
        if (comErr) return { error: comErr };
        const produsComandaMap = buildProdusComandaMap(liniiProduse, comenzi);
        return {
          error: null,
          produse: produse || [],
          count: count || 0,
          produsComandaMap,
          linii: linii || [],
        };
      }

      function sorteazaMagazineAlfabetic(magazine) {
        return [...(magazine || [])].sort((a, b) => {
          const numeA = (a.nume || a.email || "").toLowerCase();
          const numeB = (b.nume || b.email || "").toLowerCase();
          const cmpNume = numeA.localeCompare(numeB, "ro");
          if (cmpNume !== 0) return cmpNume;
          const filialaA = (a.filiala || "").toLowerCase();
          const filialaB = (b.filiala || "").toLowerCase();
          return filialaA.localeCompare(filialaB, "ro");
        });
      }

          (profiles || []).filter((p) => magazinIds.includes(p.id)),
        );
        if (!magazine.length) {
          container.innerHTML = `<div class="bg-white rounded-xl border p-10 text-center" style="border-color:var(--line)"><p class="text-slate-400 text-sm">Niciun magazin alocat.</p></div>`;
          return;
        }

        const termenCautare = tabSearchTerms[currentTabKey] || "";

        if (termenCautare) {
          const { data: produse, error: prodErr } = await (() => {
            let q = supa
              .from("produse")
              .select("*")
              .in("magazin_id", magazinIds)
              .eq("vandut", false)
              .order("updated_at", { ascending: false });
            const orFilter = buildSearchOrFilter(termenCautare, [
              "id_produs",
              "categorie",
              "marca",
              "model",
              "culoare",
              "vin",
            ]);
            return orFilter ? q.or(orFilter) : q;
          })();
          if (isStaleRender(myGen)) return;
          if (prodErr) {
            container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(prodErr.message)}</div>`;
            return;
          }

          const produsIds = (produse || []).map((p) => p.id);
          const { data: liniiProduse, error: liniiProduseErr } =
            produsIds.length
              ? await supa
                  .from("comanda_produse")
                  .select("*")
                  .in("produs_id", produsIds)
                  .eq("status_linie", "trimis")
              : { data: [] };
          if (isStaleRender(myGen)) return;
          if (liniiProduseErr) {
            container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(liniiProduseErr.message)}</div>`;
            return;
          }
          const comandaIds = Array.from(
            new Set(
              (liniiProduse || []).map((l) => l.comanda_id).filter(Boolean),
            ),
          );
          const [
            { data: linii, error: liniiErr },
            { data: comenzi, error: comErr },
          ] = comandaIds.length
            ? await Promise.all([
                supa
                  .from("comanda_produse")
                  .select("*")
                  .in("comanda_id", comandaIds),
                supa.from("comenzi").select("*").in("id", comandaIds),
              ])
            : [{ data: [] }, { data: [] }];
          if (isStaleRender(myGen)) return;
          const produsComandaMap = buildProdusComandaMap(
            liniiErr ? [] : liniiProduse,
            comErr ? [] : comenzi,
          );

          container.innerHTML = magazine
            .map((m) => {
              const stocMagazin = (produse || []).filter(
                (p) => p.magazin_id === m.id,
              );
              const label = `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`;
              return `
      <div class="mb-6">
        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2 cursor-pointer select-none" data-toggle-stoc="${m.id}">
          <span class="stoc-toggle-icon inline-flex items-center justify-center w-5 h-5 rounded-full border text-xs font-bold leading-none" style="border-color:var(--line)">+</span>
          <span>${esc(label)} <span class="text-slate-400 font-normal">(${stocMagazin.length} produse)</span></span>
        </h3>
        <div class="bg-white rounded-xl border tabel-fix-wrap tabel-fix-wrap-nested hidden" data-stoc-panel="${m.id}" style="border-color:var(--line)">
          ${stocMagazinTableHtml(stocMagazin, produsComandaMap, false)}
        </div>
      </div>`;
            })
            .join("");

          bindStocMagazinComandaLinks(
            container,
            produse,
            produsComandaMap,
            linii,
            profiles,
          );
          container.querySelectorAll("[data-toggle-stoc]").forEach((h) => {
            h.addEventListener("click", () => {
              const id = h.dataset.toggleStoc;
              const panel = container.querySelector(
                `[data-stoc-panel="${id}"]`,
              );
              const icon = h.querySelector(".stoc-toggle-icon");
              if (!panel) return;
              const isHidden = panel.classList.toggle("hidden");
              if (icon) icon.textContent = isHidden ? "+" : "-";
            });
          });
          return;
        }

        const numaratori = await Promise.all(
          magazinIds.map((id) =>
            supa
              .from("produse")
              .select("id", { count: "exact", head: true })
              .eq("magazin_id", id)
              .eq("vandut", false),
          ),
        );
        if (isStaleRender(myGen)) return;
        const countMap = new Map();
        magazinIds.forEach((id, idx) => {
          countMap.set(id, numaratori[idx].count || 0);
        });

        container.innerHTML = magazine
          .map((m) => {
            const label = `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`;
            return `
      <div class="mb-6">
        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2 cursor-pointer select-none" data-toggle-stoc="${m.id}">
          <span class="stoc-toggle-icon inline-flex items-center justify-center w-5 h-5 rounded-full border text-xs font-bold leading-none" style="border-color:var(--line)">+</span>
          <span>${esc(label)} <span class="text-slate-400 font-normal">(${countMap.get(m.id) || 0} produse)</span></span>
        </h3>
        <div class="bg-white rounded-xl border tabel-fix-wrap tabel-fix-wrap-nested hidden" data-stoc-panel="${m.id}" style="border-color:var(--line)"></div>
      </div>`;
          })
          .join("");

        magazine.forEach((m) => {
          const header = container.querySelector(
            `[data-toggle-stoc="${m.id}"]`,
          );
          const panel = container.querySelector(`[data-stoc-panel="${m.id}"]`);
          const icon = header.querySelector(".stoc-toggle-icon");
          const pageKey = `${currentTabKey}:${m.id}`;
          let loaded = false;

          async function incarcaSiRandeaza() {
            panel.innerHTML = `<div class="p-4 text-sm text-slate-400">Se încarcă...</div>`;
            const d = await loadStocMagazinPagina(m.id, pageKey, true);
            if (d.error) {
              panel.innerHTML = `<div class="p-4 text-red-600 text-sm">Eroare: ${esc(d.error.message)}</div>`;
              return;
            }
            panel.innerHTML =
              stocMagazinTableHtml(d.produse, d.produsComandaMap, false) +
              paginationBarHtml(pageKey, d.count);
            bindStocMagazinComandaLinks(
              panel,
              d.produse,
              d.produsComandaMap,
              d.linii,
              profiles,
            );
            bindPaginationBar(panel, pageKey, incarcaSiRandeaza);
            loaded = true;
          }

          header.addEventListener("click", async () => {
            const isHidden = panel.classList.toggle("hidden");
            icon.textContent = isHidden ? "+" : "-";
            if (!isHidden && !loaded) await incarcaSiRandeaza();
          });
        });
      }

      function bindUserRow(
        p,
        magazine,
        viewerIsSuperadmin,
        assignments,
        hubAssignments,
        allProfiles,
      ) {
        const row = document.querySelector(`tr[data-row="${p.id}"]`);
        if (!row) return;

        const roleSelect = row.querySelector(".role-select");
        const numeInput = row.querySelector(".nume-input");
        const telefonInput = row.querySelector(".telefon-input");
        const filialaInput = row.querySelector(".filiala-input");
        const magBtn = row.querySelector(".magazine-alocate-btn");
        const magPlaceholder = row.querySelector(".magazine-none-placeholder");
        const deleteBtn = row.querySelector(".delete-btn");
        const billingBtn = row.querySelector(".billing-btn");

        const isHub = p.role === "magazin_hub";
        const relAssignments = isHub ? hubAssignments || [] : assignments || [];
        const relIdField = isHub ? "hub_id" : "agent_id";
        const assignedIds = relAssignments
          .filter((a) => a[relIdField] === p.id)
          .map((a) => a.magazin_id);

        if (magBtn) {
          magBtn._selectedIds = new Set(assignedIds);
          magBtn.addEventListener("click", () => {
            openMagazineAlocateModal(
              p,
              magazine,
              magBtn,
              relAssignments,
              relIdField,
              allProfiles,
              isHub,
            );
          });
        }

        if (billingBtn) {
          billingBtn.addEventListener("click", () => {
            renderBillingAddressModal(p, billingBtn);
          });
        }

        if (deleteBtn && !deleteBtn.disabled) {
          deleteBtn.addEventListener("click", async () => {
            const lockedForViewer =
              p.role === "superadmin" && !viewerIsSuperadmin;
            if (lockedForViewer) {
              toast(
                "Doar un super admin poate șterge un cont de super admin.",
                true,
              );
              return;
            }
            const ok = confirm(
              `Ștergi definitiv contul ${p.email}? Acțiunea nu poate fi anulată.`,
            );
            if (!ok) return;

            deleteBtn.disabled = true;
            deleteBtn.textContent = "Se șterge...";

            inregistreazaLog(
              "profil",
              p.id,
              "Ștergere utilizator",
              `${p.email} (${roleLabelText(p.role)})`,
            );
            const { data, error } = await supa.functions.invoke("delete-user", {
              body: { target_id: p.id },
            });
            const errMsg = error?.message || data?.error;
            if (errMsg) {
              toast("Eroare la ștergere: " + errMsg, true);
              deleteBtn.disabled = false;
              deleteBtn.textContent = "Șterge cont";
              return;
            }
            toast("Cont șters definitiv.");
            row.remove();
          });
        }

        roleSelect.addEventListener("change", () => {
          const role = roleSelect.value;
          numeInput.disabled = !role;
          telefonInput.disabled = !role;
          filialaInput.disabled = role !== "magazin";
          const showMag = role === "agent" || role === "magazin_hub";
          if (magBtn) magBtn.classList.toggle("hidden", !showMag);
          if (magPlaceholder)
            magPlaceholder.classList.toggle("hidden", showMag);
        });

        row.querySelector(".save-btn").addEventListener("click", async () => {
          const btn = row.querySelector(".save-btn");

          if (p.role === "superadmin" && !viewerIsSuperadmin) {
            toast(
              "Doar un super admin poate modifica rolul unui super admin.",
              true,
            );
            return;
          }
          if (roleSelect.value === "superadmin" && !viewerIsSuperadmin) {
            toast(
              "Doar un super admin poate acorda rolul de super admin.",
              true,
            );
            return;
          }

          btn.disabled = true;
          btn.textContent = "Se salvează...";

          const role = roleSelect.value || null;
          const nume = numeInput.value.trim() || null;
          const telefon = telefonInput.value.trim() || null;
          const filiala = filialaInput.value.trim() || null;
          const roleVechi = p.role || null;
          const numeVechi = p.nume || null;
          const telefonVechi = p.telefon || null;
          const filialaVechi = p.filiala || null;

          const { error: upErr } = await supa
            .from("profiles")
            .update({
              role,
              nume,
              telefon,
              filiala,
              updated_at: new Date().toISOString(),
            })
            .eq("id", p.id);

          if (upErr) {
            toast("Eroare: " + upErr.message, true);
            btn.disabled = false;
            btn.textContent = "Salvează";
            return;
          }

          if (roleVechi !== role) {
            inregistreazaLog(
              "profil",
              p.id,
              "Schimbare rol",
              `${p.email}: ${roleVechi ? roleLabelText(roleVechi) : "Fără rol"} → ${role ? roleLabelText(role) : "Fără rol"}`,
            );
          }
          if (numeVechi !== nume) {
            inregistreazaLog(
              "profil",
              p.id,
              "Schimbare nume",
              `${p.email}: "${numeVechi || "—"}" → "${nume || "—"}"`,
            );
          }
          if (telefonVechi !== telefon) {
            inregistreazaLog(
              "profil",
              p.id,
              "Schimbare telefon",
              `${p.email}: "${telefonVechi || "—"}" → "${telefon || "—"}"`,
            );
          }
          if (filialaVechi !== filiala) {
            inregistreazaLog(
              "profil",
              p.id,
              "Schimbare filială",
              `${p.email}: "${filialaVechi || "—"}" → "${filiala || "—"}"`,
            );
          }

          const checkedMagazine = magBtn
            ? Array.from(magBtn._selectedIds || [])
            : [];

          function labelMagazinPentruLog(magId) {
            const m = (allProfiles || []).find((ap) => ap.id === magId);
            return m ? m.nume || m.email : magId;
          }
          function logRealocareMagazine(idsVechi, idsNoi) {
            const adaugate = idsNoi.filter((id) => !idsVechi.includes(id));
            const eliminate = idsVechi.filter((id) => !idsNoi.includes(id));
            if (adaugate.length) {
              inregistreazaLog(
                "profil",
                p.id,
                "Alocare magazine",
                `${p.email}: + ${adaugate.map(labelMagazinPentruLog).join(", ")}`,
              );
            }
            if (eliminate.length) {
              inregistreazaLog(
                "profil",
                p.id,
                "Dealocare magazine",
                `${p.email}: − ${eliminate.map(labelMagazinPentruLog).join(", ")}`,
              );
            }
          }

          if (role === "agent") {
            logRealocareMagazine(assignedIds, checkedMagazine);
            await supa.from("agent_magazine").delete().eq("agent_id", p.id);
            if (checkedMagazine.length) {
              const rows = checkedMagazine.map((magId) => ({
                agent_id: p.id,
                magazin_id: magId,
              }));
              const { error: linkErr } = await supa
                .from("agent_magazine")
                .insert(rows);

      const ZILE_CICLU_BATERIE = 15;

      // Formatează un obiect Date ca YYYY-MM-DD folosind componentele LOCALE
      // (an/lună/zi), nu UTC — spre deosebire de toISOString(), care ar
      // deplasa data cu o zi în fusuri orare cu decalaj pozitiv față de UTC
      // (ex. România, UTC+2 vara) atunci când ora locală e aproape de miezul nopții.
      function formatDataZLA(iso) {
        if (!iso) return "";
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
        if (!m) return "";
        return `${m[3]}.${m[2]}.${m[1]}`;
      }

      function parseDataZLA(str) {
        if (!str) return "";
        const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(str).trim());
        if (!m) return "";
        const [, zi, luna, an] = m;
        const d = new Date(`${an}-${luna}-${zi}T00:00:00`);
        if (
          isNaN(d.getTime()) ||
          d.getFullYear() !== Number(an) ||
          d.getMonth() + 1 !== Number(luna) ||
          d.getDate() !== Number(zi)
        )
          return "";
        return `${an}-${luna}-${zi}`;
      }

      function initDataZLAInput(el) {
        if (!el || el.dataset.zlaInit) return;
        el.dataset.zlaInit = "1";
        el.addEventListener("input", () => {
          const digits = el.value.replace(/[^\d]/g, "").slice(0, 8);
          let out = digits;
          if (digits.length > 4)
            out = `${digits.slice(0, 2)}.${digits.slice(2, 4)}.${digits.slice(4)}`;
          else if (digits.length > 2)
            out = `${digits.slice(0, 2)}.${digits.slice(2)}`;
          el.value = out;
        });
      }

      // Atașează, lângă un câmp text ZZ.LL.AAAA, un selector de tip
      // calendar (input nativ type="date", ascuns vizual) + un buton
      // mic cu icon de calendar. Introducerea manuală a datei rămâne
      // exact ca înainte; butonul deschide calendarul nativ, iar
      // alegerea unei date din el completează același câmp text
      // (reformatat ZZ.LL.AAAA) și declanșează evenimentul "change"
      // existent, ca și cum ar fi fost tastată manual.
      function adaugaSelectorCalendarLaFiltru(el) {
        if (!el || el.dataset.calInit) return;
        el.dataset.calInit = "1";
        const wrap = document.createElement("div");
        wrap.className = "relative";
        el.parentNode.insertBefore(wrap, el);
        wrap.appendChild(el);
        el.style.paddingRight = "24px";

        const nativ = document.createElement("input");
        nativ.type = "date";
        nativ.tabIndex = -1;
        nativ.setAttribute("aria-hidden", "true");
        nativ.className = "date-picker-nativ";
        const isoInitial = parseDataZLA(el.value);
        if (isoInitial) nativ.value = isoInitial;
        wrap.appendChild(nativ);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.tabIndex = -1;
        btn.className = "date-picker-btn";
        btn.setAttribute("aria-label", "Alege data din calendar");
        btn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>';
        wrap.appendChild(btn);

        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const isoActual = parseDataZLA(el.value);
          if (isoActual) nativ.value = isoActual;
          if (typeof nativ.showPicker === "function") {
            try {
              nativ.showPicker();
            } catch (err) {
              nativ.focus();
            }
          } else {
            nativ.focus();
          }
        });
        nativ.addEventListener("change", () => {
          if (!nativ.value) return;
          el.value = formatDataZLA(nativ.value);
          el.dispatchEvent(new Event("change", { bubbles: true }));
        });
      }

      function dataLocalaISO(d) {
        const an = d.getFullYear();
        const luna = String(d.getMonth() + 1).padStart(2, "0");
        const zi = String(d.getDate()).padStart(2, "0");
        return `${an}-${luna}-${zi}`;
      }

      function adaugaZileData(dataISO, zile) {
        const d = new Date(dataISO + "T00:00:00");
        d.setDate(d.getDate() + zile);
        return dataLocalaISO(d);
      }

      function astaziISO() {
        return dataLocalaISO(new Date());
      }

      function diferentaZile(dataA, dataB) {
        const a = new Date(dataA + "T00:00:00");
        const b = new Date(dataB + "T00:00:00");
        return Math.round((a - b) / 86400000);
      }

      function calculeazaCicluriBaterie(
        produs,
        toateIncarcarile,
        dataReferinta,
      ) {
        if (!produs.magazin_id || !produs.data_comenzii) return null;

        const ancoraStart = produs.data_comenzii.slice(0, 10);
        const incarcariProdus = (toateIncarcarile || [])
          .filter(
            (i) => i.produs_id === produs.id && i.data_incarcare >= ancoraStart,
          )
          .sort((a, b) => a.data_incarcare.localeCompare(b.data_incarcare));

        const cicluri = [];
        let ancoraCurenta = ancoraStart;
        incarcariProdus.forEach((inc) => {
          const termen = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
          const status = inc.data_incarcare <= termen ? "verde" : "rosu";
          cicluri.push({ ...inc, ancora: ancoraCurenta, termen, status });
          ancoraCurenta = inc.data_incarcare;
        });

        const termenCurent = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
        const zileDiff = diferentaZile(
          termenCurent,
          dataReferinta || astaziISO(),
        );
        const statusCurent = zileDiff >= 0 ? "verde" : "rosu";

        return {
          ancoraStart,
          cicluri,
          ancoraCurenta,
          termenCurent,
          statusCurent,
          zileDiff,
        };
      }

      function bateriiStatusBadge(statusCurent, zileDiff) {
        if (statusCurent === "rosu") {
          const zz = Math.abs(zileDiff);
          return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-600">🔴 Depășit cu ${zz} zi${zz === 1 ? "" : "le"}</span>`;
        }
        if (statusCurent === "verde" && zileDiff === 0) {
          return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-orange-50 text-orange-600">🟠 Expiră azi (0 zile rămase)</span>`;
        }
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700">🟢 În termen (${zileDiff} zi${zileDiff === 1 ? "" : "le"} rămase)</span>`;
      }

      function rezumatBaterii(produse, incarcari, dataReferinta) {
        let inTermen = 0;
        let depasite = 0;
        let ultimaZi = 0;
        (produse || []).forEach((p) => {
          const c = calculeazaCicluriBaterie(p, incarcari, dataReferinta);
          if (!c) return;
          if (c.statusCurent === "rosu") depasite++;
          else if (c.statusCurent === "verde" && c.zileDiff === 0) ultimaZi++;
          else inTermen++;
        });
        return {
          inTermen,
          depasite,
          ultimaZi,
          total: inTermen + depasite + ultimaZi,
        };
      }

      function bateriiRezumatBar(produse, incarcari, filtruActiv) {
        const { inTermen, depasite, ultimaZi, total } = rezumatBaterii(
          produse,
          incarcari,
        );
        const activ = filtruActiv || "toate";
        return `
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <button type="button" data-baterii-filtru="toate" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white border transition-shadow ${activ === "toate" ? "ring-2 ring-slate-800" : ""}" style="border-color:var(--line)">
        📦 ${total} produs${total === 1 ? "" : "e"} de urmărit
      </button>
      <button type="button" data-baterii-filtru="termen" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 border border-transparent transition-shadow ${activ === "termen" ? "ring-2 ring-emerald-600" : ""}">
        🟢 ${inTermen} în termen
      </button>
      <button type="button" data-baterii-filtru="azi" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border border-transparent transition-shadow ${ultimaZi > 0 ? "bg-orange-50 text-orange-600" : "bg-slate-50 text-slate-400"} ${activ === "azi" ? "ring-2" : ""}"${activ === "azi" ? ' style="--tw-ring-color:#ea580c"' : ""}>
        🟠 ${ultimaZi} expiră azi
      </button>
      <button type="button" data-baterii-filtru="depasit" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border border-transparent transition-shadow ${depasite > 0 ? "bg-red-50 text-red-600" : "bg-slate-50 text-slate-400"} ${activ === "depasit" ? "ring-2 ring-red-600" : ""}">
        🔴 ${depasite} cu termen depășit
      </button>
    </div>`;
      }

      function filtreazaProduseBaterii(produse, incarcari, filtru) {
        if (filtru === "termen") {
          return (produse || []).filter((p) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            return c && c.statusCurent === "verde" && c.zileDiff !== 0;
          });
        }
        if (filtru === "azi") {
          return (produse || []).filter((p) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            return c && c.statusCurent === "verde" && c.zileDiff === 0;
          });
        }
        if (filtru === "depasit") {
          return (produse || []).filter((p) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            return c && c.statusCurent === "rosu";
          });
        }
        return produse || [];
      }

      const BUCKET_AWB = "documente-awb";

      async function incarcaDocumentAwb(comandaId, file, index) {
        const extensie = (file.name.split(".").pop() || "bin").toLowerCase();
        const path = `${comandaId}/awb_${Date.now()}_${index}.${extensie}`;
        const { error } = await supa.storage
          .from(BUCKET_AWB)
          .upload(path, file, { upsert: true, contentType: file.type });
        if (error) throw error;
        return path;
      }

      async function obtineUrlSemnatAwb(path) {
        const { data, error } = await supa.storage
          .from(BUCKET_AWB)
          .createSignedUrl(path, 300);
        if (error) throw error;
        return data.signedUrl;
      }

      async function incarcaDocumenteAwbComanda(comandaId, files) {
        for (let i = 0; i < files.length; i++) {
          const path = await incarcaDocumentAwb(comandaId, files[i], i);
          const { error } = await supa.from("comanda_documente_awb").insert({
            comanda_id: comandaId,
            path,
            nume_fisier: files[i].name,
            incarcat_de: currentUser.id,
          });
          if (error) throw error;
        }
      }

      function awbDocumentLinkHtml(doc) {
        const label = doc.nume_fisier || "Document AWB";
        return `<a href="#" data-awb-doc-path="${esc(doc.path)}" data-awb-doc-label="${esc(label)}" class="inline-flex items-center gap-1 px-2 py-1 rounded-md border text-xs text-[var(--teal-dark)] underline decoration-dotted hover:bg-slate-50" style="border-color:var(--line)">${esc(label)}</a>`;
      }

      function bindDeschideDocumenteAwb(container) {
        container.querySelectorAll("[data-awb-doc-path]").forEach((link) => {
          link.addEventListener("click", async (e) => {
            e.preventDefault();
            const path = link.getAttribute("data-awb-doc-path");
            const label = link.getAttribute("data-awb-doc-label");
            link.textContent = "Se deschide...";
            try {
              const url = await obtineUrlSemnatAwb(path);
              window.open(url, "_blank");
            } catch (err) {
              toast(
                "Eroare la deschiderea documentului AWB: " + err.message,
                true,
              );
            } finally {
              link.textContent = label;
            }
          });
        });
      }
