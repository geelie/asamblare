<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#161b22" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asamblare</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Conexiuni timpurii către CDN și fonturi -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="logo.webp" as="image" type="image/webp" />

    <!-- Necesar la pornire. jsPDF și ExcelJS se încarcă doar la export. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* Design tokens preluate din aplicația de distribuții */
      :root {
        --graphite: #161b22;
        --graphite-2: #20272f;
        --teal: #0fbf9f;
        --teal-dark: #0b9b82;
        --amber: #f0a93b;
        --bg: #f5f7f8;
        --line: #e3e7e9;
        --card: #fff;
        --ink: #1e293b;
        --mut: #64748b;
        --gr: #161b22;
        --tb: #d9f5ee;
        --ok: #0b8a5f;
        --okb: #eaf7f0;
        --no: #b91c1c;
        --nob: #fee2e2;
        --wa: #b4650b;
        --wab: #fff1de;
        --bl: #1d6fa5;
        --blb: #e6f4ff;
        --sl: #64748b;
        --slb: #f1f2f4;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        --r: 16px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
      }
      h1,
      h2,
      h3,
      h4,
      .brand {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
      }
      h3 {
        font-size: 16px;
      }
      h4 {
        font-size: 14px;
      }
      button {
        font-family: inherit;
        touch-action: manipulation;
      }
      a {
        color: var(--teal-dark);
      }
      /* antet + navigare */
      header {
        background: var(--graphite);
        color: #fff;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
        padding-right: calc(16px + env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      header b {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
        font-size: 17px;
      }
      header small {
        color: #94a3b8;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
      }
      nav {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 max(16px, calc((100% - 980px) / 2 + 16px));
      }
      nav::-webkit-scrollbar {
        display: none;
      }
      nav button {
        flex: 0 0 auto;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        color: #6b7280;
        padding: 14px 16px;
        min-height: 48px;
        font:
          600 14px Inter,
          system-ui,
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      nav button:hover {
        color: #111827;
      }
      nav button.on {
        background: transparent;
        border-color: var(--teal);
        color: #111827;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }
      /* carduri */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .crit-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 5px;
        margin-bottom: 3px;
      }
      .crit-row input[type="number"] {
        width: 38px;
        flex: 0 0 auto;
        padding: 3px 5px;
        min-height: 28px;
        font-size: 12.5px;
        text-align: center;
      }
      .crit-row input[data-f="model"] {
        width: 78px;
        flex: 0 0 auto;
        padding: 3px 6px;
        min-height: 28px;
        font-size: 12.5px;
      }
      .crit-row input[data-f="text"] {
        flex: 1 1 auto;
        min-width: 50px;
        padding: 3px 8px;
        min-height: 28px;
        font-size: 12.5px;
      }
      .crit-row label {
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--mut);
        flex: 0 0 auto;
      }
      .crit-row label input[type="checkbox"] {
        width: 15px !important;
        height: 15px;
      }
      .crit-row button.btn {
        padding: 3px 7px;
        min-height: 28px;
        font-size: 12px;
        flex: 0 0 auto;
      }
      .add-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .add-row input {
        padding: 6px 10px;
        min-height: 32px;
        font-size: 13px;
      }
      .add-row input#nm-asamblare {
        width: 110px;
        flex: 0 0 auto;
      }
      .add-row input#ns-asamblare,
      .add-row input#ns-ctc {
        flex: 1 1 auto;
        min-width: 60px;
      }
      .add-row button.btn {
        padding: 6px 12px;
        min-height: 32px;
        font-size: 13px;
        flex: 0 0 auto;
      }
      .model-toggle {
        border: 0;
        background: transparent;
        color: var(--mut);
        cursor: pointer;
        font:
          800 15px Manrope,
          system-ui,
          sans-serif;
        padding: 0 6px 0 0;
        line-height: 1;
      }
      .model-toggle:hover {
        color: var(--ink);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      /* câmpuri */
      input,
      textarea,
      select {
        border: 1px solid #d5dbe0;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
        width: 100%;
        min-height: 42px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: transparent;
        box-shadow: 0 0 0 2px var(--teal);
      }
      textarea {
        min-height: 64px;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: #9ca3af;
      }
      input[type="checkbox"] {
        width: 20px !important;
        height: 20px;
        min-height: 0;
        accent-color: var(--teal-dark);
        vertical-align: middle;
      }
      /* butoane */
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        min-height: 44px;
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        background: var(--teal);
        color: #0a1210;
        transition: background-color 0.12s ease;
      }
      .btn:hover {
        background: var(--teal-dark);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.red {
        background: var(--no);
        color: #fff;
      }
      .btn.red:hover {
        background: #991b1b;
      }
      .btn.gh {
        background: #fff;
        color: var(--ink);
        border: 1px solid #d5dbe0;
      }
      .btn.gh:hover {
        background: #f8fafb;
      }
      .btn.sm {
        padding: 6px 12px;
        min-height: 36px;
        font-size: 13px;
      }
      /* etichete stadiu */
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .p-in_asamblare {
        background: var(--wab);
        color: var(--wa);
      }
      .p-in_remediere {
        background: var(--nob);
        color: var(--no);
      }
      .p-asteapta_ctc {
        background: var(--slb);
        color: var(--sl);
      }
      .p-in_ctc {
        background: var(--blb);
        color: var(--bl);
      }
      .p-ctc_avizat {
        background: var(--okb);
        color: var(--ok);
      }
      /* fișă */
      .timer {
        font:
          700 24px Manrope,
          ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--teal-dark);
      }
      .crit {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .crit.nok {
        border-color: var(--no);
      }
      .crit.ok {
        border-color: var(--ok);
      }
      .tg {
        display: flex;
        gap: 8px;
      }
      .tg button {
        min-width: 72px;
        min-height: 46px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #d5dbe0;
        background: #fff;
        color: var(--ink);
        font:
          700 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      .tg .ok {
        background: var(--okb);
        color: var(--ok);
        border-color: var(--ok);
      }
      .tg .no {
        background: var(--nob);
        color: var(--no);
        border-color: var(--no);
      }
      .def {
        margin-top: 10px;
        padding: 12px;
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 12px;
      }
      .ist-nr {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin: 8px 0;
      }
      .ist-nr .h {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .ist-b {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        white-space: nowrap;
        height: fit-content;
      }
      .ist-b.o {
        background: #fee2e2;
        color: #b91c1c;
      }
      .ist-b.r {
        background: #dcfce7;
        color: #15803d;
      }
      .ist-lb {
        z-index: 60;
      }
      .ov > div.ist-m {
        max-width: 1060px;
        max-height: 94vh;
        max-height: 94dvh;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .ist-m .tl div {
        padding: 5px 0;
        font-size: 13px;
      }
      .ist-m h4 {
        margin: 12px 0 4px;
      }
      .ist-g {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 22px;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .ist-g > div {
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }
      .ist-g.s {
        grid-template-columns: minmax(0, 1fr);
      }
      .ist-g details {
        margin-top: 0 !important;
      }
      .ist-pp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 6px;
      }
      .ist-lb > div.ist-lbc {
        max-width: min(96vw, 1100px);
        max-height: 96vh;
        max-height: 96dvh;
        padding: 14px;
      }
      .ist-lbc img {
        max-width: 100%;
        max-height: calc(100vh - 190px);
        max-height: calc(100dvh - 190px);
        border-radius: 10px;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .ist-g,
        .ist-pp {
          grid-template-columns: minmax(0, 1fr);
        }
        .ov > div.ist-m {
          display: block;
          overflow: auto;
        }
        .ist-g {
          display: block;
          overflow: visible;
        }
        .ist-g > div {
          overflow: visible;
        }
      }
      .ph {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0;
      }
      .ph img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .lbl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        color: var(--ink);
      }
      .lbl:hover {
        border-color: var(--teal-dark);
        background: #eefaf7;
      }
      .lbl input {
        display: none;
      }
      /* dashboard */
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .kpi:hover {
        border-color: var(--teal);
      }
      .kpi.on {
        border-color: var(--teal);
        box-shadow: 0 0 0 2px var(--tb);
      }
      .kpi b {
        display: block;
        font:
          800 26px Manrope,
          system-ui,
          sans-serif;
        margin-top: 4px;
      }
      .al {
        background: #fef3e2;
        color: #92400e;
        border: 1px solid #fde8c8;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .list-scroll {
        max-height: 55vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .list-scroll .card:last-child {
        margin-bottom: 0;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 600px;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #eef1f3;
        font-size: 12.5px;
        white-space: nowrap;
      }
      #tb .btn.sm {
        padding: 4px 8px;
        min-height: 28px;
        font-size: 11.5px;
      }
      .list-scroll thead th {
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 2;
      }
      .pg-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      /* datepicker ZZ.LL.AAAA */
      .dp {
        position: relative;
      }
      .dp .dp-txt {
        cursor: pointer;
        background: #fff;
        padding-right: 16px;
      }
      .dp .dp-native {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      /* filtre Statistici: padding vertical minim */
      .sta-filters input,
      .sta-filters select {
        padding-top: 6px;
        padding-bottom: 6px;
        min-height: 34px;
      }
      /* tabel Statistici: fără scroll orizontal pe desktop, coloane compacte */
      .tbl-sta th,
      .tbl-sta td {
        white-space: normal;
        word-break: break-word;
        padding: 3px 6px;
      }
      .tbl-sta {
        min-width: 0;
        width: 100%;
      }
      .tbl-sta .mono {
        font-size: 11px;
      }
      /* pe mobil: revenire la nowrap + glisare orizontală (mai lizibil decât wrap pe litere) */
      @media (max-width: 820px) {
        .tbl-sta th,
        .tbl-sta td {
          white-space: nowrap;
          word-break: normal;
          padding: 4px 8px;
        }
        .tbl-sta {
          min-width: 760px;
          width: auto;
        }
        .tbl-sta .mono {
          font-size: 12.5px;
        }
      }
      th {
        color: var(--mut);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: #f8fafb;
      }
      tbody tr {
        background: #fff;
        transition: background-color 0.12s ease;
      }
      tbody tr:nth-child(2n) {
        background: #fafbfc;
      }
      tbody tr:hover {
        background: #eefaf7;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      /* bara de jos a fișei */
      .foot {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(
          to top,
          var(--bg) 82%,
          rgba(245, 247, 248, 0)
        );
      }
      /* autentificare */
      .auth {
        max-width: 380px;
        margin: 8vh auto;
        padding: 0 16px;
      }
      .auth h2 {
        font-size: 22px;
        margin: 0 0 14px;
      }
      .auth .card {
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }
      .auth .card > * {
        margin-bottom: 12px;
      }
      .auth .card > *:last-child {
        margin-bottom: 0;
      }
      /* notificare + fereastră modală */
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--graphite);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 99;
        display: none;
        max-width: 92%;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
      }
      #toast.e {
        background: var(--no);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(15, 20, 25, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
        animation: fadeIn 0.25s ease;
      }
      .ov > div {
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        max-height: 88dvh;
        overflow: auto;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
      }
      .tl div {
        padding: 8px 0;
        border-bottom: 1px solid #eef1f3;
        font-size: 14px;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header .btn.gh {
        background: transparent;
      }
      header .btn.gh:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* ---- tablete și telefoane ---- */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px;
          min-height: 46px;
        }
        .btn {
          min-height: 48px;
        }
        .btn.sm {
          min-height: 44px;
        }
        .lbl {
          min-height: 48px;
        }
        .tg button {
          min-height: 50px;
          min-width: 80px;
        }
        nav button {
          min-height: 52px;
        }
        th,
        td {
          padding: 10px 12px;
        }
      }
      @media (max-width: 820px) {
        main {
          padding: 12px 12px calc(32px + env(safe-area-inset-bottom, 0px));
        }
        .card {
          padding: 14px;
        }
        .ov {
          padding: 0;
          align-items: flex-end;
        }
        .ov > div {
          max-width: none;
          border-radius: 20px 20px 0 0;
          max-height: 92vh;
          max-height: 92dvh;
        }
      }
      @media (max-width: 640px) {
        .row[style*="nowrap"] {

      /* ---------- Utilitare pentru volume mari ---------- */
      const PAGE_MAX = 1000; /* limita implicită Supabase/PostgREST pe un răspuns */
      /* Citește toate paginile unei interogări (mk(de, până) întoarce interogarea cu .range aplicat).
         Întoarce { rows, truncated } – truncated = true dacă s-a atins plafonul "max". */
      async function fetchAll(mk, max = 20000) {
        const rows = [];
        for (let from = 0; from < max; from += PAGE_MAX) {
          const { data, error } = await mk(from, from + PAGE_MAX - 1);
          if (error) throw error;
          rows.push(...(data || []));
          if (!data || data.length < PAGE_MAX) return { rows, truncated: false };
        }
        return { rows, truncated: true };
      }
      /* .in("col", ids) cu liste lungi depășește lungimea URL-ului: se sparge în pachete. */
      async function inChunks(ids, mk, size = 100) {
        const parts = [];
        for (let i = 0; i < ids.length; i += size) parts.push(ids.slice(i, i + size));
        const res = await Promise.all(parts.map(mk));
        return res.flatMap((r) => r.data || []);
      }
      const likeSafe = (q) => String(q || "").trim().replace(/[%_\\]/g, "");
      const debounce = (fn, ms = 300) => {

 }

        c.height = Math.round(b.height * k);
        c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
        return new Promise((r) => c.toBlob(r, "image/jpeg", 0.8));

      async function computeIndicatori0() {
        const de = new Date(Date.now() - 30 * 864e5).toISOString();
        const { rows } = await fetchAll((a, b) =>
          sb
            .from("asm_etape")
            .select("id,asm_produs_id,tip,rezultat,durata_sec,ended_at")
            .not("ended_at", "is", null)
            .gte("ended_at", de)
            .order("ended_at", { ascending: false })
            .order("id")
            .range(a, b),
        );
        const avg = (arr) =>
          arr.length
            ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length)
            : null;
        const asmOk = rows
          .filter((r) => r.tip === "asamblare" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const remOk = rows
          .filter((r) => r.tip === "remediere" && r.rezultat === "ok")
          .map((r) => r.durata_sec);
        const ctcOk = rows.filter(
          (r) => r.tip === "ctc" && r.rezultat === "ok",
        );
        let pctPrima = "—";
        if (ctcOk.length) {
          const ids = [...new Set(ctcOk.map((r) => r.asm_produs_id))];
          const remAny = await inChunks(ids, (ch) =>
            sb
              .from("asm_etape")
              .select("asm_produs_id")
              .eq("tip", "remediere")
              .in("asm_produs_id", ch),
          );
          const cuRemediere = new Set(remAny.map((r) => r.asm_produs_id));
          const primaOk = ctcOk.filter(
            (r) => !cuRemediere.has(r.asm_produs_id),
          ).length;
          pctPrima = Math.round((primaOk / ctcOk.length) * 100) + "%";
        }
        const { rows: nok } = await fetchAll(
          (a, b) =>
            sb
              .from("asm_checklist_rezultate")
              .select("id,text_criteriu")
              .eq("rezultat", "nok")
              .gte("bifat_la", de)
              .order("bifat_la", { ascending: false })
              .order("id")
              .range(a, b),
          10000,
        );
        let topCrit = "—";
        if (nok && nok.length) {
          const cnt = {};
          nok.forEach(
            (r) => (cnt[r.text_criteriu] = (cnt[r.text_criteriu] || 0) + 1),
          );
          topCrit = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
        }
        const card = (l, v) =>
          `<div><div class="mut">${l}</div><b style="font-size:20px">${v}</b></div>`;
        return `<div class="kpis" style="margin-top:0;margin-bottom:0">${card("Timp mediu asamblare", asmOk.length ? dur(avg(asmOk) * 1e3) : "—")}${card("Aprobate din prima la CTC", pctPrima)}${card("Timp mediu remediere", remOk.length ? dur(avg(remOk) * 1e3) : "—")}${card("Criteriu cu cele mai multe NOK", esc(topCrit))}</div>`;
      }

      function istNereguli(ner, etape, vin) {

        IST.i = 0;
        if (!ner.length) return { h: "", c: 0 };
        const eMap = new Map(etape.map((e) => [e.id, e])),
          ET = { asamblare: "Asamblare", remediere: "Remediere", ctc: "CTC" },
          slug = (x) => String(x || "").replace(/[^A-Za-z0-9_-]+/g, "");
        let total = 0;
        const cards = ner
          .map((n, k) => {
            const e = eMap.get(n.etapa_id),
              et = e ? e.tip : "",
              rem = n.status === "remediata",
              poze = (n.asm_poze || [])
                .slice()
                .sort((a, b) =>
                  String(a.storage_path).localeCompare(String(b.storage_path)),
                ),
              titlu = n.criteriu_text || "Neregulă " + (k + 1),
              th = (tip) => {
                const lst = poze.filter((p) => p.tip === tip);
                if (!lst.length) return '<span class="mut">—</span>';
                return lst
                  .map((p, j) => {
                    const idx = IST.items.length,

                      stg = tip === "dupa" ? "Remediere" : ET[et] || "—";
                    IST.items.push({
                      path: p.storage_path,
                      cap: `Neregula ${k + 1}: ${titlu} · ${tip === "dupa" ? "După" : "Înainte"} · ${stg}${ts ? " · " + dt(Number(ts)) : ""}`,
                      name: `${slug(vin)}_${slug(tip === "dupa" ? "remediere" : et || "etapa")}_neregula${k + 1}_${tip}_${j + 1}.jpg`,
                    });
                    total++;
                    return `<img data-p="${esc(p.storage_path)}" data-a="istlb" data-i="${idx}" loading="lazy" alt="">`;
                  })
                  .join("");
              };
            const inainte = th("inainte"),
              dupa = th("dupa");
            return `<div class="ist-nr"><div class="h"><span>${esc(titlu)}</span><span class="ist-b ${rem ? "r" : "o"}">${rem ? "REMEDIATĂ" : "DESCHISĂ"}</span></div>
 <div style="font-size:13px;margin:4px 0">${esc(n.descriere || "—")}</div>
 <div class="mut" style="font-size:12px">Constatată la ${esc(ET[et] || "—")}${e ? " · " + esc(nm(e.user_id)) : ""} · ${dt(n.created_at)}</div>
 ${rem ? `<div class="mut" style="font-size:12px">Remediată${n.remediata_de ? " de " + esc(nm(n.remediata_de)) : ""}${n.remediata_la ? " · " + dt(n.remediata_la) : ""}${n.nota_remediere ? " — " + esc(n.nota_remediere) : ""}</div>` : ""}
 <div class="ist-pp"><div><div class="mut" style="font-size:12px">Înainte</div><div class="ph">${inainte}</div></div>
 <div><div class="mut" style="font-size:12px">După</div><div class="ph">${dupa}</div></div></div></div>`;
          })
          .join("");
        return {
          c: total,
          h: `<details id="ist-nr" style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">📷 Nereguli și poze (${ner.length} · ${total} poze)</summary>${cards}</details>`,

      function istInit(o) {
        const d = o.querySelector("#ist-nr");
        if (!d) return;
        d.addEventListener("toggle", async () => {
          if (!d.open || IST.signed || !IST.items.length) return;
          IST.signed = true;
          const { data, error } = await sb.storage
            .from(B)
            .createSignedUrls(
              IST.items.map((x) => x.path),
              3600,
            );
          if (error) {
            IST.signed = false;
            return toast(error.message, 1);
          }
          (data || []).forEach((u) => (IST.url[u.path] = u.signedUrl));
          d.querySelectorAll("img[data-p]").forEach((im) => {
            const u = IST.url[im.dataset.p];
            if (u) im.src = u;
          });
        });
      }
      function istKey(e) {
        if (e.key === "Escape") istLbX();
        else if (e.key === "ArrowLeft") istLb(IST.i - 1);
        else if (e.key === "ArrowRight") istLb(IST.i + 1);
      }
      function istLbX() {
        document.querySelector(".ist-lb")?.remove();
        document.removeEventListener("keydown", istKey);
      }
      function istLb(i) {
        const n = IST.items.length;
        if (!n) return;
        i = (((Number(i) % n) + n) % n);
        IST.i = i;
        const it = IST.items[i],
          u = IST.url[it.path] || "";
        let o = document.querySelector(".ist-lb");
        if (!o) {
          o = document.createElement("div");
          o.className = "ov ist-lb";
          document.body.appendChild(o);
          document.addEventListener("keydown", istKey);
        }
        o.innerHTML = `<div class="ist-lbc" style="text-align:center"><img src="${u}" alt=""><p class="mut" style="margin:8px 0">${esc(it.cap)}</p><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px"><button class="btn gh sm" data-a="istnav" data-d="-1">‹</button><span class="mut">${i + 1} / ${n}</span><button class="btn gh sm" data-a="istnav" data-d="1">›</button><button class="btn sm" data-a="istdl">Descarcă</button><button class="btn gh sm" data-a="istlbx">Închide</button></div></div>`;
      }

      async function fetchImgDataUrl(url) {
        try {
          const r = await fetch(url);
          const b = await r.blob();
          return await new Promise((res, rej) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.onerror = rej;
            fr.readAsDataURL(b);
          });
        } catch (e) {
          return null;
        }
      }
      function imgDims(u) {
        return new Promise((res) => {
          const im = new Image();
          im.onload = () =>
            res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
          im.onerror = () => res({ w: 4, h: 3 });
          im.src = u;
        });
      }

            font("normal", 8.5);
            return r
              ? doc.splitTextToSize(String(r.text_criteriu || ""), cw2 - 9)
              : [];
          };
          for (let i = 0; i < half; i++) {
            const a = L[i],
              b = R[i],
              la = wrap(a),
              lb = wrap(b),
              rh = Math.max(la.length, lb.length, 1) * 3.8 + 1.4;
            ensure(rh);
            [
              [a, la, MX],
              [b, lb, X2],
            ].forEach(([r, ls, x]) => {
              if (!r) return;
              const ok = r.rezultat === "ok";
              font("bold", 8);
              if (ok) doc.setTextColor(22, 128, 61);
              else doc.setTextColor(185, 28, 28);
              doc.text(ok ? "OK" : "NOK", x, y + 3);
              font("normal", 8.5);
              ink();
              doc.text(ls, x + 9, y + 3);
            });
            y += rh;
          }
          y += 1.5;
        }
        if (!vreunChecklist) p("Fără rezultate de checklist înregistrate.");
        y += 3;

        /* ===== 4. Nereguli constatate ===== */
        sec("Nereguli constatate", (ner || []).length ? 55 : 14);
        if (!(ner || []).length) p("Nicio neregulă înregistrată.");
        const PS = 26,
          PG = 2;
        for (const n of ner || []) {
          const tip = TLN[etapaTip.get(n.etapa_id)] || "",
            tt = `${tip}${tip ? " — " : ""}${n.criteriu_text || "În afara checklist-ului"}`,
            rem = n.status === "remediata";
          font("bold", 9);
          const tl = doc.splitTextToSize(tt, CW - 28);
          font("normal", 8.5);
          const dl = doc.splitTextToSize(n.descriere || "—", CW);
          const sTxt = rem
            ? `Remediată${n.remediata_de ? " de " + nm(n.remediata_de) : ""}${n.remediata_la ? " la " + dt(n.remediata_la) : ""}${n.nota_remediere ? " — notă: " + n.nota_remediere : ""}`
            : "";
          font("normal", 8);
          const sl = sTxt ? doc.splitTextToSize(sTxt, CW) : [];
          const bef = n.asm_poze.filter(
              (x) => x.tip === "inainte" && imgCache[x.storage_path],
            ),
            aft = n.asm_poze.filter(
              (x) => x.tip === "dupa" && imgCache[x.storage_path],
            ),
            rows = Math.ceil(Math.max(bef.length, aft.length) / 3);
          const textH = tl.length * 3.9 + dl.length * 3.8 + sl.length * 3.5 + 3;
          ensure(textH + (rows ? 4 + PS + PG : 0));
          font("bold", 9);
          ink();
          doc.text(tl, MX, y + 3);
          font("bold", 8);
          if (rem) doc.setTextColor(22, 128, 61);
          else doc.setTextColor(185, 28, 28);
          doc.text(rem ? "REMEDIATĂ" : "DESCHISĂ", PW - MX, y + 3, {
            align: "right",
          });
          y += tl.length * 3.9 + 1.2;
          font("normal", 8.5);
          ink();
          doc.text(dl, MX, y + 3);
          y += dl.length * 3.8 + 0.6;
          if (sl.length) {
            font("normal", 8);
            gray();
            doc.text(sl, MX, y + 3);
            y += sl.length * 3.5 + 1.5;
          }
          if (rows) {
            font("normal", 8);
            gray();
            if (bef.length) doc.text("Înainte", MX, y + 2.5);
            if (aft.length) doc.text("După", MX + colW + 6, y + 2.5);
            y += 4;
            for (let r = 0; r < rows; r++) {
              ensure(PS + PG);
              for (const [arr, bx] of [
                [bef, MX],
                [aft, MX + colW + 6],
              ]) {
                for (let k = 0; k < 3; k++) {
                  const ph = arr[r * 3 + k];
                  if (!ph) continue;
                  const d = imgCache[ph.storage_path];
                  try {
                    const dm = await imgDims(d);
                    let w = PS,
                      hh = (w * dm.h) / dm.w;
                    if (hh > PS) {
                      hh = PS;
                      w = (hh * dm.w) / dm.h;
                    }
                    doc.addImage(d, "JPEG", bx + k * (PS + PG), y, w, hh);
                  } catch (er) {}
                }
              }
              y += PS + PG;
            }
          }
          y += 1;
          thin();
          doc.line(MX, y, PW - MX, y);
          y += 3;
        }

        /* ===== Subsol: numerotare pagini ===== */
        const np = doc.getNumberOfPages();
        for (let i = 1; i <= np; i++) {
          doc.setPage(i);
          thin();
          doc.line(MX, PH - 10, PW - MX, PH - 10);
          font("normal", 8);
          gray();
          doc.text("GEELI GENERATION ELECTRIC SRL", MX, PH - 6.5);
          doc.text(`Pagina ${i}/${np}`, PW - MX, PH - 6.5, { align: "right" });
        }

        doc.save(
          `fisa-asamblare-${String(prod.vin || asmId).replace(/[^a-zA-Z0-9-]/g, "")}.pdf`,
        );
      }
      async function vCheck(c) {
        const { data } = await sb
            .from("asm_checklist_sabloane")
            .select("*")
            .order("model_key", { nullsFirst: true })
            .order("ordine"),
          d = data || [];
        const asmR = d.filter((x) => x.tip === "asamblare"),
          ctcR = d.filter((x) => x.tip === "ctc");
        const groups = [];
        asmR.forEach((x) => {
          const k = x.model_key || "";
          if (!groups.some((g) => g.key === k))
            groups.push({
              key: k,
              model: x.model,
              rows: asmR.filter((y) => (y.model_key || "") === k),
            });
        });
        const row = (x, showModel) =>
          `<div class="crit-row"><input type="number" data-c="sab" data-f="ordine" data-id="${x.id}" value="${x.ordine}">${showModel ? `<input data-c="sab" data-f="model" data-id="${x.id}" value="${esc(x.model || "")}" placeholder="Model" list="dl-modele" autocomplete="off">` : ""}<input data-c="sab" data-f="text" data-id="${x.id}" value="${esc(x.text)}"><label><input type="checkbox" data-c="sab" data-f="activ" data-id="${x.id}" ${x.activ ? "checked" : ""}> activ</label><button class="btn gh sm" data-a="delsab" data-id="${x.id}" title="Șterge (istoricul rămâne)">✕</button></div>`;
        c.innerHTML = `<div class="card"><h3 style="margin-top:0">Criterii asamblare — pe model</h3>
 <div class="add-row">
   <input id="nm-asamblare" list="dl-modele" placeholder="Model..." value="${esc(ultimulModel)}" autocomplete="off">
   <input id="ns-asamblare" list="dl-crit-asamblare" placeholder="Criteriu nou..." autocomplete="off">
   <button type="button" class="btn gh sm" id="btn-imp-crit" title="Importă criterii din Excel/CSV (rândul 1 = antet, se ignoră)">📊</button>
   <input type="file" id="file-imp-crit" accept=".xlsx,.xls,.csv" style="display:none">
   <button class="btn" data-a="addsab" data-t="asamblare">Adaugă</button>
 </div>
 ${
   groups
     .map((g) => {
       const open = modeleExpandate.has(g.key);
       return `<div style="border-top:1px solid var(--line);padding-top:6px;margin-top:6px">
   <div class="row" style="margin-bottom:4px"><h4 style="margin:0"><button class="model-toggle" data-a="togmodel" data-key="${esc(g.key)}" title="${open ? "Restrânge" : "Expandează"}">${open ? "−" : "+"}</button>${g.key ? esc(g.model) : '<span class="mut">Fără model — completează câmpul „Model" pe fiecare rând ca să se aplice</span>'}</h4>${g.key ? `<button class="btn gh sm" data-a="dupmodel" data-key="${esc(g.key)}">Copiază la alt model</button>` : ""}</div>
   ${open ? g.rows.map((x) => row(x, true)).join("") : ""}
 </div>`;
     })
     .join("") || '<div class="mut">Niciun criteriu de asamblare încă.</div>'
 }
 </div>
 <div class="card"><h3 style="margin-top:0">Criterii CTC</h3>
 <div class="add-row">
   <input id="ns-ctc" list="dl-crit-ctc" placeholder="Criteriu nou..." autocomplete="off">
   <button class="btn" data-a="addsab" data-t="ctc">Adaugă</button>
 </div>
 <button class="model-toggle" data-a="togctc" style="display:block;margin:2px 0 8px" title="${ctcExpandat ? "Restrânge" : "Expandează"}">${ctcExpandat ? "− Criterii" : "+ Criterii"}</button>
 ${ctcExpandat ? ctcR.map((x) => row(x, false)).join("") || '<div class="mut">Niciun criteriu.</div>' : ""}
 </div>
 <datalist id="dl-modele"></datalist>
 <datalist id="dl-crit-asamblare">${[
   ...new Set(asmR.map((x) => x.text.trim()).filter(Boolean)),
 ]
   .sort((a, b) => a.localeCompare(b, "ro"))
   .map((t) => `<option value="${esc(t)}">`)
   .join("")}</datalist>
 <datalist id="dl-crit-ctc">${[
   ...new Set(ctcR.map((x) => x.text.trim()).filter(Boolean)),
 ]
   .sort((a, b) => a.localeCompare(b, "ro"))
   .map((t) => `<option value="${esc(t)}">`)
   .join("")}</datalist>
 <div class="mut">Modificările se aplică fișelor deschise ulterior. Rezultatele deja salvate păstrează textul criteriului de la data verificării.</div>`;
        refreshModeleDatalist("");
        $("#btn-imp-crit").onclick = () => $("#file-imp-crit").click();
        $("#file-imp-crit").onchange = (e) =>
          handleImportCriterii(e.target.files[0]);
      }
      let dlModeleT;
      function parseCSVFirstCol(text) {
        return text
          .split(/\r\n|\n|\r/)
          .filter((l) => l.length)
          .map((line) => {
            if (line[0] === '"') {
              let i = 1,
                out = "";
              while (i < line.length) {
                if (line[i] === '"' && line[i + 1] === '"') {
                  out += '"';
                  i += 2;
                } else if (line[i] === '"') {
                  i++;
                  break;
                } else {
                  out += line[i];
                  i++;
                }
              }
              return out.trim();
            }
            const idx = line.indexOf(",");
            return (idx === -1 ? line : line.slice(0, idx)).trim();
          });
      }
      async function parseCriteriiFile(file) {
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        if (ext === "csv") {
          const text = await file.text();
          return parseCSVFirstCol(text).slice(1);
        }
        const buf = await file.arrayBuffer();
        await loadExcelJS();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        const ws = wb.worksheets[0];
        if (!ws) return [];
        const out = [];
        ws.eachRow((row) => {
          const v = row.getCell(1).value;
          out.push(
            v == null
              ? ""
              : typeof v === "object" && v.text
                ? String(v.text).trim()
                : String(v).trim(),
          );
        });
        return out.slice(1);
      }
      async function handleImportCriterii(file) {
        if (!file) return;
        const model = $("#nm-asamblare").value.trim();
        const fi = $("#file-imp-crit");
        if (!model) {
          if (fi) fi.value = "";
          return toast("Completează modelul pentru acest criteriu.", 1);
        }
        let rows;
        try {
          rows = await parseCriteriiFile(file);
        } catch {
          if (fi) fi.value = "";
          return toast(
            "Fișierul nu a putut fi citit. Salvează-l ca .xlsx sau .csv și încearcă din nou.",
            1,
          );
        }
        if (fi) fi.value = "";
        const texte = [
          ...new Set(rows.map((t) => (t || "").trim()).filter(Boolean)),
        ];
        if (!texte.length)
          return toast("Nu am găsit niciun criteriu în fișier.", 1);
        const mk = modelKey(model);
        const { data: exist } = await sb
          .from("asm_checklist_sabloane")
          .select("text")
          .eq("tip", "asamblare")
          .eq("model_key", mk);
        const existSet = new Set(
          (exist || []).map((x) => x.text.trim().toLowerCase()),
        );
        showImportPreview(model, texte, existSet);
      }
      function showImportPreview(model, texte, existSet) {
        const items = texte.map((t, i) => ({
          i,
          t,
          dup: existSet.has(t.toLowerCase()),
        }));
        const noi = items.filter((x) => !x.dup).length;
        const o = document.createElement("div");
        o.className = "ov";
        o.innerHTML = `<div><div class="row"><h3 style="margin:0">Import criterii — ${esc(model)}</h3><button class="btn gh sm" data-a="close">Închide</button></div>
 <p class="mut">${items.length} criterii găsite în fișier${items.length - noi ? `, ${items.length - noi} deja existente la acest model (marcate, neimportabile)` : ""}.</p>
 <div class="tl" style="max-height:50vh;overflow-y:auto">${items
   .map(
     (x) =>
       `<div><label style="display:flex;align-items:center;gap:8px${x.dup ? ";opacity:.5" : ""}"><input type="checkbox" data-imp-chk data-i="${x.i}" ${x.dup ? "disabled" : "checked"} style="width:auto"><span>${esc(x.t)}${x.dup ? ' <span class="mut">(există deja)</span>' : ""}</span></label></div>`,
   )
   .join("")}</div>
 <div class="foot"><button class="btn gh" data-a="close">Anulează</button><button class="btn" id="btn-conf-imp">Importă (${noi})</button></div></div>`;
        document.body.appendChild(o);
        const updateCount = () => {
          const n = o.querySelectorAll("[data-imp-chk]:checked").length;
          const b = $("#btn-conf-imp");
          b.textContent = `Importă (${n})`;
          b.disabled = !n;
        };
        o.querySelectorAll("[data-imp-chk]").forEach(
          (cb) => (cb.onchange = updateCount),
        );
        $("#btn-conf-imp").onclick = async () => {
          const alese = items
            .filter((x) => !x.dup)
            .filter(
              (x) => o.querySelector(`[data-imp-chk][data-i="${x.i}"]`).checked,
            )
            .map((x) => x.t);
          if (!alese.length) return;
          await confirmaImportCriterii(model, alese);
          o.remove();
        };
      }
      async function confirmaImportCriterii(model, texte) {
        const mk = modelKey(model);
        const { data: ex } = await sb
          .from("asm_checklist_sabloane")
          .select("ordine")
          .eq("tip", "asamblare")
          .eq("model_key", mk);
        let next = Math.max(0, ...(ex || []).map((x) => x.ordine));
        const rows = texte.map((t) => ({
          tip: "asamblare",
          model,
          text: t,
          ordine: ++next,
        }));
        const r = await sb.from("asm_checklist_sabloane").insert(rows);
        if (r.error) return toast(r.error.message, 1);
        ultimulModel = model;
        modeleExpandate.add(mk);
        toast(`${rows.length} criterii importate la modelul „${model}".`);
        go("checklist");
      }
      async function refreshModeleDatalist(q) {
        let data = null;
        try {
          const res = await sb.rpc("asm_modele_antedepozit", { p_q: q });
          data = res.data;
          if (res.error) console.error(res.error);
        } catch (err) {
          console.error(err);
        }
        const dl = $("#dl-modele");
        if (dl)
          dl.innerHTML = (data || [])
            .map((r) => `<option value="${esc(r.model)}">`)
            .join("");
      }
      document.addEventListener("input", (e) => {
        if (
          e.target.getAttribute &&
          e.target.getAttribute("list") === "dl-modele"
        ) {
          clearTimeout(dlModeleT);
          const val = e.target.value;
          dlModeleT = setTimeout(() => refreshModeleDatalist(val), 250);
        }
      });
      function vSet(c) {
        const f = (k, l, ty = "number") =>
          `<div style="margin-bottom:10px"><div class="mut">${l}</div>${ty === "checkbox" ? `<input type="checkbox" style="width:auto" data-c="set" data-f="${k}" ${S[k] ? "checked" : ""}>` : `<input type="number" min="1" data-c="set" data-f="${k}" value="${S[k]}">`}</div>`;
        c.innerHTML = `<div class="card" style="max-width:420px">${f("max_in_lucru", "Produse simultane per utilizator")}${f("prag_alerta_ore", "Alertă produs în lucru (ore)")}${f("poze_obligatorii", "Poză obligatorie la fiecare neregulă", "checkbox")}</div>`;
      }
      boot0();
    </script>

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker înregistrat cu succes!"))
            .catch((err) =>
              console.error("Eroare la înregistrarea Service Worker:", err),
            );
        });
      }
    </script>
